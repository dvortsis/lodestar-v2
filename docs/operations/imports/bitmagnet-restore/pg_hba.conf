# Lodestar bitmagnet restore (docs/operations/imports/bitmagnet-restore.md).
# Unix-socket logins only; the server listens on no TCP address at all.
#   - the importer's read-only role, with its password;
#   - the admin, only from inside the container (docker exec -u postgres).
# Anything else is refused.
local   bitmagnet   bitmagnet_reader   scram-sha-256
local   all         postgres           peer
