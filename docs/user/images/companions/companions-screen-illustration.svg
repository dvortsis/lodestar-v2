  <rect x="332" y="148" width="188" height="28" rx="4" fill="#ffffff" stroke="#4a4357"/>
  <text x="426" y="167" text-anchor="middle" font-family="Atkinson Hyperlegible Next, sans-serif" font-size="12" fill="#2b2433">Run as its own container</text>
