[package]
name = "lodestar-bench"
description = "Synthetic dataset generator and size/performance reports"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
encoding_rs = "0.8.35"
lodestar-bencode.workspace = true
lodestar-metainfo.workspace = true
lodestar-pipeline.workspace = true
lodestar-search.workspace = true
lodestar-store.workspace = true
# The scrape soak runs against the in-process fake trackers.
lodestar-tracker-scrape = { workspace = true, features = ["testing"] }
rand = "0.10.3"
rand_chacha = "0.10.0"
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "time"] }

# `examples/reporting-overhead.rs` drives the API's router in process. As
# dev-dependencies they stay out of the bench gates' change detection
# (`.github/scripts/ci_changes.py`), so an API change doesn't start them.
[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query", "matched-path"] }
lodestar-api.workspace = true
tower = { version = "0.5.3", features = ["util"] }
# `examples/mem-ingest.rs` and `examples/mem-churn.rs` (R-mem-triage): the
# real ingest path and the fetch pool's eviction path, measured with the
# allocator `serve` uses, the system allocator, or dhat's heap profiler.
dhat = "0.3"
lodestar-peer-wire.workspace = true
lodestar-sources.workspace = true
# `extended`: `stats_json`, for `examples/mem-cheap.rs`'s committed bytes.
mimalloc = { version = "0.1", default-features = false, features = ["extended"] }
# `examples/mem-merge.rs` (X-merge-policy) builds the search writers itself
# to set their merge policy; the same version and features as the search
# crate, so nothing new is compiled.
tantivy = { version = "0.27.0", default-features = false, features = ["mmap", "lz4-compression", "zstd-compression", "stemmer"] }

[features]
# `mem-ingest` under dhat's heap profiler (writes dhat-heap.json).
dhat-heap = []
# `mem-ingest` with the system allocator, for comparison.
system-alloc = []
# mimalloc v2 in place of v3, for X-merge-policy's diagnostic arm.
mimalloc-v2 = ["mimalloc/v2"]
# mimalloc also as the C `malloc` (the release build's `override`), for
# `examples/mem-cheap.rs`'s comparison (X-mimalloc-override).
mimalloc-override = ["mimalloc/override"]

# The mmap-cache retention test (X-mmap-cache-prune) runs in release in its
# own CI job; the feature keeps the workspace run from building it.
[[test]]
name = "mmap_retention"
required-features = ["dhat-heap"]

[lints]
workspace = true
