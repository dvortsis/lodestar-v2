name: CI

# A pull request runs only the jobs its files need (.github/scripts/ci_changes.py):
# docs or web-only changes skip the Rust jobs, the benchmark and importer gates
# run when a crate they build changes, and each fuzz target runs when a crate it
# builds changes. macOS tests run on main and nightly, or on a PR labelled
# `full-ci`, which also runs everything else. Main and nightly always run it all.
# Labels are read on the next push; `labeled` isn't a trigger, because a run
# whose jobs all skip would replace the head's failed checks with skipped ones.
# To run everything now, add `full-ci` and start CI (and Release) by hand on
# the branch (workflow_dispatch runs everything). A manual run tests the branch
# head without main merged in, so if the PR run is red, push or merge main
# instead: a passing manual run would replace the failed checks.
# Skipped jobs show as skipped; a skipped matrix job keeps its unexpanded name
# (`test (${{ matrix.os }})`), so branch protection requires the aggregate
# `ci-ok` job (at the end) rather than individual matrix entries.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Scheduled runs get their own group, so a push to main can't cancel
  # the nightly (G-m5a).
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  # Only pull requests cancel superseded runs; main runs finish in order.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.c.outputs.rust }}
      test_os: ${{ steps.c.outputs.test_os }}
      bench: ${{ steps.c.outputs.bench }}
      filter: ${{ steps.c.outputs.filter }}
      importer: ${{ steps.c.outputs.importer }}
      log_bench: ${{ steps.c.outputs.log_bench }}
      mmap_retention: ${{ steps.c.outputs.mmap_retention }}
      fuzz: ${{ steps.c.outputs.fuzz }}
      soak_tools: ${{ steps.c.outputs.soak_tools }}
      unraid: ${{ steps.c.outputs.unraid }}
      companion_pins: ${{ steps.c.outputs.companion_pins }}
      infra: ${{ steps.c.outputs.infra }}
      update_manifest: ${{ steps.c.outputs.update_manifest }}
      advisories: ${{ steps.c.outputs.advisories }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The merge-guard hook runs before every Bash call in every session; a
      # syntax error there would exit 2 and block them all.
      - run: bash -n .claude/hooks/merge-guard.sh
      # main's history was rewritten on 2026-10-30 (docs/owner-decisions.md
      # §2.25). A head that still contains the old root or the old main tip
      # would merge the removed history back in, so it fails here.
      - name: lineage guard
        env:
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          # A head missing from the clone would read as "not an ancestor".
          git cat-file -e "$HEAD^{commit}" || { echo "::error::$HEAD is not in the checkout."; exit 1; }
          for old in 1562068349a6463990b5b07cfc810ff2680b1c03 2d5e761d30cb1b7947fb09493959668eabcb84ab; do
            if git merge-base --is-ancestor "$old" "$HEAD" 2>/dev/null; then
              echo "::error::$HEAD contains $old from the history before 2026-10-30. Rebuild the branch from the current main (docs/decisions/2026-10-30-master-plan.md)."
              exit 1
            fi
          done
      - id: c
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        # bash (not the default `bash -e`) sets pipefail, so a crash in the
        # script fails the job instead of leaving every output empty.
        shell: bash
        run: python3 .github/scripts/ci_changes.py "$EVENT" "$BASE" "$HEAD" "$LABELS" | tee -a "$GITHUB_OUTPUT"

  lint:
    name: fmt + clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Workspace builds unify the dev-only `testing` feature (CR-SIM's
      # simulator seams) into dht and sources; lint their production build.
      - run: cargo clippy -p lodestar-dht -p lodestar-sources --lib -- -D warnings
      - name: testing seams stay out of the binary
        run: |
          if cargo tree -e features -p lodestar \
            | grep -E 'lodestar-(dht|sources|companions) feature "testing"|tokio feature "test-util"'; then
            echo "::error::a test-only feature reaches the lodestar binary"; exit 1
          fi
      # First-party lines only through log_event! (architecture §12.1).
      - name: logging check
        env:
          BASE: ${{ github.base_ref || 'main' }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          python3 .github/scripts/test_log_lint.py
          python3 .github/scripts/test_workflow_concurrency.py
          python3 .github/scripts/log_lint.py --base FETCH_HEAD

  openapi:
    name: openapi.json drift
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The committed document must be what the DTOs generate: run
      # `cargo run -p lodestar --bin openapi` and commit the result.
      - run: cargo run -p lodestar --bin openapi
      - run: git diff --exit-code web/src/lib/api/openapi.json
      # Shipped Rust licences (owner's decision §2.12): web/licenses/rust.json must be what
      # `python3 .github/scripts/licenses.py` generates, and every crate must pass allow.json.
      - name: licences (rust.json drift and allowlist)
        run: |
          python3 .github/scripts/test_licenses.py
          python3 .github/scripts/licenses.py --check

  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.test_os != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.test_os) }}
    runs-on: ${{ matrix.os }}
    env:
      # Debug info is most of target/ (the Linux job filled 41 GB free on
      # 2026-11-05). Line tables keep backtraces with file:line. Also part of
      # rust-cache's key, so the old, fatter cache is not reused.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      # The workspace's test build no longer fits the Linux runner's free
      # disk (os error 28 on #432 and #434, 2026-11-04). Remove preinstalled
      # SDKs Lodestar never uses; nothing it builds or tests changes.
      - name: free disk space
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Linux never lints cfg(windows) code, so lint it here, before the tests
      # run in the same job (X-win-clippy).
      - name: clippy (Windows-only code)
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Disk numbers for the next time this job runs short (X-ci-disk).
      - name: disk after test build
        if: always() && runner.os == 'Linux'
        run: |
          df -h /
          du -sh target
          du -s target/debug/deps/* 2>/dev/null | sort -rn | head -15 \
            | awk '{printf "%7.0f MB  %s\n", $1/1024, $2}'
      # The DHT's tests in their production configuration (no `testing`),
      # which the workspace run above never builds.
      # Only lodestar-crawler-sim enables the `testing` seams, so these
      # build the production types (maps, hashers, sockets).
      - name: dht and sources tests without test seams
        if: runner.os == 'Linux'
        run: cargo test -p lodestar-dht -p lodestar-sources
      # DUR-26: the updater's persistence tests are Unix-only; a cfg that
      # compiled them out must not pass as zero tests run.
      - name: updater tests selected
        if: runner.os == 'Linux'
        run: |
          n=$(cargo test -p lodestar --bin lodestar update:: -- --list | grep -c ': test$' || true)
          echo "update:: selects $n tests"
          if [ "$n" -eq 0 ]; then echo "::error::no updater tests selected"; exit 1; fi
      # The PUID/PGID drop only happens as root (tests/privdrop.rs skips
      # otherwise). Built as the runner user, so target/ stays theirs.
      - name: privilege drop as root
        if: runner.os == 'Linux'
        run: |
          bin=$(cargo test -p lodestar --test privdrop --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.name == "privdrop") | .executable')
          sudo "$bin" --test-threads=1 --nocapture 2>&1 | tee privdrop.log
          if grep -q skipping privdrop.log; then
            echo "::error::the root-only tests skipped"; exit 1
          fi
          # The bin's own root-only unit tests (privdrop::tests::linux: the
          # data dir tree and the witness dir hand-over).
          unit=$(cargo test -p lodestar --bin lodestar --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.name == "lodestar" and (.target.kind | index("bin"))) | .executable')
          sudo "$unit" privdrop::tests::linux --test-threads=1 --nocapture 2>&1 | tee privdrop-unit.log
          if grep -q skipping privdrop-unit.log || ! grep -qE "test result: ok\. [1-9]" privdrop-unit.log; then
            echo "::error::the root-only privdrop unit tests skipped or failed"; exit 1
          fi
          # The maintenance commands drop root too (tests/cli.rs).
          cli=$(cargo test -p lodestar --test cli --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.name == "cli") | .executable')
          sudo "$cli" maintenance_runs_as_puid --exact --nocapture 2>&1 | tee cli-root.log
          if grep -q skipping cli-root.log || ! grep -q "1 passed" cli-root.log; then
            echo "::error::the root-only CLI test skipped"; exit 1
          fi
          # The worker's --data goes through the same drop (tests/worker_join.rs).
          wj=$(cargo test -p lodestar --test worker_join --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.name == "worker_join") | .executable')
          sudo "$wj" data_goes_through_the_privilege_drops_checks data_alone_is_the_folder_everything_uses \
            --exact --test-threads=1 --nocapture 2>&1 | tee worker-root.log
          if grep -q skipping worker-root.log || ! grep -qF "test result: ok. 2 passed" worker-root.log; then
            echo "::error::the root-only worker tests skipped or failed"; exit 1
          fi

  # Index and store size against the owner's §3 budgets, on 50k seeded
  # synthetic torrents (GS-gate). It runs on any change to a crate the bench
  # builds (search, classify, store and the rest, plus bench/ itself), and
  # ci-ok needs it, so a producer that takes the torrent index over 512 B is
  # red. It fails closed: size-report fails when it can't measure, and the
  # summary always says why.
  size-budget:
    name: size budget (§3)
    needs: changes
    if: needs.changes.outputs.bench == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Each step has its own $GITHUB_STEP_SUMMARY, so the report goes to a
      # file the next step can read.
      - name: size-report --gate
        run: cargo run --release -p lodestar-bench --bin size-report -- --torrents 50000 --gate --summary "$RUNNER_TEMP/size-report.md"
      - name: job summary
        if: always()
        shell: bash
        run: |
          if [ -s "$RUNNER_TEMP/size-report.md" ]; then
            cat "$RUNNER_TEMP/size-report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '### Size budget (§3): FAIL\n\nsize-report did not run or produce a report (setup, build or crash): see the step log.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

  search-latency:
    name: search latency (§3)
    needs: changes
    if: needs.changes.outputs.bench == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A regression gate at 200k; the 10M measurement is in §16.
      - run: cargo run --release -p lodestar-bench --bin search-bench -- --torrents 200000 --gate

  reporting-overhead:
    name: reporting overhead (§3)
    # About 17 minutes, so nightly (and on demand) only; a local gate for
    # Insights changes (bench/README.md, docs/decisions/2026-11-01-G-m5a.md).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p lodestar-bench --example reporting-overhead -- --gate

  relevance:
    name: relevance (§8)
    needs: changes
    if: needs.changes.outputs.bench == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # NDCG@10 on the judgment set against bench/relevance/baseline.txt
      # (tolerance 0.001), plus no hidden or negated torrent in any result.
      - run: cargo run --release -p lodestar-bench --bin relevance -- --gate

  filter-budget:
    name: filter budget (§20.8)
    needs: changes
    if: needs.changes.outputs.filter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The owner's budget: under 50 µs per torrent at 10,000 rules, in
      # release, scaled to the reference runner by a calibration workload
      # (§20.8). The test is ignored in debug runs.
      - run: cargo test --release -p lodestar-filter --test props -- --ignored --nocapture budget

  log-bench:
    name: logging hot path (B-log1b)
    needs: changes
    if: needs.changes.outputs.log_bench == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # An event that's off costs at most 5 ns, and 8 threads on adjacent
      # events at most twice that; prints (c), (d) and the default_on
      # verdicts (crates/lodestar/src/logging/bench.rs).
      - env:
          LODESTAR_LOG_BENCH_GATE: "1"
        run: cargo test --release -p lodestar --bin lodestar logging::bench -- --ignored --nocapture --test-threads=1

  mmap-retention:
    name: mmap cache retention (X-mmap-cache-prune)
    needs: changes
    if: needs.changes.outputs.mmap_retention == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # One-document commits must not grow the live heap: tantivy's mmap
      # caches are pruned after each commit. dhat's testing mode, alone in
      # its binary, about 3 min in release; `dhat-heap` keeps it out of the
      # workspace run, which would build it in debug.
      # The workspace lint never builds it (it needs the feature).
      - run: cargo clippy --release -p lodestar-bench --features dhat-heap --test mmap_retention -- -D warnings
      - run: cargo test --release -p lodestar-bench --features dhat-heap --test mmap_retention -- --test-threads=1

  # PK-win-soak-ci: merges and segment GC while readers hold mmaps, on a
  # real Windows filesystem. windows-latest (NTFS) deletes a mapped file, so
  # the failed-delete retry is forced by retry_dir's fault-injection test;
  # this job holds the GC to its contract there (no errors, no leaks, exact
  # mmap gauge). It reuses mmap_retention's applicability (the search crate
  # or anything it builds), docs/decisions/2026-11-11-PK-win-soak-ci.md.
  windows-gc-stress:
    name: windows GC stress (PK-win-soak-ci)
    needs: changes
    if: needs.changes.outputs.mmap_retention == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # As the workspace test job: line tables keep file:line backtraces.
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The test profile (opt-level 1): one cold build, no release build.
      - run: cargo test -p lodestar-search --test windows_gc_stress -- --test-threads=1 --nocapture

  importer:
    name: bitmagnet importer (PostgreSQL)
    needs: changes
    if: needs.changes.outputs.importer == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      LODESTAR_TEST_POSTGRES: host=localhost port=5432 user=postgres dbname=postgres
      # The PostgreSQL tests fail, not skip, when the server is missing.
      LODESTAR_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p lodestar-sources-importers

  fuzz:
    name: fuzz (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.fuzz != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.changes.outputs.fuzz) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      # The prebuilt cargo-fuzz is a musl binary and would default to its
      # own target triple; build for the runner's glibc target instead.
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} $(test -d fuzz/seeds/${{ matrix.target }} && mkdir -p fuzz/corpus/${{ matrix.target }} && echo fuzz/corpus/${{ matrix.target }} fuzz/seeds/${{ matrix.target }}) -- -max_total_time=60
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}

  # The one check branch protection requires. It covers the correctness jobs;
  # a skipped job counts as passing. The timing budgets (search latency,
  # filter) stay out of it: they can be red on main for hardware reasons, and
  # the runner judges those under owner-decisions §2.18. The size budget is
  # in (GS-gate, plan Q10): bytes on seeded synthetic data don't depend on
  # the runner's hardware.
  # log-bench is the exception the runner approved (B-log1b): its gates take
  # the best of several runs and compare like with like (the same threads on
  # isolated events), so a shared runner's noise doesn't fail it.
  # The soak analyzer and collectors decide soak acceptance (build-plan §0.4),
  # so their tests gate like any other code. Standard library only, on the
  # oldest Python the tools document (3.12: hashlib.file_digest, is_junction).
  soak-tools:
    name: soak tools
    needs: changes
    if: needs.changes.outputs.soak_tools == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s docs/soak/tools -p 'test_*.py' -v
      # The Linux/Docker collector (CR-COL) lands under linux/ later.
      - name: Linux collector
        run: |
          if [ -d docs/soak/tools/linux ]; then
            python -m unittest discover -s docs/soak/tools/linux -p 'test_*.py' -v
          fi

  # The Unraid templates are what users install; a broken one ships unseen
  # unless the validator and its tests run. Standard library only.
  unraid-templates:
    name: unraid templates
    needs: changes
    if: needs.changes.outputs.unraid == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python packaging/unraid/validate.py
      - run: python -m unittest discover -s packaging/unraid -p 'test_*.py' -v

  # CMP-13's pin tool decides what a companion pin trusts, so its offline
  # tests (fixture keys made with the runner's gpg, an in-memory network)
  # gate like any other code. Standard library only.
  companion-pins:
    name: companion pin tool
    needs: changes
    if: needs.changes.outputs.companion_pins == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -c 'import sys; assert sys.version_info >= (3, 12), sys.version' && gpg --version | head -1
      - run: python3 -m unittest discover -s tools/companion-pins -p 'test_*.py' -v

  # Every crate in Cargo.lock against the RustSec advisory database
  # (X-ci-advisories, INFRA-09): a vulnerability, an unsound or unmaintained
  # crate or a yanked version fails it, unless deny.toml ignores that advisory
  # with a reason and a review date. Main and the nightly always run it, so a
  # new advisory against a locked crate shows the next night. cargo-deny is
  # pinned by version and built with its own lockfile (--locked).
  advisories:
    name: RustSec advisories
    needs: changes
    if: needs.changes.outputs.advisories == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny --locked check advisories

  # The Windows collector's own fault-injection test: PID reuse, bounded
  # retries, safe binds. The rehearsal script needs a real crawler and stays
  # on the owner's PC.
  soak-collector-windows:
    name: soak collector (Windows)
    needs: changes
    if: needs.changes.outputs.soak_tools == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./docs/soak/tools/test_cr0_collector.ps1

  # Cloud infrastructure (X-cloud-infra, docs/decisions/2026-11-08-X-cloud-infra.md).
  # No credentials, no terraform plan or apply, and nothing runs against AWS
  # or Akamai. No script that can reach a cloud runs here; pure test files may
  # (the runner, OP-2a). The one exception is Deploy-AwsWindows.ps1, which runs
  # only against a stub AWS CLI, with every AWS_* variable removed
  # (X-ci-deploy-aws-test).
  infra:
    name: infra
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13" # the Lambdas' runtime (python3.13)
      - name: Lambda tests
        run: |
          (cd infra/akamai/watchdog/deployed && python -m unittest test_watchdog -v)
          (cd infra/aws/expiration-guard/deployed && python -m unittest test_guard -v)
      # The fleet control plane (OP-1): dry-run only, no cloud call; the
      # parser's property tests, the workflow checks and the public-log leak test.
      - name: Fleet control plane tests
        run: |
          python -m pip install --no-deps --require-hashes -r infra/fleet/requirements-test.txt
          ./infra/fleet/run_tests.sh -v
      # The fleet's CloudFormation templates (OP-2a): built from build_templates.py,
      # then policy tests over the parsed JSON. Standard library only; no cloud call.
      - name: Fleet AWS templates
        run: |
          python infra/aws/fleet-control/build_templates.py --check
          python -m unittest discover -s infra/aws/fleet-control -p 'test_*.py' -v
      # Each template inlines its index.py; the committed JSON must be exactly
      # what build_template.py produces from the committed source.
      - name: Templates match their Lambda source
        run: |
          python infra/akamai/watchdog/deployed/build_template.py
          python infra/aws/expiration-guard/deployed/build_template.py
          git diff --exit-code -- infra/
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.10.5" # >= 1.10 for the S3 backend's native locking (OP-2a)
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra/
      # Every root module: a folder holding .tf files. init downloads the
      # provider pinned in .terraform.lock.hcl and checks it against the lock's
      # zh: (zip) and h1: (unpacked, linux_amd64 and windows_amd64) hashes; a
      # lock that would need changing fails the job. No backend, no credentials.
      - name: terraform validate
        run: |
          set -euo pipefail
          for dir in $(find infra -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u); do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
      # Parse only: a syntax error fails the job, nothing is executed.
      - name: PowerShell parse check
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem -Path infra -Recurse -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) {
              $failed = $true
              foreach ($e in $errors) { Write-Host "::error file=$($f.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)" }
            } else { Write-Host "ok $($f.FullName)" }
          }
          if ($failed) { exit 1 }
      # A pure unit test (no network, terraform or AWS CLI): the manual scripts
      # refuse without the shared state's bucket and region (OP-2a).
      - name: StateBackend.ps1 test
        shell: pwsh
        run: ./infra/akamai/terraform/tests/Test-StateBackend.ps1
      # The deploy script against a stub AWS CLI (X-ci-deploy-aws-test): no
      # network, no credentials. Every AWS_* variable is removed first, and the
      # test itself checks that `aws` resolves to its stub before the deploy
      # script is run.
      - name: Deploy-AwsWindows.ps1 offline test
        shell: pwsh
        run: |
          Get-ChildItem Env: | Where-Object { $_.Name -clike 'AWS_*' } | ForEach-Object { Remove-Item -LiteralPath "Env:$($_.Name)" }
          ./infra/akamai/terraform/tests/Test-DeployAwsWindows.ps1
          # GitHub's pwsh wrapper already exits with $LASTEXITCODE; this keeps it
          # visible and independent of the wrapper.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # The update manifest (PK-manifest): the builder's tests, then a round trip
  # through the verifier clients run, signed with the minisign CLI as
  # release.yml signs, by a throwaway key made here (never the real one).
  update-manifest:
    name: update manifest round trip
    needs: changes
    if: needs.changes.outputs.update_manifest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python3 .github/scripts/test_update_manifest.py
      # The pinned upstream minisign release, checked against its sha256: the
      # Ubuntu package lives only in the security pocket, which a DNS outage
      # took down for hours on 2026-11-11 (#694). A mismatch fails the job.
      - name: install minisign 0.12
        env:
          URL: https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          SHA256: 9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/minisign"
          mkdir -p "$dir"
          curl -fsSL --retry 5 -o "$dir/minisign.tar.gz" "$URL"
          echo "$SHA256  $dir/minisign.tar.gz" | sha256sum -c -
          tar -xzf "$dir/minisign.tar.gz" -C "$dir" --warning=no-unknown-keyword minisign-linux/x86_64/minisign
          echo "$dir/minisign-linux/x86_64" >>"$GITHUB_PATH"
      - name: round trip
        run: |
          set -euo pipefail
          minisign -v
          cargo build -q -p lodestar-update --example verify_envelope
          work=$(mktemp -d "$RUNNER_TEMP/roundtrip.XXXXXX")
          umask 077
          trap 'rm -rf "$work"' EXIT
          minisign -G -W -f -p "$work/test.pub" -s "$work/test.key" >/dev/null
          minisign -G -W -f -p "$work/recovery.pub" -s "$work/recovery.key" >/dev/null
          # Its own empty key chain: crates/update/keys/statements.json is
          # signed by the real recovery key, which this throwaway trust root
          # doesn't hold, so once it has statements they couldn't verify here.
          printf '[]' >"$work/statements.json"
          printf '%s' '{"level":"fix","security":false,"manual_steps":false,"min_from":null,"migrates":false,"reindex":false,"reindex_bytes":0}' >"$work/meta.json"
          # A release candidate goes to Beta; the release to Stable and Beta,
          # each carrying what the channel already lists; a re-run exits 3.
          for step in 0.6.0-rc.1:beta 0.6.0:stable 0.6.0:beta 0.6.0:stable:rerun; do
            IFS=: read -r v channel rerun <<<"$step"
            files=()
            for n in "lodestar-$v-x86_64-linux-musl" "lodestar-$v-aarch64-linux-musl" "lodestar-${v%%-*}-x86_64.msi" "lodestar-$v-x86_64-windows-portable.zip"; do
              head -c 4096 /dev/urandom >"$work/$n"
              files+=("$work/$n")
            done
            prev=()
            if [ -f "$work/$channel.json" ]; then
              python3 .github/scripts/update_manifest.py extract "$work/$channel.json" "$work/prev.body" "$work/prev.minisig"
              minisign -V -q -p "$work/test.pub" -m "$work/prev.body" -x "$work/prev.minisig"
              prev=(--previous "$work/prev.body")
            fi
            code=0
            python3 .github/scripts/update_manifest.py build --channel "$channel" --version "$v" \
              --repo dvortsis/lodestar-v2 --tag "v$v" --metadata "$work/meta.json" \
              --x86-64-binary "${files[0]}" --aarch64-binary "${files[1]}" --msi "${files[2]}" --portable "${files[3]}" \
              --statements "$work/statements.json" "${prev[@]}" --out "$work/$channel.body" || code=$?
            if [ -n "$rerun" ]; then
              [ "$code" = 3 ] || { echo "::error::a re-run of $v on $channel exited $code, not 3"; exit 1; }
              continue
            fi
            [ "$code" = 0 ] || exit "$code"
            minisign -S -s "$work/test.key" -t "lodestar $channel manifest" -m "$work/$channel.body" -x "$work/$channel.minisig" </dev/null
            python3 .github/scripts/update_manifest.py envelope "$work/$channel.body" "$work/$channel.minisig" "$work/$channel.json"
            target/debug/examples/verify_envelope "$work/$channel.json" "$channel" "$work/test.pub" "$work/recovery.pub" "$(date -u +%s)"
          done
          # Beta lists the candidate and the release; Stable the release only.
          python3 .github/scripts/update_manifest.py extract "$work/beta.json" "$work/b" "$work/s"
          python3 -c 'import json,sys; v=[r["version"] for r in json.load(open(sys.argv[1]))["releases"]]; assert v == ["0.6.0", "0.6.0-rc.1"], v' "$work/b"
          python3 .github/scripts/update_manifest.py extract "$work/stable.json" "$work/b" "$work/s"
          python3 -c 'import json,sys; v=[r["version"] for r in json.load(open(sys.argv[1]))["releases"]]; assert v == ["0.6.0"], v' "$work/b"

  ci-ok:
    name: ci-ok
    needs: [changes, lint, openapi, test, size-budget, relevance, importer, fuzz, log-bench, mmap-retention, windows-gc-stress, soak-tools, soak-collector-windows, unraid-templates, companion-pins, update-manifest, infra, advisories]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            echo "A required job failed or was cancelled."; exit 1
          fi
