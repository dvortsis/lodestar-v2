name: CI

# A pull request runs only the jobs its files need (.github/scripts/ci_changes.py):
# docs or web-only changes skip the Rust jobs, the benchmark and importer gates
# run when a crate they build changes, and each fuzz target runs when a crate it
# builds changes. macOS tests run on main and nightly, or on a PR labelled
# `full-ci`, which also runs everything else. Main and nightly always run it all.
# Labels are read on the next push; `labeled` isn't a trigger, because a run
# whose jobs all skip would replace the head's failed checks with skipped ones.
# To run everything now, add `full-ci` and start CI (and Release) by hand on
# the branch (workflow_dispatch runs everything). A manual run tests the branch
# head without main merged in, so if the PR run is red, push or merge main
# instead: a passing manual run would replace the failed checks.
# Skipped jobs show as skipped; a skipped matrix job keeps its unexpanded name
# (`test (${{ matrix.os }})`), so branch protection requires the aggregate
# `ci-ok` job (at the end) rather than individual matrix entries.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.c.outputs.rust }}
      test_os: ${{ steps.c.outputs.test_os }}
      bench: ${{ steps.c.outputs.bench }}
      filter: ${{ steps.c.outputs.filter }}
      importer: ${{ steps.c.outputs.importer }}
      fuzz: ${{ steps.c.outputs.fuzz }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The merge-guard hook runs before every Bash call in every session; a
      # syntax error there would exit 2 and block them all.
      - run: bash -n .claude/hooks/merge-guard.sh
      - id: c
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        # bash (not the default `bash -e`) sets pipefail, so a crash in the
        # script fails the job instead of leaving every output empty.
        shell: bash
        run: python3 .github/scripts/ci_changes.py "$EVENT" "$BASE" "$HEAD" "$LABELS" | tee -a "$GITHUB_OUTPUT"

  lint:
    name: fmt + clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  openapi:
    name: openapi.json drift
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The committed document must be what the DTOs generate: run
      # `cargo run -p lodestar --bin openapi` and commit the result.
      - run: cargo run -p lodestar --bin openapi
      - run: git diff --exit-code web/src/lib/api/openapi.json

  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.test_os != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.test_os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # The PUID/PGID drop only happens as root (tests/privdrop.rs skips
      # otherwise). Built as the runner user, so target/ stays theirs.
      - name: privilege drop as root
        if: runner.os == 'Linux'
        run: |
          bin=$(cargo test -p lodestar --test privdrop --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.name == "privdrop") | .executable')
          sudo "$bin" --test-threads=1 --nocapture 2>&1 | tee privdrop.log
          if grep -q skipping privdrop.log; then
            echo "::error::the root-only tests skipped"; exit 1
          fi
          # The maintenance commands drop root too (tests/cli.rs).
          cli=$(cargo test -p lodestar --test cli --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.name == "cli") | .executable')
          sudo "$cli" maintenance_runs_as_puid --exact --nocapture 2>&1 | tee cli-root.log
          if grep -q skipping cli-root.log || ! grep -q "1 passed" cli-root.log; then
            echo "::error::the root-only CLI test skipped"; exit 1
          fi

  size-budget:
    name: size budget (§3)
    needs: changes
    if: needs.changes.outputs.bench == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p lodestar-bench --bin size-report -- --torrents 50000 --gate

  search-latency:
    name: search latency (§3)
    needs: changes
    if: needs.changes.outputs.bench == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A regression gate at 200k; the 10M measurement is in §16.
      - run: cargo run --release -p lodestar-bench --bin search-bench -- --torrents 200000 --gate

  relevance:
    name: relevance (§8)
    needs: changes
    if: needs.changes.outputs.bench == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # NDCG@10 on the judgment set against bench/relevance/baseline.txt
      # (tolerance 0.001), plus no hidden or negated torrent in any result.
      - run: cargo run --release -p lodestar-bench --bin relevance -- --gate

  filter-budget:
    name: filter budget (§20.8)
    needs: changes
    if: needs.changes.outputs.filter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The owner's budget: under 50 µs per torrent at 10,000 rules, in
      # release, scaled to the reference runner by a calibration workload
      # (§20.8). The test is ignored in debug runs.
      - run: cargo test --release -p lodestar-filter --test props -- --ignored --nocapture budget

  importer:
    name: bitmagnet importer (PostgreSQL)
    needs: changes
    if: needs.changes.outputs.importer == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      LODESTAR_TEST_POSTGRES: host=localhost port=5432 user=postgres dbname=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p lodestar-sources-importers

  fuzz:
    name: fuzz (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.fuzz != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.changes.outputs.fuzz) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      # The prebuilt cargo-fuzz is a musl binary and would default to its
      # own target triple; build for the runner's glibc target instead.
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=60
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}

  # The one check branch protection requires. It covers the correctness jobs;
  # a skipped job counts as passing. The performance budgets (size, search
  # latency, filter) stay out of it: they can be red on main for hardware
  # reasons, and the runner judges those under owner-decisions §2.18.
  ci-ok:
    name: ci-ok
    needs: [changes, lint, openapi, test, relevance, importer, fuzz]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            echo "A required job failed or was cancelled."; exit 1
          fi
