name: Web

on:
  # A push to main always runs web (ci_changes.py treats non-PR events as applicable).
  push:
    branches: [main]
  # No path filter: a required check must report on every PR. The `changes` job below
  # decides whether the heavy job runs (applicability: .github/scripts/ci_changes.py WEB).
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    outputs:
      applies: ${{ steps.c.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Which files apply (.github/scripts/ci_changes.py)
        id: c
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # bash, not the default `bash -e`: the pipe needs pipefail, so a crash in the script fails the step.
        shell: bash
        run: python3 .github/scripts/ci_changes.py "$EVENT" "$BASE" "$HEAD" | tee -a "$GITHUB_OUTPUT"
      - run: python3 .github/scripts/test_ci_changes.py

  web:
    name: check + test + build + size
    needs: changes
    if: needs.changes.outputs.applies == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The committed types must be what openapi.json generates: run
      # `npm run api:types` and commit the result.
      - run: npm run api:types
      - run: git diff --exit-code src/lib/api/schema.d.ts
      - run: npm run check
      - run: npx vitest run
      - run: npm run build
      # Size is measured on a rebuild with a fixed version name: the commit SHA otherwise changes
      # the app id and chunk hashes (tens of bytes of noise per route). Only the version string differs
      # from the build above.
      - run: LODESTAR_BUILD_VERSION=0000000 npx vite build
      - run: npx size-limit

  # The one check to require in the ruleset. Always reports; passes when `web` passed or was
  # skipped because no web input changed; fails when it failed, was cancelled, or was skipped
  # on a PR that does touch web inputs.
  web-ok:
    name: web-ok
    needs: [changes, web]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          APPLIES: ${{ needs.changes.outputs.applies }}
          WEB: ${{ needs.web.result }}
        run: |
          echo "changes=$CHANGES applies=$APPLIES web=$WEB"
          case "$APPLIES" in true|false) ;; *) echo "applicability output is '$APPLIES', not true/false"; exit 1 ;; esac
          [ "$CHANGES" = success ] || { echo "change detection did not succeed"; exit 1; }
          if [ "$APPLIES" = true ]; then
            [ "$WEB" = success ] || { echo "web applies but its job result is '$WEB'"; exit 1; }
          else
            [ "$WEB" = skipped ] || { echo "web does not apply but its job result is '$WEB'"; exit 1; }
            echo "No web input changed; nothing to check."
          fi
