name: Web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'brand/source/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'brand/source/**'
      - '.github/workflows/web.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: check + test + build + size
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The committed types must be what openapi.json generates: run
      # `npm run api:types` and commit the result.
      - run: npm run api:types
      - run: git diff --exit-code src/lib/api/schema.d.ts
      - run: npm run check
      - run: npx vitest run
      - run: npm run build
      # Size is measured on a rebuild with a fixed version name: the commit SHA otherwise changes
      # the app id and chunk hashes (tens of bytes of noise per route). Only the version string differs
      # from the build above.
      - run: LODESTAR_BUILD_VERSION=0000000 npx vite build
      - run: npx size-limit
