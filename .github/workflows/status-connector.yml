name: Status connector

# Tests the roadmap dashboard's status connector (tools/status-connector) and checks that
# runner/dashboard.yaml still agrees with runner/slices.yaml. It runs on pull requests that
# touch either plan file, and again on every push to main that does, so two individually green
# PRs that drift together go red on main at once. Deploying is a separate workflow
# (status-connector-deploy.yml) that runs only when the connector itself changes.

on:
  push:
    branches: [main]
    paths: ["tools/status-connector/**", "runner/slices.yaml", "runner/dashboard.yaml", ".github/workflows/status-connector.yml"]
  pull_request:
    paths: ["tools/status-connector/**", "runner/slices.yaml", "runner/dashboard.yaml", "docs/build-plan.md", ".github/workflows/status-connector.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: status-connector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/status-connector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npm test

  # build-plan.md section 0 and runner/dashboard.yaml describe the same plan, but nothing can check prose against
  # YAML. A change to the first without the second is usually a miss, so say so on the PR. It is a warning, not a
  # failure: some edits are wording only.
  plan-docs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Warn when build-plan.md changes without dashboard.yaml
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          if echo "$files" | grep -qx 'docs/build-plan.md' && ! echo "$files" | grep -qx 'runner/dashboard.yaml'; then
            echo "::warning file=docs/build-plan.md::docs/build-plan.md changed but runner/dashboard.yaml did not. If the change moves the plan (a track, gate, owner decision or roadmap step), update runner/dashboard.yaml in this PR (CLAUDE.md, Keeping the dashboard current)."
          fi
