name: Release

# Docker image (architecture §11, §12):
#   tag vX.Y.Z       -> ghcr.io/dvortsis/lodestar-v2:X.Y.Z, :X.Y, :latest
#   daily/manual run -> ghcr.io/dvortsis/lodestar-v2:nightly   (main only)
#   pull request     -> build and smoke test only; nothing is pushed
# Every trigger runs the smoke job before anything can be pushed.
#
# Packages (architecture §11, §12.2; the package-* jobs below):
#   tag vX.Y.Z       -> Linux tarballs (x86_64, aarch64), Windows MSI and portable
#                       zip, and checksums, attached to a DRAFT GitHub release
#   daily/manual run -> the same files as workflow artifacts only
#   pull request     -> only when packaging, this workflow, the Cargo manifests or
#                       lockfile or the toolchain change, or the PR has `full-ci`
# Code signing is skipped until the owner adds the WINDOWS_CERT_* secrets.

on:
  push:
    tags: ["v*.*.*"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "packaging/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - "crates/**"
      - "bench/**"
      - "web/**"
      - "brand/source/**"
      - "Cargo.*"
      - "rust-toolchain.toml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

# One run per ref. A newer pull-request push supersedes the older one; a
# release or nightly run in progress is never cancelled halfway through a push.
# Labels are read on the next push (see ci.yml for why `labeled` isn't a trigger).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/dvortsis/lodestar-v2

jobs:
  smoke:
    name: smoke (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: lodestar:smoke
          build-args: |
            VERSION=smoke
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

      - name: Image size
        run: |
          bytes=$(docker image inspect lodestar:smoke --format '{{.Size}}')
          echo "Image size: $((bytes / 1024 / 1024)) MiB ($bytes bytes)" | tee -a "$GITHUB_STEP_SUMMARY"

      # The image is built without the `fixture` feature (`serve --fixture` test data).
      - name: Image has no fixture backend
        run: |
          out=$(docker run --rm lodestar:smoke serve --fixture /tmp/fixture 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "no fixture backend" || { echo "::error::the image has the fixture feature; release builds must not"; exit 1; }

      - name: Start the containers
        run: |
          # The image starts as root and the binary drops to PUID/PGID
          # (default 65532, distroless "nonroot"); --user skips the drop.
          data=$(mktemp -d)
          sudo chown 65532:65532 "$data"
          echo "SMOKE_DATA=$data" >> "$GITHUB_ENV"
          docker run -d --name lodestar-smoke --user 65532:65532 \
            --health-interval 2s --health-timeout 5s \
            --health-start-period 30s --health-retries 5 \
            -p 8090:8090 -v "$data:/data" \
            lodestar:smoke
          # A named volume starts out owned by the image's /data (65532).
          docker run -d --name lodestar-volume \
            --health-interval 2s --health-timeout 5s \
            --health-start-period 30s --health-retries 5 \
            -v lodestar-smoke-data:/data \
            lodestar:smoke
          # Unraid's ids on a root-owned bind mount: the binary hands it over.
          puid_data=$(mktemp -d)
          sudo chown 0:0 "$puid_data"
          echo "SMOKE_PUID_DATA=$puid_data" >> "$GITHUB_ENV"
          docker run -d --name lodestar-puid -e PUID=99 -e PGID=100 \
            --health-interval 2s --health-timeout 5s \
            --health-start-period 30s --health-retries 5 \
            -v "$puid_data:/data" \
            lodestar:smoke

      - name: Wait for the containers to be healthy
        run: |
          for name in lodestar-smoke lodestar-volume lodestar-puid; do
            ok=false
            for i in $(seq 1 60); do
              state=$(docker inspect --format '{{.State.Status}}' "$name")
              health=$(docker inspect --format '{{.State.Health.Status}}' "$name")
              echo "$name [$i] state=$state health=$health"
              if [ "$health" = healthy ]; then ok=true; break; fi
              if [ "$state" != running ] || [ "$health" = unhealthy ]; then break; fi
              sleep 2
            done
            if [ "$ok" != true ]; then
              echo "::error::$name did not become healthy"
              docker logs "$name" || true
              exit 1
            fi
          done

      - name: Process ids and /data ownership (PUID/PGID)
        run: |
          volume=$(docker volume inspect --format '{{.Mountpoint}}' lodestar-smoke-data)
          rc=0
          packaging/docker/check-ids.sh lodestar-smoke user 65532 65532 "$SMOKE_DATA" || rc=1
          packaging/docker/check-ids.sh lodestar-volume drop 65532 65532 "$volume" || rc=1
          packaging/docker/check-ids.sh lodestar-puid drop 99 100 "$SMOKE_PUID_DATA" || rc=1
          [ "$rc" = 0 ] || exit 1
          # The files the server created there are the new account's too.
          owner=$(sudo stat --format '%u:%g' "$SMOKE_PUID_DATA/lodestar.db")
          [ "$owner" = 99:100 ] || { echo "::error::lodestar.db is owned by $owner"; exit 1; }
          # A root PUID is refused before anything starts (exit 1, not a
          # hang: timeout's 124 fails too).
          code=0
          out=$(timeout 30 docker run --rm -e PUID=0 lodestar:smoke 2>&1) || code=$?
          echo "$out"
          if [ "$code" != 1 ] || ! grep -q LODESTAR_ALLOW_ROOT <<<"$out"; then
            echo "::error::PUID=0 was not refused (exit $code)"; exit 1
          fi

      - name: /healthz and the embedded UI
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8090/healthz
          curl --fail --silent --show-error --max-time 10 \
            --output index.html http://127.0.0.1:8090/
          if grep -q "UI not built" index.html; then
            echo "::error::/ served the stub page: the SPA was not embedded"
            exit 1
          fi
          asset=$(grep -oE '_app/[^"'"'"' )]+\.js' index.html | head -n 1 || true)
          if [ -z "$asset" ]; then
            echo "::error::/ is not the SvelteKit index.html (no _app/ script reference)"
            cat index.html
            exit 1
          fi
          echo "checking /$asset"
          curl --fail --silent --show-error --max-time 10 --output /dev/null "http://127.0.0.1:8090/$asset"

      - name: Compose file is valid
        run: docker compose -f docker-compose.yml config --quiet

      - name: Stop cleanly (SIGTERM, exit code 0)
        run: |
          for name in lodestar-smoke lodestar-volume lodestar-puid; do
            docker stop --time 60 "$name"
            code=$(docker inspect --format '{{.State.ExitCode}}' "$name")
            echo "$name exit code: $code"
            if [ "$code" != 0 ]; then
              echo "::error::$name exited with $code after docker stop"
              docker logs "$name" || true
              exit 1
            fi
          done

      - name: Container logs
        if: always()
        run: |
          docker logs lodestar-smoke || true
          docker logs lodestar-volume || true
          docker logs lodestar-puid || true

  # Whether a pull request touches what the arm64 build depends on beyond the
  # Rust code (the smoke job already builds the same code for amd64).
  arm64-needed:
    name: arm64 needed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.c.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: c
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          if [ "$FULL" = "true" ] || git diff --no-renames --name-only "$BASE...$HEAD" |
            grep -qE '^(packaging/docker/|Cargo\.lock$|Cargo\.toml$|rust-toolchain|\.dockerignore$|\.github/workflows/release\.yml$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  # Cross-compiled (no emulation); checks that the arm64 build works. On a pull
  # request only when the packaging, lockfile or toolchain changed (or the PR
  # has the `full-ci` label); tags, the nightly and manual runs always build it.
  build-arm64:
    name: build (linux/arm64)
    needs: arm64-needed
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.arm64-needed.outputs.build == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/arm64
          push: false
          outputs: type=cacheonly
          build-args: |
            VERSION=smoke
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

  publish:
    name: publish (amd64 + arm64)
    needs: [smoke, build-arm64]
    # Tags, and the nightly from main (schedule, or a manual run on main). The
    # results are checked explicitly: build-arm64 depends on a job that's skipped
    # outside pull requests, and a skip mustn't hide or fake a success here.
    if: >-
      !cancelled() &&
      needs.smoke.result == 'success' && needs.build-arm64.result == 'success' &&
      github.event_name != 'pull_request' &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag is a semantic version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if ! echo "$GITHUB_REF_NAME" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::$GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-prerelease]; nothing to publish"
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=nightly,enable=${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64

  # ===========================================================================
  # Packages: Linux tarballs, Windows MSI and portable zip (architecture §11).
  # ===========================================================================

  # Decides whether the package jobs run. Tags, the nightly and manual runs:
  # always. Pull requests: only for packaging-related changes or `full-ci`.
  package-gate:
    name: packages needed?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.gate.outputs.run }}
      version: ${{ steps.meta.outputs.version }}
      msi_version: ${{ steps.meta.outputs.msi_version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gate
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          run=true
          if [ "$EVENT" = pull_request ]; then
            run=false
            case ",$LABELS," in *,full-ci,*) run=true ;; esac
            if [ "$run" = false ]; then
              changed=$(git diff --no-renames --name-only "$BASE...$HEAD")
              if printf '%s\n' "$changed" | grep -Eq '^(packaging/|\.github/workflows/release\.yml$|Cargo\.toml$|Cargo\.lock$|crates/[^/]+/Cargo\.toml$|rust-toolchain\.toml$)'; then
                run=true
              fi
            fi
          fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

      - name: Version
        id: meta
        run: |
          base=$(awk -F'"' '/^version *=/ { print $2; exit }' Cargo.toml)
          case "$GITHUB_REF" in
            refs/tags/v*)
              version=${GITHUB_REF_NAME#v}
              tag=$GITHUB_REF_NAME
              if ! echo "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
                echo "::error::$tag is not vMAJOR.MINOR.PATCH[-prerelease]"
                exit 1
              fi ;;
            *)
              tag=
              if [ "$GITHUB_EVENT_NAME" = schedule ]; then
                version="$base-nightly.$(date -u +%Y%m%d)"
              else
                version="$base-dev.${GITHUB_SHA::7}"
              fi ;;
          esac
          # The MSI wants plain MAJOR.MINOR.PATCH.
          msi_version=${version%%-*}
          printf 'version=%s\nmsi_version=%s\ntag=%s\n' "$version" "$msi_version" "$tag" | tee -a "$GITHUB_OUTPUT"

  # The UI is embedded in every binary, so it is built once and shared.
  package-web:
    name: packages (web UI)
    needs: package-gate
    if: needs.package-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web UI
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-web-build
          path: web/build
          if-no-files-found: error
          retention-days: 1

  package-linux:
    name: tarball (${{ matrix.arch }})
    needs: [package-gate, package-web]
    if: needs.package-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            smoke: true
          # Cross-compiled, so it can't run on this runner: build-only, like the
          # Docker arm64 job.
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            smoke: false
    env:
      VERSION: ${{ needs.package-gate.outputs.version }}
      # Same build settings as packaging/docker/Dockerfile.
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: "false"
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-web-build
          path: web/build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: package-${{ matrix.target }}

      # zig is the C compiler and linker for the musl targets (ring needs one).
      # Same pinned wheel as the Dockerfile's amd64 build stage.
      - name: Install zig
        env:
          ZIG_WHEEL: https://files.pythonhosted.org/packages/fe/6f/e1c380fe61db36cb464d5d4d18c557338812500986885373e2550d4ebf6b/ziglang-0.17.0-py3-none-manylinux_2_12_x86_64.manylinux2010_x86_64.musllinux_1_1_x86_64.whl
          ZIG_SHA256: 97079827064a7492cce5541ceb438ae8003ce1e54e399676da2d62fb7a5dc08b
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/ziglang.whl" "$ZIG_WHEEL"
          echo "$ZIG_SHA256  $RUNNER_TEMP/ziglang.whl" | sha256sum --check -
          sudo unzip -q "$RUNNER_TEMP/ziglang.whl" 'ziglang/*' -d /opt
          sudo chmod +x /opt/ziglang/zig
          sudo ln -s /opt/ziglang/zig /usr/local/bin/zig
          zig version

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.24.0

      - name: Build
        # Without the `fixture` feature (`serve --fixture` test data): not for releases.
        run: cargo zigbuild --locked --release -p lodestar --bin lodestar --no-default-features --features web --target ${{ matrix.target }}

      - name: Tarball
        run: |
          packaging/linux/build-tarball.sh ${{ matrix.target }} "$VERSION" \
            target/${{ matrix.target }}/release/lodestar dist

      - name: Smoke (unpack, serve, /healthz, stop)
        if: matrix.smoke
        run: packaging/linux/smoke.sh dist/lodestar-$VERSION-${{ matrix.arch }}-linux-musl.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  package-windows:
    name: MSI and portable zip (windows x86_64)
    needs: [package-gate, package-web]
    if: needs.package-gate.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 75
    # Signing secrets live in these environments only (owner setup:
    # docs/decisions/2026-10-22-P-release.md). Tags use `release` (tag rule and
    # owner approval), the nightly and manual runs use `nightly`, pull requests none.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || (github.event_name != 'pull_request' && 'nightly' || '') }}
    env:
      VERSION: ${{ needs.package-gate.outputs.version }}
      MSI_VERSION: ${{ needs.package-gate.outputs.msi_version }}
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: "false"
      # CODE SIGNING: skipped while these are unset (owner action; see
      # packaging/windows/README.md). packaging/windows/sign.ps1 does the work.
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-web-build
          path: web/build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: package-windows

      - name: Unit test (service SID derivation)
        shell: pwsh
        run: packaging/windows/test-service-sid.ps1

      - name: Build
        # Without the `fixture` feature (`serve --fixture` test data): not for releases.
        run: cargo build --locked --release -p lodestar --bin lodestar --no-default-features --features web --target x86_64-pc-windows-msvc

      - name: Sign lodestar.exe (skipped without a certificate)
        shell: pwsh
        run: packaging/windows/sign.ps1 target/x86_64-pc-windows-msvc/release/lodestar.exe

      - name: Portable zip
        shell: pwsh
        run: packaging/windows/build-portable.ps1 -Version $env:VERSION -OutDir dist

      # WiX Toolset 3 comes with the runner image; install it if a newer image drops it.
      - name: WiX Toolset 3
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $wix = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset v3*\bin' -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $wix) {
              choco install wixtoolset --version 3.14.1 -y --no-progress
              $wix = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset v3*\bin' | Select-Object -First 1
            }
            $wix.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-wix@0.3.9

      - name: MSI
        shell: pwsh
        run: packaging/windows/build-msi.ps1 -Version $env:MSI_VERSION -OutDir dist

      - name: Sign the MSI (skipped without a certificate)
        shell: pwsh
        run: packaging/windows/sign.ps1 "dist/lodestar-$($env:MSI_VERSION)-x86_64.msi"

      - name: Checksums
        shell: pwsh
        run: |
          $msi = Get-Item "dist/lodestar-$($env:MSI_VERSION)-x86_64.msi"
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower()
          "$hash  $($msi.Name)" | Set-Content -Path "$($msi.FullName).sha256" -Encoding ascii

      # Install the MSI silently, check files, service, firewall and shortcut, run the
      # installed binary and check /healthz, uninstall. The service is installed but not
      # started: its entrypoint is slice M6-win's, so the binary is run directly until then.
      - name: Smoke (MSI install, run, uninstall; portable zip)
        shell: pwsh
        run: |
          packaging/windows/smoke.ps1 `
            -Msi "$PWD/dist/lodestar-$($env:MSI_VERSION)-x86_64.msi" `
            -Zip "$PWD/dist/lodestar-$($env:VERSION)-x86_64-windows-portable.zip"

      - name: MSI logs
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem $env:RUNNER_TEMP -Filter 'msi-*.log' | ForEach-Object {
            "::group::$($_.Name) (tail)"; Get-Content $_.FullName -Tail 120; "::endgroup::"
            "::group::$($_.Name) (service lines)"; Select-String -Path $_.FullName -Pattern 'ervice' | Select-Object -First 60 | ForEach-Object { $_.Line }; "::endgroup::"
          }
          # The data-folder script keeps its log in a random SYSTEM/Administrators-only folder.
          Get-ChildItem (Join-Path $env:SystemRoot 'Temp\lodestar-secure-*') -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            "::group::secure-datadir.log ($($_.Name))"; Get-Content (Join-Path $_.FullName 'secure-datadir.log') -ErrorAction SilentlyContinue; "::endgroup::"
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # Tags only: attach everything to a DRAFT release. The owner publishes it.
  package-release:
    name: draft GitHub release
    needs: [package-gate, package-linux, package-windows]
    if: >-
      github.event_name != 'pull_request' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.package-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Tags only: waits for the owner's approval, then creates the draft release.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: packaging/keys

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-{linux-*,windows}
          merge-multiple: true
          path: dist

      - name: One checksum file for the release
        working-directory: dist
        run: |
          sha256sum --check --quiet -- *.sha256
          cat -- *.sha256 | sort -k2 >SHA256SUMS
          ls -l
          cat SHA256SUMS

      # Signs SHA256SUMS with the release key (minisign), the same key as the update
      # manifests (packaging/keys/README.md). Skipped, with a notice, while the
      # RELEASE_SIGNING_KEY secret is not set in the `release` environment.
      - name: Sign SHA256SUMS (skipped without the release key)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_SIGNING_KEY_PASSWORD }}
          TAG: ${{ needs.package-gate.outputs.tag }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::notice::SHA256SUMS is NOT signed: RELEASE_SIGNING_KEY is not set (owner action)."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" >"$RUNNER_TEMP/release.key"
          printf '%s\n' "$RELEASE_SIGNING_KEY_PASSWORD" |
            minisign -S -s "$RUNNER_TEMP/release.key" -t "Lodestar $TAG SHA256SUMS" \
              -m dist/SHA256SUMS -x dist/SHA256SUMS.minisig
          rm -f "$RUNNER_TEMP/release.key"
          # Check it against the public key in the repository, as a user would.
          minisign -V -p packaging/keys/lodestar-release.pub -m dist/SHA256SUMS -x dist/SHA256SUMS.minisig

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.package-gate.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          prerelease=
          case "$TAG" in *-*) prerelease=--prerelease ;; esac
          files=$(ls dist/*.tar.gz dist/*.msi dist/*.zip dist/SHA256SUMS dist/SHA256SUMS.minisig 2>/dev/null)
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            # shellcheck disable=SC2086
            gh release upload "$TAG" --repo "$REPO" --clobber $files
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" --repo "$REPO" --draft $prerelease \
              --title "Lodestar ${TAG#v}" \
              --notes "Draft. Windows files are not code-signed (SmartScreen will warn): check each download against SHA256SUMS, and SHA256SUMS against SHA256SUMS.minisig when that file is attached." \
              $files
          fi
