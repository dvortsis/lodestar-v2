name: Release

# Docker image (architecture §11, §12):
#   tag vX.Y.Z       -> ghcr.io/dvortsis/lodestar-v2:X.Y.Z, :X.Y, :latest
#   daily/manual run -> ghcr.io/dvortsis/lodestar-v2:nightly   (main only)
#   pull request     -> build and smoke test only; nothing is pushed
# Every trigger runs the smoke job before anything can be pushed.
#
# Packages (architecture §11, §12.2; the package-* jobs below):
#   tag vX.Y.Z       -> Linux tarballs (x86_64, aarch64), Windows MSI and portable
#                       zip, and checksums, attached to a DRAFT GitHub release
#   daily/manual run -> the same files as workflow artifacts only
#   pull request     -> only when packaging, this workflow, the Cargo manifests or
#                       lockfile or the toolchain change, or the PR has `full-ci`
# Code signing is skipped until the owner adds the WINDOWS_CERT_* secrets.

on:
  push:
    tags: ["v*.*.*"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "packaging/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - "crates/**"
      - "bench/**"
      - "web/**"
      - "brand/source/**"
      - "Cargo.*"
      - "rust-toolchain.toml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

# One run per ref. A newer pull-request push supersedes the older one; a
# release or nightly run in progress is never cancelled halfway through a push.
# Labels are read on the next push (see ci.yml for why `labeled` isn't a trigger).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/dvortsis/lodestar-v2

jobs:
  smoke:
    name: smoke (linux/amd64)
    needs: package-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: lodestar:smoke
          # The same LODESTAR_* as `publish`, so it reuses these layers and
          # pushes the build that was smoked.
          build-args: |
            VERSION=smoke
            REVISION=${{ github.sha }}
            LODESTAR_VERSION=${{ needs.package-gate.outputs.version }}
            LODESTAR_CHANNEL=${{ needs.package-gate.outputs.channel }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

      - name: Image size
        run: |
          bytes=$(docker image inspect lodestar:smoke --format '{{.Size}}')
          echo "Image size: $((bytes / 1024 / 1024)) MiB ($bytes bytes)" | tee -a "$GITHUB_STEP_SUMMARY"

      # The image is built without the `fixture` feature (`serve --fixture` test data).
      - name: Image has no fixture backend
        run: |
          out=$(docker run --rm lodestar:smoke serve --fixture /tmp/fixture 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "no fixture backend" || { echo "::error::the image has the fixture feature; release builds must not"; exit 1; }

      - name: Start the containers
        run: |
          # The image starts as root and the binary drops to PUID/PGID
          # (default 65532, distroless "nonroot"); --user skips the drop.
          data=$(mktemp -d)
          sudo chown 65532:65532 "$data"
          echo "SMOKE_DATA=$data" >> "$GITHUB_ENV"
          docker run -d --name lodestar-smoke --user 65532:65532 \
            --health-interval 2s --health-timeout 5s \
            --health-start-period 30s --health-retries 5 \
            -p 8090:8090 -v "$data:/data" \
            lodestar:smoke
          # A named volume starts out owned by the image's /data (65532).
          docker run -d --name lodestar-volume \
            --health-interval 2s --health-timeout 5s \
            --health-start-period 30s --health-retries 5 \
            -v lodestar-smoke-data:/data \
            lodestar:smoke
          # Unraid's ids on a root-owned bind mount: the binary hands it over.
          puid_data=$(mktemp -d)
          sudo chown 0:0 "$puid_data"
          echo "SMOKE_PUID_DATA=$puid_data" >> "$GITHUB_ENV"
          docker run -d --name lodestar-puid -e PUID=99 -e PGID=100 \
            --health-interval 2s --health-timeout 5s \
            --health-start-period 30s --health-retries 5 \
            -v "$puid_data:/data" \
            lodestar:smoke

      - name: Wait for the containers to be healthy
        run: |
          for name in lodestar-smoke lodestar-volume lodestar-puid; do
            ok=false
            for i in $(seq 1 60); do
              state=$(docker inspect --format '{{.State.Status}}' "$name")
              health=$(docker inspect --format '{{.State.Health.Status}}' "$name")
              echo "$name [$i] state=$state health=$health"
              if [ "$health" = healthy ]; then ok=true; break; fi
              if [ "$state" != running ] || [ "$health" = unhealthy ]; then break; fi
              sleep 2
            done
            if [ "$ok" != true ]; then
              echo "::error::$name did not become healthy"
              docker logs "$name" || true
              exit 1
            fi
          done

      - name: Process ids and /data ownership (PUID/PGID)
        run: |
          volume=$(docker volume inspect --format '{{.Mountpoint}}' lodestar-smoke-data)
          rc=0
          packaging/docker/check-ids.sh lodestar-smoke user 65532 65532 "$SMOKE_DATA" || rc=1
          packaging/docker/check-ids.sh lodestar-volume drop 65532 65532 "$volume" || rc=1
          packaging/docker/check-ids.sh lodestar-puid drop 99 100 "$SMOKE_PUID_DATA" || rc=1
          [ "$rc" = 0 ] || exit 1
          # The files the server created there are the new account's too.
          owner=$(sudo stat --format '%u:%g' "$SMOKE_PUID_DATA/lodestar.db")
          [ "$owner" = 99:100 ] || { echo "::error::lodestar.db is owned by $owner"; exit 1; }
          # A root PUID is refused before anything starts (exit 1, not a
          # hang: timeout's 124 fails too).
          code=0
          out=$(timeout 30 docker run --rm -e PUID=0 lodestar:smoke 2>&1) || code=$?
          echo "$out"
          if [ "$code" != 1 ] || ! grep -q LODESTAR_ALLOW_ROOT <<<"$out"; then
            echo "::error::PUID=0 was not refused (exit $code)"; exit 1
          fi

      - name: /healthz and the embedded UI
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8090/healthz
          curl --fail --silent --show-error --max-time 10 \
            --output index.html http://127.0.0.1:8090/
          if grep -q "UI not built" index.html; then
            echo "::error::/ served the stub page: the SPA was not embedded"
            exit 1
          fi
          asset=$(grep -oE '_app/[^"'"'"' )]+\.js' index.html | head -n 1 || true)
          if [ -z "$asset" ]; then
            echo "::error::/ is not the SvelteKit index.html (no _app/ script reference)"
            cat index.html
            exit 1
          fi
          echo "checking /$asset"
          curl --fail --silent --show-error --max-time 10 --output /dev/null "http://127.0.0.1:8090/$asset"

      # Setup by token through the wizard's own API, then the crawler must leave the setup
      # hold with its DHT socket bound. The smoke asks the container only about itself; the
      # token is printed redacted and the password stays in a temp folder.
      - name: Setup by token, then the crawler is running
        run: |
          set -euo pipefail
          state=$(mktemp -d)
          echo "SMOKE_STATE=$state" >> "$GITHUB_ENV"
          docker logs lodestar-smoke > "$state/log.txt" 2>&1
          python3 -I packaging/smoke/flow.py setup --url http://127.0.0.1:8090 \
            --log "$state/log.txt" --state "$state"
          python3 -I packaging/smoke/flow.py crawler --url http://127.0.0.1:8090 \
            --state "$state" --dht

      - name: Compose file is valid
        run: docker compose -f docker-compose.yml config --quiet

      - name: Stop cleanly (SIGTERM, exit code 0)
        run: |
          for name in lodestar-smoke lodestar-volume lodestar-puid; do
            docker stop --time 60 "$name"
            code=$(docker inspect --format '{{.State.ExitCode}}' "$name")
            echo "$name exit code: $code"
            if [ "$code" != 0 ]; then
              echo "::error::$name exited with $code after docker stop"
              docker logs "$name" || true
              exit 1
            fi
          done

      # `lodestar import` needs the server stopped, so it runs after the clean stop above, as
      # the same account, on the same data folder. Then the same container starts again and
      # the imported fixture must be searchable.
      - name: Import a fixture, start again and search
        run: |
          set -euo pipefail
          fixture=$(mktemp -d)
          python3 -I packaging/smoke/flow.py fixture "$fixture/database.sqlite3"
          chmod 755 "$fixture"
          chmod 644 "$fixture/database.sqlite3"
          docker run --rm --user 65532:65532 -v "$SMOKE_DATA:/data" -v "$fixture:/fixture:ro" \
            lodestar:smoke import start --source magnetico --path /fixture/database.sqlite3
          docker start lodestar-smoke
          for i in $(seq 1 60); do
            health=$(docker inspect --format '{{.State.Health.Status}}' lodestar-smoke)
            echo "lodestar-smoke [$i] health=$health"
            if [ "$health" = healthy ]; then break; fi
            sleep 2
          done
          [ "$health" = healthy ] || { docker logs lodestar-smoke 2>&1 | tail -n 40 | grep -v 'setup token' || true; exit 1; }
          python3 -I packaging/smoke/flow.py search --url http://127.0.0.1:8090 --state "$SMOKE_STATE"
          docker stop --time 60 lodestar-smoke
          code=$(docker inspect --format '{{.State.ExitCode}}' lodestar-smoke)
          [ "$code" = 0 ] || { echo "::error::lodestar-smoke exited with $code after the second stop"; exit 1; }

      - name: Container logs
        if: always()
        run: |
          # The first-run setup token is printed redacted, even though it stops working at setup.
          redact() { sed -E 's/(setup token )[0-9A-Fa-f]{4}(-[0-9A-Fa-f]{4}){3}/\1XXXX-XXXX-XXXX-XXXX/'; }
          for name in lodestar-smoke lodestar-volume lodestar-puid; do
            docker logs "$name" 2>&1 | redact || true
          done

  # Whether a pull request touches what the arm64 build depends on beyond the
  # Rust code (the smoke job already builds the same code for amd64).
  arm64-needed:
    name: arm64 needed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.c.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: c
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          if [ "$FULL" = "true" ] || git diff --no-renames --name-only "$BASE...$HEAD" |
            grep -qE '^(packaging/docker/|Cargo\.lock$|Cargo\.toml$|rust-toolchain|\.dockerignore$|\.github/workflows/release\.yml$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  # Cross-compiled (no emulation); checks that the arm64 build works. On a pull
  # request only when the packaging, lockfile or toolchain changed (or the PR
  # has the `full-ci` label); tags, the nightly and manual runs always build it.
  build-arm64:
    name: build (linux/arm64)
    needs: [arm64-needed, package-gate]
    if: ${{ !cancelled() && needs.package-gate.result == 'success' && (github.event_name != 'pull_request' || needs.arm64-needed.outputs.build == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/arm64
          push: false
          outputs: type=cacheonly
          build-args: |
            VERSION=smoke
            REVISION=${{ github.sha }}
            LODESTAR_VERSION=${{ needs.package-gate.outputs.version }}
            LODESTAR_CHANNEL=${{ needs.package-gate.outputs.channel }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

  publish:
    name: publish (amd64 + arm64)
    needs: [smoke, build-arm64, package-gate]
    # Tags, and the nightly from main (schedule, or a manual run on main). The
    # results are checked explicitly: build-arm64 depends on a job that's skipped
    # outside pull requests, and a skip mustn't hide or fake a success here.
    # package-gate gives LODESTAR_VERSION, the same as the packages'.
    if: >-
      !cancelled() &&
      needs.smoke.result == 'success' && needs.build-arm64.result == 'success' &&
      needs.package-gate.result == 'success' &&
      github.event_name != 'pull_request' &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag is a semantic version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Strict semver (no leading zeros in numeric pre-release parts), the
          # same check as the update manifest's (update_manifest.py).
          if [ "${GITHUB_REF_NAME#v}" = "$GITHUB_REF_NAME" ] ||
            ! python3 .github/scripts/update_manifest.py check-version -- "${GITHUB_REF_NAME#v}"; then
            echo "::error::$GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-prerelease]; nothing to publish"
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=nightly,enable=${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            LODESTAR_VERSION=${{ needs.package-gate.outputs.version }}
            LODESTAR_CHANNEL=${{ needs.package-gate.outputs.channel }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64

  # ===========================================================================
  # Packages: Linux tarballs, Windows MSI and portable zip (architecture §11).
  # ===========================================================================

  # Decides whether the package jobs run. Tags, the nightly and manual runs:
  # always. Pull requests: only for packaging-related changes or `full-ci`.
  package-gate:
    name: packages needed?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.gate.outputs.run }}
      version: ${{ steps.meta.outputs.version }}
      msi_version: ${{ steps.meta.outputs.msi_version }}
      tag: ${{ steps.meta.outputs.tag }}
      channel: ${{ steps.meta.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gate
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          run=true
          if [ "$EVENT" = pull_request ]; then
            run=false
            case ",$LABELS," in *,full-ci,*) run=true ;; esac
            if [ "$run" = false ]; then
              changed=$(git diff --no-renames --name-only "$BASE...$HEAD")
              if printf '%s\n' "$changed" | grep -Eq '^(packaging/|\.github/workflows/release\.yml$|Cargo\.toml$|Cargo\.lock$|crates/[^/]+/Cargo\.toml$|rust-toolchain\.toml$)'; then
                run=true
              fi
            fi
          fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

      - name: Version
        id: meta
        run: |
          base=$(awk -F'"' '/^version *=/ { print $2; exit }' Cargo.toml)
          case "$GITHUB_REF" in
            refs/tags/v*)
              version=${GITHUB_REF_NAME#v}
              tag=$GITHUB_REF_NAME
              if [ "${version%%-*}" != "$base" ]; then
                echo "::error::$tag does not match the version in Cargo.toml ($base): bump it before tagging"
                exit 1
              fi
              # Strict semver, as the update manifest and build.rs need it
              # (`-rc.01` is refused: a numeric part has no leading zero).
              if ! python3 .github/scripts/update_manifest.py check-version -- "$version"; then
                echo "::error::$tag is not vMAJOR.MINOR.PATCH[-prerelease]"
                exit 1
              fi
              # The channel a build is on (LODESTAR_CHANNEL, build.rs): unset
              # it's `dev`, and a dev build never updates itself.
              case "$version" in *-*) channel=beta ;; *) channel=stable ;; esac ;;
            *)
              tag=
              # LODESTAR_VERSION (crates/lodestar/build.rs) must rise from one
              # nightly to the next, by semver precedence: the date, then the
              # run number (two runs on one day; a re-run keeps its number).
              # The schedule and manual runs on main are the nightly (they
              # publish :nightly). Anything else is a dev build; its `g`
              # keeps an all-digit short SHA from being a numeric identifier
              # with a leading zero, which isn't semver.
              if [ "$GITHUB_EVENT_NAME" = schedule ] || { [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" = refs/heads/main ]; }; then
                version="$base-nightly.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER"
                channel=nightly
              else
                version="$base-dev.$GITHUB_RUN_NUMBER.g${GITHUB_SHA::7}"
                channel=dev
              fi ;;
          esac
          # The MSI wants plain MAJOR.MINOR.PATCH.
          msi_version=${version%%-*}
          printf 'version=%s\nmsi_version=%s\ntag=%s\nchannel=%s\n' "$version" "$msi_version" "$tag" "$channel" | tee -a "$GITHUB_OUTPUT"

  # The UI is embedded in every binary, so it is built once and shared.
  package-web:
    name: packages (web UI)
    needs: package-gate
    if: needs.package-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web UI
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-web-build
          path: web/build
          if-no-files-found: error
          retention-days: 1

  package-linux:
    name: tarball (${{ matrix.arch }})
    needs: [package-gate, package-web]
    if: needs.package-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            smoke: true
          # Cross-compiled, so it can't run on this runner: build-only, like the
          # Docker arm64 job.
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            smoke: false
    env:
      VERSION: ${{ needs.package-gate.outputs.version }}
      # The version the binary reports and the updater compares, and its
      # channel (build.rs; a `dev` build never updates itself).
      LODESTAR_VERSION: ${{ needs.package-gate.outputs.version }}
      LODESTAR_CHANNEL: ${{ needs.package-gate.outputs.channel }}
      # Same build settings as packaging/docker/Dockerfile.
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: "false"
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-web-build
          path: web/build

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      # No shared build cache on tag builds: a release is built from scratch.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          key: package-${{ matrix.target }}

      # zig is the C compiler and linker for the musl targets (ring needs one).
      # Same pinned wheel as the Dockerfile's amd64 build stage.
      - name: Install zig
        env:
          ZIG_WHEEL: https://files.pythonhosted.org/packages/fe/6f/e1c380fe61db36cb464d5d4d18c557338812500986885373e2550d4ebf6b/ziglang-0.17.0-py3-none-manylinux_2_12_x86_64.manylinux2010_x86_64.musllinux_1_1_x86_64.whl
          ZIG_SHA256: 97079827064a7492cce5541ceb438ae8003ce1e54e399676da2d62fb7a5dc08b
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/ziglang.whl" "$ZIG_WHEEL"
          echo "$ZIG_SHA256  $RUNNER_TEMP/ziglang.whl" | sha256sum --check -
          sudo unzip -q "$RUNNER_TEMP/ziglang.whl" 'ziglang/*' -d /opt
          sudo chmod +x /opt/ziglang/zig
          sudo ln -s /opt/ziglang/zig /usr/local/bin/zig
          zig version

      # Built from source, like the Dockerfile does: no third-party binary goes into a release build.
      - name: Install cargo-zigbuild
        # The build cache can bring back an earlier copy, so only install when the pinned version is not there.
        run: cargo zigbuild --version 2>/dev/null | grep -q '0\.24\.0' || cargo install --locked --force cargo-zigbuild@0.24.0


      - name: Build
        # Without the `fixture` feature (`serve --fixture` test data): not for releases.
        run: cargo zigbuild --locked --release -p lodestar --bin lodestar --no-default-features --features web --target ${{ matrix.target }}

      - name: Tarball
        run: |
          packaging/linux/build-tarball.sh ${{ matrix.target }} "$VERSION" \
            target/${{ matrix.target }}/release/lodestar dist

      # The update manifest's `binary` artifact is the bare executable: the
      # updater stages the downloaded file itself as the new binary.
      - name: Bare binary for the updater
        run: |
          name=lodestar-$VERSION-${{ matrix.arch }}-linux-musl
          install -m 0755 target/${{ matrix.target }}/release/lodestar "dist/$name"
          # build.rs falls back to Cargo.toml's version, with only a build
          # warning, when LODESTAR_VERSION isn't strict semver on it.
          grep -qaF -- "$VERSION" "dist/$name" ||
            { echo "::error::the binary doesn't carry LODESTAR_VERSION=$VERSION"; exit 1; }
          (cd dist && sha256sum "$name" >"$name.sha256" && cat "$name.sha256")

      - name: Smoke (unpack, serve, /healthz, stop)
        if: matrix.smoke
        run: packaging/linux/smoke.sh dist/lodestar-$VERSION-${{ matrix.arch }}-linux-musl.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      # X-mimalloc-override: C code (SQLite, zstd) must allocate from
      # mimalloc, not zig's libc malloc. The shipped binary has no symbols, so
      # relink it with them (same dependencies, only the `lodestar` crate is
      # rebuilt) and check that `malloc`, `free`, `calloc` and `realloc` are
      # mimalloc's own entry points. Runs after the upload: the relinked file
      # is never shipped. All four must be linked; SQLite and zstd call each,
      # so a missing one fails loudly rather than passing. Then check that zig's
      # own allocator isn't linked beside it (X-mimalloc-docs): its malloc
      # (`c.malloc.*`) and the `SmpAllocator` under it would be a second heap.
      # Fixed strings with their dots, so no mimalloc or Rust symbol matches.
      - name: Check malloc is mimalloc's
        run: |
          cargo-zigbuild rustc --locked --release -p lodestar --bin lodestar --no-default-features --features web --target ${{ matrix.target }} -- -C strip=none
          bin=target/${{ matrix.target }}/release/lodestar
          syms="$RUNNER_TEMP/lodestar-${{ matrix.arch }}.nm"
          nm "$bin" > "$syms"
          addr() { awk -v s="$1" '$3 == s && $2 ~ /^[TtWw]$/ { print $1; exit }' "$syms"; }
          for pair in malloc:mi_malloc free:mi_free calloc:mi_calloc realloc:mi_realloc; do
            c=${pair%%:*} mi=${pair##*:}
            a=$(addr "$c") b=$(addr "$mi")
            echo "$c=${a:-missing} $mi=${b:-missing}"
            if [ -z "$a" ] || [ "$a" != "$b" ]; then
              echo "::error::$c is not mimalloc's $mi in the musl build (mimalloc's override feature, crates/lodestar/Cargo.toml)"
              exit 1
            fi
          done
          second=$(grep -c -F -e SmpAllocator -e c.malloc. "$syms" || true)
          echo "zig allocator symbols: ${second:-unreadable}"
          if [ -z "$second" ]; then
            echo "::error::couldn't search the symbol list for zig's allocator"
            exit 1
          fi
          if [ "$second" != 0 ]; then
            grep -F -e SmpAllocator -e c.malloc. "$syms" | head -n 20 || true
            echo "::error::zig's own allocator is linked beside mimalloc in the musl build (a second C heap)"
            exit 1
          fi

  package-windows:
    name: MSI and portable zip (windows x86_64)
    needs: [package-gate, package-web]
    if: needs.package-gate.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 75
    # Signing secrets live in these environments only (owner setup:
    # docs/decisions/2026-10-22-P-release.md). Tags use `release` (tag rule and
    # owner approval), the nightly and manual runs use `nightly`, pull requests none.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || (github.event_name != 'pull_request' && 'nightly' || '') }}
    env:
      VERSION: ${{ needs.package-gate.outputs.version }}
      LODESTAR_VERSION: ${{ needs.package-gate.outputs.version }}
      LODESTAR_CHANNEL: ${{ needs.package-gate.outputs.channel }}
      MSI_VERSION: ${{ needs.package-gate.outputs.msi_version }}
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-web-build
          path: web/build

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-msvc

      # No shared build cache on tag builds: a release is built from scratch.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          key: package-windows

      # Built from source, not downloaded: this job builds and signs the Windows files.
      - name: Install cargo-wix
        shell: pwsh
        # The build cache can bring back an earlier copy, so only install when the pinned version is not there.
        run: |
          if (-not ((cargo wix --version 2>$null) -match '0\.3\.9')) { cargo install --locked --force cargo-wix --version 0.3.9 }
          if ($LASTEXITCODE -ne 0) { throw 'installing cargo-wix failed' }


      - name: Unit test (service SID derivation)
        shell: pwsh
        run: packaging/windows/test-service-sid.ps1

      - name: Unit test (data folder Repair rule, owner 2.52)
        shell: powershell
        run: packaging/windows/test-secure-datadir.ps1

      - name: Build
        # Without the `fixture` feature (`serve --fixture` test data): not for releases.
        run: cargo build --locked --release -p lodestar --bin lodestar --no-default-features --features web --target x86_64-pc-windows-msvc

      # build.rs falls back to Cargo.toml's version, with only a build
      # warning, when LODESTAR_VERSION isn't strict semver on it.
      - name: The binary carries LODESTAR_VERSION
        shell: pwsh
        run: |
          $bin = [IO.File]::ReadAllBytes('target/x86_64-pc-windows-msvc/release/lodestar.exe')
          if (-not [Text.Encoding]::ASCII.GetString($bin).Contains($env:VERSION)) {
            throw "lodestar.exe doesn't carry LODESTAR_VERSION=$($env:VERSION)"
          }

      - name: Sign lodestar.exe (skipped without a certificate)
        shell: pwsh
        # CODE SIGNING: the certificate is visible to this step only, and only from the `release` or
        # `nightly` environment (never on pull requests). Skipped while unset (owner action; see
        # packaging/windows/README.md).
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: packaging/windows/sign.ps1 target/x86_64-pc-windows-msvc/release/lodestar.exe

      - name: Portable zip
        shell: pwsh
        run: packaging/windows/build-portable.ps1 -Version $env:VERSION -OutDir dist

      # WiX Toolset 3 comes with the runner image. If a newer image drops it, fail here rather
      # than install it from the network at release time.
      - name: WiX Toolset 3 is installed
        shell: pwsh
        run: |
          $wix = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset v3*\bin' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $wix) { throw 'WiX Toolset 3 is not on this runner image' }
          $wix.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: MSI
        shell: pwsh
        run: packaging/windows/build-msi.ps1 -Version $env:MSI_VERSION -OutDir dist

      - name: Sign the MSI (skipped without a certificate)
        shell: pwsh
        # CODE SIGNING: the certificate is visible to this step only, and only from the `release` or
        # `nightly` environment (never on pull requests). Skipped while unset (owner action; see
        # packaging/windows/README.md).
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: packaging/windows/sign.ps1 "dist/lodestar-$($env:MSI_VERSION)-x86_64.msi"

      - name: Checksums
        shell: pwsh
        run: |
          $msi = Get-Item "dist/lodestar-$($env:MSI_VERSION)-x86_64.msi"
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower()
          "$hash  $($msi.Name)" | Set-Content -Path "$($msi.FullName).sha256" -Encoding ascii

      # A second MSI at a higher version, only to check that an upgrade keeps the service and data.
      - name: MSI for the upgrade check
        shell: pwsh
        run: |
          $next = [version]$env:MSI_VERSION
          packaging/windows/build-msi.ps1 -Version "$($next.Major).$($next.Minor).$($next.Build + 1)" -OutDir "$env:RUNNER_TEMP/upgrade"

      # Install the MSI silently, check files, service, firewall and shortcut, run the
      # installed binary and check /healthz, uninstall. The service is installed but not
      # started: its entrypoint is slice M6-win's, so the binary is run directly until then.
      - name: Smoke (MSI install, run, uninstall; portable zip)
        shell: pwsh
        run: |
          packaging/windows/smoke.ps1 `
            -Msi "$PWD/dist/lodestar-$($env:MSI_VERSION)-x86_64.msi" `
            -UpgradeMsi (Get-ChildItem "$env:RUNNER_TEMP/upgrade" -Filter *.msi | Select-Object -First 1).FullName `
            -Zip "$PWD/dist/lodestar-$($env:VERSION)-x86_64-windows-portable.zip"

      - name: MSI logs
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem $env:RUNNER_TEMP -Filter 'msi-*.log' | ForEach-Object {
            "::group::$($_.Name) (tail)"; Get-Content $_.FullName -Tail 120; "::endgroup::"
            "::group::$($_.Name) (service lines)"; Select-String -Path $_.FullName -Pattern 'ervice|Return value 3|installs to|Error [0-9]{4}|CustomAction' | Select-Object -First 80 | ForEach-Object { $_.Line }; "::endgroup::"
          }
          # The data-folder script keeps its log in a random SYSTEM/Administrators-only folder.
          Get-ChildItem (Join-Path $env:SystemRoot 'Temp\lodestar-secure-*') -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            $dir = $_
            Get-ChildItem $dir.FullName -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object {
              "::group::$($_.Name) ($($dir.Name))"; Get-Content $_.FullName -ErrorAction SilentlyContinue; "::endgroup::"
            }
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # Tags only: attach everything to a DRAFT release. The owner publishes it.
  package-release:
    name: draft GitHub release
    needs: [package-gate, package-linux, package-windows]
    if: >-
      github.event_name != 'pull_request' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.package-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Tags only: waits for the owner's approval, then creates the draft release.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: packaging/keys
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-{linux-*,windows}
          merge-multiple: true
          path: dist

      - name: One checksum file for the release
        working-directory: dist
        run: |
          sha256sum --check --quiet -- *.sha256
          cat -- *.sha256 | tr -d '\r' | sort -k2 >SHA256SUMS
          ls -l
          cat SHA256SUMS

      # Signs SHA256SUMS with the release key (minisign), the same key as the update
      # manifests (packaging/keys/README.md). Skipped, with a notice, while the
      # RELEASE_SIGNING_KEY secret is not set in the `release` environment.
      - name: Sign SHA256SUMS (skipped without the release key)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_SIGNING_KEY_PASSWORD }}
          TAG: ${{ needs.package-gate.outputs.tag }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::notice::SHA256SUMS is NOT signed: RELEASE_SIGNING_KEY is not set (owner action)."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          umask 077
          trap 'rm -f "$RUNNER_TEMP/release.key"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" >"$RUNNER_TEMP/release.key"
          printf '%s\n' "$RELEASE_SIGNING_KEY_PASSWORD" |
            minisign -S -s "$RUNNER_TEMP/release.key" -t "Lodestar $TAG SHA256SUMS" \
              -m dist/SHA256SUMS -x dist/SHA256SUMS.minisig
          # Check it against the public key in the repository, as a user would.
          minisign -V -p packaging/keys/lodestar-release.pub -m dist/SHA256SUMS -x dist/SHA256SUMS.minisig

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.package-gate.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          prerelease=
          case "$TAG" in *-*) prerelease=--prerelease ;; esac
          # An array, not `ls`: the .minisig only exists when the signing key does, and a missing
          # file must not stop the step (bash -e).
          files=(dist/*.tar.gz dist/*-linux-musl dist/*.msi dist/*.zip dist/*.sha256 dist/SHA256SUMS)
          [ -f dist/SHA256SUMS.minisig ] && files+=(dist/SHA256SUMS.minisig)
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            # A re-run must never overwrite files on a release the owner has published.
            if [ "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)" != true ]; then
              echo "::error::$TAG is already published; not touching its files"
              exit 1
            fi
            gh release upload "$TAG" --repo "$REPO" --clobber "${files[@]}"
          else
            gh release create "$TAG" --repo "$REPO" --draft $prerelease \
              --title "Lodestar ${TAG#v}" \
              --notes "Draft. Windows files are not code-signed (SmartScreen will warn): check each download against SHA256SUMS, and SHA256SUMS against SHA256SUMS.minisig when that file is attached." \
              "${files[@]}"
          fi

  # ===========================================================================
  # The signed update manifest (architecture §12.2, crates/update/README.md):
  # one `<channel>.json` envelope per channel on the rolling `update-manifest`
  # release, which freshness.yml re-signs weekly. Format 1, unchanged.
  #   tag vX.Y.Z      -> stable.json and beta.json (Beta also gets stable releases)
  #   tag vX.Y.Z-rc.N -> beta.json only; a pre-release never reaches Stable
  #   nightly         -> nightly.json, only once the `nightly` environment has
  #                      NIGHTLY_SIGNING_KEY; until then a notice and a skip
  # ===========================================================================
  update-manifest:
    name: update manifest
    needs: [package-gate, package-linux, package-windows, package-release]
    # Tags after the draft release; the nightly from main (no draft release).
    if: >-
      !cancelled() &&
      github.event_name != 'pull_request' &&
      needs.package-gate.outputs.run == 'true' &&
      needs.package-linux.result == 'success' && needs.package-windows.result == 'success' &&
      ((startsWith(github.ref, 'refs/tags/v') && needs.package-release.result == 'success') ||
       (github.ref == 'refs/heads/main' && needs.package-release.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Each key only in its own environment (owner-decisions §2.21): tags use
    # `release` (v* tags only, the owner approves), the nightly `nightly` (main only).
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'nightly' }}
    # One writer for `update-manifest` at a time, shared with freshness.yml
    # (docs/decisions/2026-10-30-X-freshness-hardening.md).
    # The nightly run is inert (it signs nothing), so it gets a group of its
    # own and can never displace a pending release or freshness job.
    concurrency:
      group: ${{ startsWith(github.ref, 'refs/tags/v') && 'update-manifest' || format('update-manifest-inert-{0}', github.run_id) }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/scripts
            crates/update/keys
            docs/releases
            packaging/keys
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-{linux-*,windows}
          merge-multiple: true
          path: built

      # Tags: the manifest pins the files on the PUBLISHED release, because a
      # draft's download URLs don't work. The owner publishes the draft, then
      # approves this job (or re-runs it). Those files must be byte for byte
      # what this run built, and listed in the signed SHA256SUMS. A version
      # already in a channel's manifest is left alone, so a re-run never
      # replaces what clients may have installed.
      # Nightly: inert until the nightly key and a public home for nightly
      # files exist (Q8; the home is follow-up PK-nightly-host, the owner's call).
      - name: Sign and publish the manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # One variable per key, each empty outside its own run kind, so a
          # missing release key can never fall through to the nightly one.
          RELEASE_SIGNING_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.RELEASE_SIGNING_KEY || '' }}
          RELEASE_SIGNING_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.RELEASE_SIGNING_KEY_PASSWORD || '' }}
          NIGHTLY_SIGNING_KEY: ${{ !startsWith(github.ref, 'refs/tags/v') && secrets.NIGHTLY_SIGNING_KEY || '' }}
          TAG: ${{ needs.package-gate.outputs.tag }}
          VERSION: ${{ needs.package-gate.outputs.version }}
          MSI_VERSION: ${{ needs.package-gate.outputs.msi_version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            if [ -z "$NIGHTLY_SIGNING_KEY" ] || [ ! -f packaging/keys/lodestar-nightly.pub ]; then
              echo "::notice::No nightly update manifest: the nightly key isn't set up (NIGHTLY_SIGNING_KEY in the nightly environment and packaging/keys/lodestar-nightly.pub; owner action, Q8)."
            else
              echo "::notice::No nightly update manifest: nightly files have no public home yet (PK-nightly-host, the owner's call)."
            fi
            # PK-nightly-host: once this signs, the job's concurrency group must be `update-manifest` on main too.
            exit 0
          fi

          pub=packaging/keys/lodestar-release.pub
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::RELEASE_SIGNING_KEY is not set in the release environment: no update manifest for $TAG (owner action)."
            exit 1
          fi
          metaarg=()
          meta=docs/releases/$TAG.update.json
          if [ -f "$meta" ]; then
            metaarg=(--metadata "$meta")
          elif [ "${VERSION#*-}" = "$VERSION" ]; then
            echo "::error::Add $meta (level, security, manual_steps, min_from, migrates, reindex, reindex_bytes; crates/update/README.md) on the tagged commit: a release's manifest needs it."
            exit 1
          fi
          # Beta also receives stable releases (§12.2); a pre-release never reaches Stable.
          case "$VERSION" in *-*) channels=(beta) ;; *) channels=(stable beta) ;; esac
          if [ "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)" != false ]; then
            echo "::error::$TAG is still a draft (or missing): publish the release, then re-run this job."
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign

          work=$(mktemp -d "$RUNNER_TEMP/manifest.XXXXXX")
          umask 077
          trap 'rm -rf "$work"' EXIT
          mkdir "$work/files" "$work/envelopes" "$work/recheck"
          # The MSI's name has only MAJOR.MINOR.PATCH (build-msi.ps1).
          names=("lodestar-$VERSION-x86_64-linux-musl" "lodestar-$VERSION-aarch64-linux-musl"
                 "lodestar-$MSI_VERSION-x86_64.msi" "lodestar-$VERSION-x86_64-windows-portable.zip")
          gh release download "$TAG" --repo "$REPO" --dir "$work/files" \
            --pattern SHA256SUMS --pattern SHA256SUMS.minisig "${names[@]/#/--pattern=}"
          for f in SHA256SUMS SHA256SUMS.minisig; do
            [ -f "$work/files/$f" ] || { echo "::error::$TAG has no $f (the draft was made without the release key?): attach a signed one, then re-run."; exit 1; }
          done
          minisign -V -q -p "$pub" -m "$work/files/SHA256SUMS" -x "$work/files/SHA256SUMS.minisig"
          for name in "${names[@]}"; do
            cmp "$work/files/$name" "built/$name" ||
              { echo "::error::$name on the release isn't the file this run built."; exit 1; }
            sum=$(sha256sum "$work/files/$name" | awk '{print $1}')
            awk -v n="$name" -v s="$sum" '$2 == n && $1 == s { found = 1 } END { exit !found }' "$work/files/SHA256SUMS" ||
              { echo "::error::$name isn't in the signed SHA256SUMS with its hash."; exit 1; }
          done
          gh release view "$TAG" --repo "$REPO" --json body --jq .body >"$work/notes.md"

          # The published envelopes. Starting fresh is only for a channel
          # with no envelope yet; any other error, or one that doesn't
          # verify, fails the job rather than drop the releases it lists.
          if ! gh release view update-manifest --repo "$REPO" --json assets --jq '.assets[].name' >"$work/assets.txt" 2>"$work/view.err"; then
            grep -q 'release not found' "$work/view.err" || { cat "$work/view.err" >&2; exit 1; }
            gh release create update-manifest --repo "$REPO" --prerelease --latest=false \
              --title "Update manifests" \
              --notes "Signed update manifests, one per channel, read by Lodestar's updater. Not a release: don't download these by hand."
            : >"$work/assets.txt"
          fi

          printf '%s\n' "$RELEASE_SIGNING_KEY" >"$work/signing.key"
          sign() {
            if [ -n "$RELEASE_SIGNING_KEY_PASSWORD" ]; then
              printf '%s\n' "$RELEASE_SIGNING_KEY_PASSWORD" | minisign -S -s "$work/signing.key" "$@"
            else
              minisign -S -s "$work/signing.key" "$@" </dev/null
            fi
          }
          um() { python3 .github/scripts/update_manifest.py "$@"; }
          manifest_of() {
            if [ -f "$1" ]; then python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1]))["manifest"]))' "$1"; else echo absent; fi
          }

          upload=()
          for channel in "${channels[@]}"; do
            prev=()
            # `<channel>.published` marks a channel that has had an envelope:
            # `gh release upload --clobber` deletes before it uploads, so a
            # failed upload must not read as a first run and drop the history.
            if ! grep -qxF "$channel.json" "$work/assets.txt" && grep -qxF "$channel.published" "$work/assets.txt"; then
              echo "::error::update-manifest has $channel.published but no $channel.json: a failed upload lost it. Upload the last good $channel.json again, or delete $channel.published to start the channel over on purpose, then re-run."
              exit 1
            fi
            if grep -qxF "$channel.json" "$work/assets.txt"; then
              gh release download update-manifest --repo "$REPO" --pattern "$channel.json" --dir "$work/envelopes"
              um extract "$work/envelopes/$channel.json" "$work/$channel.prev.body" "$work/$channel.prev.minisig"
              minisign -V -q -p "$pub" -m "$work/$channel.prev.body" -x "$work/$channel.prev.minisig" ||
                { echo "::error::The published $channel manifest doesn't verify against $pub: not replacing it."; exit 1; }
              prev=(--previous "$work/$channel.prev.body")
            fi
            code=0
            um build --channel "$channel" --version "$VERSION" --repo "$REPO" --tag "$TAG" \
              --x86-64-binary "$work/files/${names[0]}" --aarch64-binary "$work/files/${names[1]}" \
              --msi "$work/files/${names[2]}" --portable "$work/files/${names[3]}" \
              --statements crates/update/keys/statements.json \
              --notes-file "$work/notes.md" --notes-url "https://github.com/$REPO/releases/tag/$TAG" \
              "${metaarg[@]}" "${prev[@]}" --out "$work/$channel.body" || code=$?
            if [ "$code" = 3 ]; then
              echo "::notice::$VERSION is already in the $channel manifest; left as it is."
              continue
            fi
            [ "$code" = 0 ] || exit "$code"
            ts=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["timestamp"])' "$work/$channel.body")
            sign -t "lodestar $channel manifest $ts" -m "$work/$channel.body" -x "$work/$channel.minisig"
            minisign -V -q -p "$pub" -m "$work/$channel.body" -x "$work/$channel.minisig"
            um envelope "$work/$channel.body" "$work/$channel.minisig" "$work/$channel.json"
            upload+=("$work/$channel.json")
          done
          rm -f "$work/signing.key"
          if [ "${#upload[@]}" -eq 0 ]; then exit 0; fi

          # Just before the upload: no envelope changed while this run signed
          # (the concurrency group is the first guard; freshness.yml does the same).
          gh release view update-manifest --repo "$REPO" --json assets --jq '.assets[].name' >"$work/recheck.txt"
          for env_file in "${upload[@]}"; do
            channel=$(basename "$env_file" .json)
            if grep -qxF "$channel.json" "$work/recheck.txt"; then
              gh release download update-manifest --repo "$REPO" --pattern "$channel.json" --dir "$work/recheck"
            fi
            [ "$(manifest_of "$work/recheck/$channel.json")" = "$(manifest_of "$work/envelopes/$channel.json")" ] ||
              { echo "::error::The $channel manifest changed during this run; re-run this job."; exit 1; }
          done
          gh release upload update-manifest --repo "$REPO" --clobber "${upload[@]}"
          markers=()
          for env_file in "${upload[@]}"; do
            channel=$(basename "$env_file" .json)
            grep -qxF "$channel.published" "$work/assets.txt" && continue
            printf 'Lodestar %s update channel: published.\n' "$channel" >"$work/$channel.published"
            markers+=("$work/$channel.published")
          done
          if [ "${#markers[@]}" -gt 0 ]; then gh release upload update-manifest --repo "$REPO" "${markers[@]}"; fi
          echo "Update manifest for $TAG published: ${upload[*]##*/}" | tee -a "$GITHUB_STEP_SUMMARY"
