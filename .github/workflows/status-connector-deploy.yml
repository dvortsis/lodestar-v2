name: Status connector deploy

# Deploys the roadmap dashboard's status connector to Cloudflare Workers when the connector itself
# changes on main. The Worker reads runner/slices.yaml and runner/dashboard.yaml from main when it
# answers, so plan changes need no deploy. The deploy needs the repository secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; without them this workflow only runs the tests.
# The Worker's own secrets (GITHUB_TOKEN, PATH_SECRET) live in Cloudflare and are not touched here.

on:
  push:
    branches: [main]
    paths: ["tools/status-connector/**", ".github/workflows/status-connector-deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: status-connector-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A named environment lets the owner require approval before a deploy (Settings, Environments).
    environment: status-connector-deploy
    env:
      # Only whether the secrets exist is visible to every step. The token values are given to the deploy step alone.
      HAVE_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    defaults:
      run:
        working-directory: tools/status-connector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Install and test run package scripts, so they run before any Cloudflare credential is in the environment.
      - run: npm ci
      - run: npm test
      - name: Skip when the Cloudflare secrets are not set
        if: env.HAVE_CLOUDFLARE != 'true'
        run: echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping the deploy."
      - name: Deploy
        if: env.HAVE_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
