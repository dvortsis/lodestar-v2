name: E2E

# PR run: Riverstone light/dark × 7 breakpoints × 2 densities, the rotating 6 themes, reduced
# motion and keyboard-only projects (axe everywhere; baselines for key screens), then Lighthouse CI.
# Nightly / manual: the `all-themes` project (axe on every route + key-screen baselines, 48 themes).
#
# Everything runs in the Playwright image pinned below (match @playwright/test in web/package.json),
# so text rendering is reproducible and the baselines are generated here, never on a laptop.
# To regenerate them: web/e2e/README.md "Updating snapshots".

on:
  # No path filter: a required check must report on every PR. The `changes` job decides
  # whether the heavy jobs run (applicability: .github/scripts/ci_changes.py E2E).
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Regenerate the baselines and upload them as an artifact'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only pull requests cancel superseded runs; main runs finish in order.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: web

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    outputs:
      applies: ${{ steps.c.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Which files apply (.github/scripts/ci_changes.py)
        id: c
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # bash, not the default `bash -e`: the pipe needs pipefail, so a crash in the script fails the step.
        shell: bash
        run: python3 .github/scripts/ci_changes.py "$EVENT" "$BASE" "$HEAD" | tee -a "$GITHUB_OUTPUT"
      - run: python3 .github/scripts/test_ci_changes.py

  e2e:
    name: playwright (core, matrix, sample, motion, keyboard)
    needs: changes
    if: >-
      needs.changes.result == 'success' &&
      ((github.event_name == 'pull_request' && needs.changes.outputs.applies == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.update_snapshots))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
    env:
      HOME: /root
    outputs:
      updated: ${{ steps.pw.outputs.updated }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npm run e2e:typecheck
      - name: Playwright
        id: pw
        # The web server (build + preview, cold `npm run assets` ~73 s) is started by the config.
        # `web/e2e/.update-snapshots` (a marker file) or the dispatch input regenerates the baselines.
        env:
          UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots }}
        run: |
          if [ -f e2e/.update-snapshots ] || [ "$UPDATE_SNAPSHOTS" = "true" ]; then
            echo "UPDATE=1" >> "$GITHUB_ENV"
            echo "updated=true" >> "$GITHUB_OUTPUT"
            # all-themes too: it owns the 46-theme baseline set, of which a PR run checks only 6.
            E2E_ALL_THEMES=1 npx playwright test --update-snapshots
          else
            npx playwright test
          fi
      - name: Upload regenerated baselines
        if: env.UPDATE == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-baselines
          path: |
            web/e2e/**/*-snapshots/*-linux.png
          if-no-files-found: error
      - name: Upload report and diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          # test-results holds the expected/actual/diff images of every failed snapshot.
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14

  # Commits regenerated baselines back to the PR branch, so no session has to
  # download the artifact (the session proxy blocks GitHub's artifact storage).
  # The write token lives only in this job, which never installs or runs the
  # PR's code: it checks out the branch, unpacks the artifact into a scratch
  # folder, copies in only *-linux.png files under web/e2e/**/*-snapshots/, and
  # pushes to the PR's own branch. Same-repo PRs only; forks get a read-only
  # token anyway. Pushes made with GITHUB_TOKEN start no new runs, so the
  # session's next push (removing web/e2e/.update-snapshots) re-runs CI.
  commit-baselines:
    name: commit regenerated baselines
    needs: e2e
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.e2e.outputs.updated == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: commit-baselines-${{ github.head_ref }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: .
    steps:
      # The tested commit, not the branch tip: if the branch has moved since,
      # the push below fails as non-fast-forward instead of putting old
      # baselines on a newer tip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      # v7 reads artifacts written by upload-artifact v7.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: snapshot-baselines
          path: ${{ runner.temp }}/baselines
      - name: Copy only snapshot PNGs into the tree
        env:
          SRC: ${{ runner.temp }}/baselines
        run: |
          set -euo pipefail
          DEST="$GITHUB_WORKSPACE/web/e2e"
          # A symlink committed under web/e2e (a folder or a *-linux.png) would
          # let mkdir/cp write outside it, so refuse any.
          if [ -L "$GITHUB_WORKSPACE/web" ] || [ -L "$DEST" ] || find "$DEST" -type l | grep -q .; then
            echo "refusing: symlink in web/e2e"; exit 1
          fi
          # upload-artifact keeps the hierarchy after the first wildcard, so
          # the artifact's root is web/e2e/. Map each file back under it and
          # refuse anything that isn't a snapshot PNG.
          cd "$SRC"
          count=$(find . -type f | wc -l)
          if [ "$count" -gt 2000 ]; then
            echo "refusing: $count files (limit 2000)"; exit 1
          fi
          re='^([A-Za-z0-9_.-]+/)*[A-Za-z0-9_.-]+-snapshots/[A-Za-z0-9_.-]+-linux\.png$'
          find . -type f -print0 | while IFS= read -r -d '' f; do
            rel="${f#./}"
            case "$rel" in
              *..*) echo "refusing path: $rel"; exit 1 ;;
            esac
            if ! [[ $rel =~ $re ]]; then
              echo "refusing path: $rel"; exit 1
            fi
            if [ "$(stat -c %s "$f")" -gt 5242880 ]; then
              echo "refusing: $rel is over 5 MB"; exit 1
            fi
            if [ "$(head -c 8 "$f" | od -An -tx1 | tr -d ' \n')" != "89504e470d0a1a0a" ]; then
              echo "not a PNG: $rel"; exit 1
            fi
            mkdir -p "$DEST/$(dirname -- "$rel")"
            cp --remove-destination -- "$f" "$DEST/$rel"
          done
      - name: Commit and push to the PR branch
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          case "$BRANCH" in main|refs/heads/main|"") echo "refusing to push to '$BRANCH'"; exit 1 ;; esac
          # :(glob) makes **/ match zero or more folders, so top-level
          # web/e2e/<spec>-snapshots/ folders are included.
          git add -- ':(glob)web/e2e/**/*-snapshots/*-linux.png'
          if git diff --cached --quiet; then echo "Baselines unchanged."; exit 0; fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Update E2E snapshot baselines from CI run ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/$BRANCH"

  lighthouse:
    name: lighthouse (mobile + desktop)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.applies == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      # Lighthouse measures the production build (no VITE_DEV_ROUTES), served by `npm run preview`.
      - run: npm run build
      - name: Lighthouse CI
        run: |
          export CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          npm run lhci
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: web/.lighthouseci
          retention-days: 14

  # The one check to require in the ruleset (pull requests only). Always reports. Passes when
  # the comparison jobs passed, or were skipped because no web/E2E input changed. Fails when
  # any failed or was cancelled, when one that applies did not run, and when the run
  # REGENERATED baselines (web/e2e/.update-snapshots): a regeneration compares nothing, so it
  # never counts as acceptance. The session's next push removes the marker and re-runs.
  e2e-ok:
    name: e2e-ok
    needs: [changes, e2e, commit-baselines, lighthouse]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          APPLIES: ${{ needs.changes.outputs.applies }}
          E2E: ${{ needs.e2e.result }}
          UPDATED: ${{ needs.e2e.outputs.updated }}
          BASELINES: ${{ needs.commit-baselines.result }}
          LIGHTHOUSE: ${{ needs.lighthouse.result }}
        run: |
          echo "changes=$CHANGES applies=$APPLIES e2e=$E2E updated=$UPDATED commit-baselines=$BASELINES lighthouse=$LIGHTHOUSE"
          case "$APPLIES" in true|false) ;; *) echo "applicability output is '$APPLIES', not true/false"; exit 1 ;; esac
          [ "$CHANGES" = success ] || { echo "change detection did not succeed"; exit 1; }
          if [ "$UPDATED" = true ]; then
            echo "This run regenerated snapshot baselines, so it compared nothing. Remove web/e2e/.update-snapshots and push."; exit 1
          fi
          case "$BASELINES" in skipped) ;; *) echo "commit-baselines result '$BASELINES' (expected skipped)"; exit 1 ;; esac
          if [ "$APPLIES" = true ]; then
            [ "$E2E" = success ] || { echo "e2e applies but its job result is '$E2E'"; exit 1; }
            [ "$LIGHTHOUSE" = success ] || { echo "lighthouse applies but its job result is '$LIGHTHOUSE'"; exit 1; }
          else
            [ "$E2E" = skipped ] && [ "$LIGHTHOUSE" = skipped ] || { echo "E2E does not apply but jobs ran: e2e=$E2E lighthouse=$LIGHTHOUSE"; exit 1; }
            echo "No E2E input changed; nothing to check."
          fi

  all-themes:
    name: playwright (all-themes)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.update_snapshots)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      # The html reporter keeps `open: never` only when the config's reporter list is used, so the
      # command-line list says it again; the json reporter feeds the run summary below.
      - run: npm run e2e:all-themes -- --reporter=list,html,json
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-json/results.json
      # Every run, pass or fail: counts and the failing spec titles, to the run page and as a
      # small artifact that `all-themes-issue` reads. This job runs npm code, so it holds no
      # write token; the titles come from the test code and are cleaned before anyone prints them.
      - name: Run summary
        if: always()
        run: |
          node <<'JS'
          const fs = require('fs');
          const out = 'all-themes-summary';
          fs.mkdirSync(out, { recursive: true });
          const clean = (t) =>
            String(t).replace(/[^\x20-\x7e]/g, ' ').replace(/[`@<>|]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 200);
          const s = { available: false, passed: 0, failed: 0, flaky: 0, skipped: 0, errors: 0, failing: [], more: 0 };
          try {
            const r = JSON.parse(fs.readFileSync('playwright-json/results.json', 'utf8'));
            const st = r.stats || {};
            Object.assign(s, { available: true, passed: st.expected | 0, failed: st.unexpected | 0, flaky: st.flaky | 0, skipped: st.skipped | 0, errors: (r.errors || []).length });
            const all = [];
            const walk = (suite, trail) => {
              const t = suite.title ? trail.concat(suite.title) : trail;
              for (const spec of suite.specs || []) if (!spec.ok) all.push(clean(t.concat(spec.title).join(' / ')));
              for (const c of suite.suites || []) walk(c, t);
            };
            for (const su of r.suites || []) walk(su, []);
            s.failing = all.slice(0, 25);
            s.more = Math.max(0, all.length - s.failing.length);
          } catch (e) {
            // No report: the run stopped before the tests produced one.
          }
          const md = s.available
            ? [`**All themes:** ${s.passed} passed, ${s.failed} failed, ${s.flaky} flaky, ${s.skipped} skipped${s.errors ? `, ${s.errors} errors outside the tests` : ''}.`]
            : ['**All themes:** no test report was produced (the run stopped before the tests finished).'];
          if (s.failing.length) {
            // A fenced block: a title can't contain a backtick, so it can't close the fence.
            md.push('', 'Failing specs:', '```', ...s.failing, ...(s.more ? [`and ${s.more} more`] : []), '```');
          }
          fs.writeFileSync(`${out}/summary.json`, JSON.stringify(s));
          fs.writeFileSync(`${out}/summary.md`, md.join('\n') + '\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md.join('\n') + '\n');
          JS
      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: all-themes-summary
          path: web/all-themes-summary
          if-no-files-found: warn
          retention-days: 30
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-all-themes
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14

  # One tracking issue for the nightly all-themes run (spec §10.17). It is its own job so the job
  # that runs npm code (`all-themes`) never holds a write token: this one has `issues: write` and
  # runs no npm code and no checkout. The summary artifact is data from that job, so it is read
  # with jq, cleaned again, and written to a file for `gh --body-file`; nothing from it reaches a
  # shell command line or a `${{ }}` expression. Not a pull-request job and not part of `ci-ok`.
  all-themes-issue:
    name: all-themes tracking issue
    needs: all-themes
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      contents: read
    # One at a time, so two runs can't both create the issue.
    concurrency:
      group: all-themes-issue
      cancel-in-progress: false
    defaults:
      run:
        working-directory: .
    steps:
      - name: Download the run summary
        if: needs.all-themes.result == 'failure' || needs.all-themes.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: all-themes-summary
          path: ${{ runner.temp }}/summary
      - name: Open, update or close the tracking issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.all-themes.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SHA: ${{ github.sha }}
          SUMMARY_DIR: ${{ runner.temp }}/summary
          WORK_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          label=nightly-all-themes
          case "$RESULT" in
            failure|success) ;;
            *) echo "all-themes result is '$RESULT': nothing to do."; exit 0 ;;
          esac
          # The label may already exist.
          gh label create "$label" --color D93F0B \
            --description "The nightly all-themes run failed" >/dev/null 2>&1 || true
          # The lowest-numbered open issue with the label, if any: never more than one is used.
          existing=$(gh issue list --label "$label" --state open --limit 100 --json number \
            --jq 'sort_by(.number) | .[0].number // empty')
          body="$WORK_DIR/issue-body.md"
          today=$(date -u +%Y-%m-%d)
          # The summary is untrusted: only numbers and printable ASCII titles, no backticks, at-signs
          # or angle brackets, at most 25 titles of 200 characters.
          if [ -f "$SUMMARY_DIR/summary.json" ] && jq -e . "$SUMMARY_DIR/summary.json" >/dev/null 2>&1; then
            jq -r '
              def num: if type == "number" and . == . and . >= 0 and . < 1e9 then (floor | tostring) else "?" end;
              def clean: tostring | gsub("[^\\x20-\\x7e]"; " ") | gsub("[`@<>|]"; " ") | .[0:200];
              if type != "object" then "The run summary had an unexpected shape."
              else
                (if .available == true then
                   "\(.passed | num) passed, \(.failed | num) failed, \(.flaky | num) flaky, \(.skipped | num) skipped"
                   + (if ((.errors // 0) | num) != "0" then ", \(.errors | num) errors outside the tests" else "" end) + "."
                 else "No test report was produced: the run stopped before the tests finished." end),
                ((.failing | if type == "array" then . else [] end) as $f
                 | if ($f | length) > 0 then
                     "", "Failing specs:", "```", ($f[:25][] | clean),
                     (if ((.more // 0) | type) == "number" and .more > 0 then "and \(.more | num) more" else empty end),
                     "```"
                   else empty end)
              end
            ' "$SUMMARY_DIR/summary.json" > "$WORK_DIR/summary-text.md"
          else
            echo "No run summary was available." > "$WORK_DIR/summary-text.md"
          fi
          if [ "$RESULT" = failure ]; then
            {
              echo "The nightly all-themes run failed on $today (UTC)."
              echo
              echo "Run: $RUN_URL"
              echo "Ref: $REF at $SHA"
              echo
              cat "$WORK_DIR/summary-text.md"
            } > "$body"
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body-file "$body"
            else
              gh issue create --label "$label" \
                --title "Nightly all-themes run is failing" --body-file "$body"
            fi
          elif [ -n "$existing" ]; then
            {
              echo "The all-themes run passed on $today (UTC): $RUN_URL"
              echo "Ref: $REF at $SHA"
              echo
              cat "$WORK_DIR/summary-text.md"
            } > "$body"
            gh issue comment "$existing" --body-file "$body"
            # Only a pass on the default branch closes it: a manual run on another branch says
            # nothing about whether main is fixed.
            if [ "$REF" = "$DEFAULT_BRANCH" ]; then
              gh issue close "$existing" --reason completed
            fi
          else
            echo "The run passed and no tracking issue is open."
          fi

  # Nightly / manual: the fixture specs against a real `lodestar serve --fixture` server.
  # The binary is built outside the Playwright container (no Rust toolchain there) and passed as
  # an artifact. Not a pull-request job and not part of `ci-ok`.
  fixture-build:
    name: build lodestar (fixture)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.update_snapshots)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      # The binary embeds web/build, so the UI is built first. VITE_DEV_ROUTES=1 because the
      # shortcuts specs drive /dev/shortcuts, which exists only in such a build.
      - run: npm ci && npm run build
        working-directory: web
        env:
          VITE_DEV_ROUTES: '1'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build -p lodestar --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lodestar-fixture-binary
          path: target/release/lodestar
          if-no-files-found: error
          retention-days: 1

  fixture:
    name: playwright (fixture)
    needs: fixture-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
    env:
      HOME: /root
      # The config adds the project from this variable or from argv; workers don't get the
      # `--project` argument, so without it they report 'Project "fixture" not found'.
      E2E_FIXTURE: '1'
      E2E_FIXTURE_URL: http://127.0.0.1:8291
      E2E_FIXTURE_DIR: /tmp/lodestar-fixture
      # Throwaway password for a test server that binds loopback only.
      E2E_FIXTURE_PASSWORD: correct horse battery
      LODESTAR_FIXTURE_PASSWORD: correct horse battery
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: lodestar-fixture-binary
          path: ${{ runner.temp }}/bin
      - run: npm ci
      - name: Start the fixture server
        run: |
          chmod +x "$RUNNER_TEMP/bin/lodestar"
          LODESTAR_HTTP_BIND=127.0.0.1:8291 \
            nohup "$RUNNER_TEMP/bin/lodestar" serve --fixture "$E2E_FIXTURE_DIR" \
            > "$RUNNER_TEMP/fixture-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/fixture-server.pid"
          # Wait for the condition, not a fixed time: up to 120 s.
          for _ in $(seq 1 240); do
            if curl -fsS "$E2E_FIXTURE_URL/healthz" > /dev/null 2>&1; then exit 0; fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/fixture-server.pid")" 2>/dev/null; then
              echo "server exited"; cat "$RUNNER_TEMP/fixture-server.log"; exit 1
            fi
            sleep 0.5
          done
          echo "server not healthy within 120 s"; cat "$RUNNER_TEMP/fixture-server.log"; exit 1
      - run: npx playwright test --project=fixture
      - name: Stop the fixture server
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/fixture-server.pid")" 2>/dev/null || true
      - name: Upload report and server log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-fixture
          # Not web/test-results/.auth: the global setup's session cookie is stored there.
          path: |
            web/playwright-report
            web/test-results
            !web/test-results/.auth
            ${{ runner.temp }}/fixture-server.log
          retention-days: 14
