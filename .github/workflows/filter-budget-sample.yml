# Temporary, for PR #97 only: samples the filter budget gate on several
# hosted runners at once to set CALIB_REF_NS, and checks that deliberate
# slowdowns of the matcher still fail it. Removed before the PR merges.
name: filter budget sample

on:
  pull_request:
    paths:
      - crates/filter/**
      - .github/workflows/filter-budget-sample.yml

permissions:
  contents: read

jobs:
  sample:
    name: sample ${{ matrix.n }} ${{ matrix.slow }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { n: 1, slow: plain }
          - { n: 2, slow: plain }
          - { n: 3, slow: plain }
          - { n: 4, slow: plain }
          - { n: 5, slow: plain }
          - { n: 6, slow: plain }
          - { n: 7, slow: no-cheap-check }
          - { n: 8, slow: full-match-x24 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Slow the matcher down
        if: matrix.slow != 'plain'
        env:
          SLOW: ${{ matrix.slow }}
        run: |
          python3 - <<'PY'
          import os
          p = "crates/filter/src/matcher.rs"
          s = open(p).read()
          old = "        self.could_match(q) && self.eval(q, None, neutral)\n"
          new = {
              "no-cheap-check": "        (std::hint::black_box(self.could_match(q)) || true) && self.eval(q, None, neutral)\n",
              "full-match-x24": "        self.could_match(q) && (0..24).filter(|_| std::hint::black_box(self.eval(q, None, neutral))).count() == 24\n",
          }[os.environ["SLOW"]]
          assert s.count(old) == 1
          open(p, "w").write(s.replace(old, new))
          PY
          git diff --stat
      - name: Budget
        run: |
          set +e
          cargo test --release -p lodestar-filter --test props -- --ignored --nocapture budget 2>&1 | tee out.txt
          status=${PIPESTATUS[0]}
          if [ "${{ matrix.slow }}" = plain ]; then exit $status; fi
          # A slowed matcher must fail on the budget, not on anything else.
          grep -q "budget on the reference runner" out.txt
