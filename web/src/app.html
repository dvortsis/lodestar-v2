<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- No font preload: it competes with the scripts and CSS that paint the page, and took the mobile
		     LCP from 2.4 s to 2.7 s (§10.1). The font is fetched at the first layout of text and swaps in
		     (font-display: swap); see docs/decisions/2026-10-22-W9.md. -->
		<title>Lodestar</title>
		<link rel="icon" href="/brand/favicons/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/brand/favicons/favicon.ico" sizes="48x48" />
		<link rel="apple-touch-icon" href="/brand/favicons/apple-touch-icon.png" />
		<link rel="manifest" href="/brand/favicons/site.webmanifest" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F6F5" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141F25" />
		<!-- prettier-ignore -->
		<script id="prepaint">(function(){var d=document.documentElement,s={},v,i,p;try{s=JSON.parse(localStorage.getItem('lodestar.theme'))||{}}catch(e){}var m=s.mode,n=m=='dark'||(m!='light'&&matchMedia('(prefers-color-scheme:dark)').matches),t=s[n?'dark':'light']||{},r='riverstone-'+(n?'dark':'light'),ok;i=t.id;v=t.vars;ok=typeof i=='string'&&/^[a-z0-9-]+$/.test(i)&&i.indexOf('riverstone-')!=0&&v&&typeof v=='object'&&Object.keys(v).length;d.dataset.theme=ok?i:r;d.style.colorScheme=n?'dark':'light';if(ok)for(p in v)/^--[a-z0-9-]+$/.test(p)&&d.style.setProperty(p,v[p])})()</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- First-paint shell. With ssr off, nothing would paint until the Svelte runtime, kit and app
		     chunks have run, so LCP would grow with them (§10.1). This markup paints from HTML and CSS
		     alone: the skip link, the top bar's brand and links (real anchors, which kit's router takes
		     over once it starts) and, on /search, the page heading. When the app mounts,
		     lib/shell/Shell.svelte moves #boot-header into its own header slot and removes #boot in the
		     same task, so nothing moves. It mirrors lib/shell/TopBar.svelte; the guard test
		     e2e/boot-shell.routes.test.ts fails if the two drift. English only: the script below drops it when the app will
		     show another language (same rule as lib/i18n/locale.svelte.ts) and on the sign-in screens. -->
		<div id="boot" class="flex min-h-dvh flex-col bg-base-200 text-base-content">
			<a
				href="#boot-main"
				class="sr-only rounded-field bg-primary px-4 py-2 text-primary-content focus:not-sr-only focus:fixed focus:start-2 focus:top-2 focus:z-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary focus-visible:outline-solid"
				>Skip to main content</a
			>
			<header id="boot-header" class="border-b border-base-300 bg-base-100">
				<div class="flex min-h-14 items-center gap-2 px-4">
					<div class="x-large:hidden">
						<span class="btn btn-ghost btn-square" aria-hidden="true">
							<svg
								viewBox="0 0 256 256"
								fill="currentColor"
								class="size-(--icon-size-nav)"
								aria-hidden="true"
							>
								<path
									d="M224 128a8 8 0 0 1-8 8H40a8 8 0 0 1 0-16h176a8 8 0 0 1 8 8M40 72h176a8 8 0 0 0 0-16H40a8 8 0 0 0 0 16m176 112H40a8 8 0 0 0 0 16h176a8 8 0 0 0 0-16"
								/>
							</svg>
						</span>
					</div>
					<a
						href="/search"
						aria-label="Lodestar, home"
						data-boot-brand
						data-testid="brand"
						class="inline-flex items-center gap-2 rounded-field pe-2 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary focus-visible:outline-solid pointer-coarse:min-h-(--target-min) pointer-coarse:min-w-(--target-min)"
					>
						<svg viewBox="0 0 512 512" class="size-8 shrink-0" aria-hidden="true">
							<circle cx="256" cy="256" r="182" fill="var(--brand-surface)" />
							<path
								d="M99 257 A157 157 0 0 1 362 142 M413 258 A157 157 0 0 1 152 371"
								stroke="var(--brand-primary)"
								stroke-width="22"
								stroke-linecap="round"
								fill="none"
							/>
							<circle cx="115" cy="192" r="21" fill="var(--brand-accent)" />
							<circle cx="384" cy="340" r="23" fill="var(--brand-accent)" />
							<path
								d="M256 118 L290 218 L390 256 L290 290 L256 390 L221 290 L121 256 L221 218 Z"
								fill="var(--brand-star)"
							/>
							<circle cx="256" cy="256" r="28" fill="var(--brand-surface)" />
						</svg>
						<span class="hidden text-body-lg font-semibold large:inline">Lodestar</span>
					</a>
					<nav aria-label="Main" class="ms-2 hidden items-center gap-1 x-large:flex">
						<a
							href="/search"
							data-boot-nav
							data-testid="nav-search"
							class="relative inline-flex min-h-(--control-height) items-center gap-2 rounded-field px-3 text-body hover:bg-hover focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary focus-visible:outline-solid pointer-coarse:min-h-(--target-min) pointer-coarse:min-w-(--target-min)"
							>Search</a
						>
						<a
							href="/discover"
							data-boot-nav
							data-testid="nav-discover"
							class="relative inline-flex min-h-(--control-height) items-center gap-2 rounded-field px-3 text-body hover:bg-hover focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary focus-visible:outline-solid pointer-coarse:min-h-(--target-min) pointer-coarse:min-w-(--target-min)"
							>Discover</a
						>
						<a
							href="/alerts"
							data-boot-nav
							data-testid="nav-alerts"
							class="relative inline-flex min-h-(--control-height) items-center gap-2 rounded-field px-3 text-body hover:bg-hover focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary focus-visible:outline-solid pointer-coarse:min-h-(--target-min) pointer-coarse:min-w-(--target-min)"
							>Alerts</a
						>
						<a
							href="/insights"
							data-boot-nav
							data-testid="nav-insights"
							class="relative inline-flex min-h-(--control-height) items-center gap-2 rounded-field px-3 text-body hover:bg-hover focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary focus-visible:outline-solid pointer-coarse:min-h-(--target-min) pointer-coarse:min-w-(--target-min)"
							>Insights</a
						>
						<a
							href="/settings"
							data-boot-nav
							data-testid="nav-settings"
							class="relative inline-flex min-h-(--control-height) items-center gap-2 rounded-field px-3 text-body hover:bg-hover focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary focus-visible:outline-solid pointer-coarse:min-h-(--target-min) pointer-coarse:min-w-(--target-min)"
							>Settings</a
						>
					</nav>
				</div>
			</header>
			<main id="boot-main" class="flex flex-1 flex-col">
				<!-- /search only (the script below unhides it): the page heading and the query bar, box for
				     box as routes/search and features/search/query/QueryBar.svelte draw them, so the
				     bar is the first paint, not a late LCP. Inert: the app's own bar takes typing. -->
				<div id="boot-h1" class="flex flex-col gap-2 pb-4" hidden>
					<h1 class="mt-4 px-4 text-display font-semibold">Search</h1>
					<div class="flex flex-col gap-1 px-4 py-2" aria-hidden="true">
						<div class="flex items-center gap-2">
							<div class="relative min-w-0 flex-1">
								<div
									data-testid="query-editor"
									class="block w-full rounded-field border border-field-border bg-base-100 px-4 text-body-lg"
									style="height: var(--query-bar-height)"
								></div>
								<span
									class="pointer-events-none absolute inset-0 truncate px-4 text-body-lg text-muted-text"
									style="padding-block: calc(var(--spacing) * 3)"
									><span class="medium:hidden">Search, or filter: res:1080p</span
									><span class="hidden medium:inline"
										>Search by name, or add a filter such as res:1080p</span
									></span
								>
							</div>
							<span
								class="btn btn-ghost pointer-coarse:min-h-(--target-min) pointer-coarse:min-w-(--target-min)"
								>Syntax</span
							>
						</div>
						<p class="text-small">&nbsp;</p>
					</div>
				</div>
			</main>
		</div>
		<!-- prettier-ignore -->
		<script>(function(){var b=document.getElementById('boot');if(!b)return;var p=location.pathname,L=/*boot-locales*/{"en":1,"zh":1}/*end*/,g=navigator.languages||[navigator.language],r='en',j,t,k;for(j=0;j<g.length;j++){t=String(g[j]||'').toLowerCase();k=t.split('-')[0];if(L[t]){r=t;break}if(L[k]){r=k;break}}if(/^\/(login|setup|welcome)(\/|$)/.test(p)||r!='en'){b.remove();return}var a=b.querySelectorAll('[data-boot-nav]'),i,h,d=new URLSearchParams(location.search).get('density');if(d)b.querySelector('[data-boot-brand]').setAttribute('href','/search?density='+encodeURIComponent(d));for(i=0;i<a.length;i++){h='/'+a[i].getAttribute('href').split('/')[1];if(d)a[i].setAttribute('href',h+'?density='+encodeURIComponent(d));if(p==h||p.indexOf(h+'/')==0){a[i].setAttribute('aria-current','page');a[i].className+=' font-semibold';a[i].insertAdjacentHTML('beforeend','<span class="absolute inset-x-3 -bottom-1 h-0.5 rounded-selector bg-primary" aria-hidden="true"></span>')}}if(p=='/search'||p=='/search/')document.getElementById('boot-h1').hidden=false})()</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
