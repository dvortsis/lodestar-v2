[package]
name = "lodestar-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lodestar-bencode = { path = "../crates/bencode" }
lodestar-dht = { path = "../crates/dht" }
lodestar-metainfo = { path = "../crates/metainfo" }
lodestar-search = { path = "../crates/search" }
lodestar-store = { path = "../crates/store" }

# Each target is a separate binary; see README.md for running them.
[[bin]]
name = "bencode"
path = "fuzz_targets/bencode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "krpc"
path = "fuzz_targets/krpc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "metainfo"
path = "fuzz_targets/metainfo.rs"
test = false
doc = false
bench = false

[[bin]]
name = "filetree"
path = "fuzz_targets/filetree.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tokenizer"
path = "fuzz_targets/tokenizer.rs"
test = false
doc = false
bench = false
