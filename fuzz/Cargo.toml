[package]
name = "lodestar-fuzz"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lodestar-bencode = { path = "../crates/bencode" }
lodestar-classify = { path = "../crates/classify" }
lodestar-cluster = { path = "../crates/cluster" }
lodestar-dht = { path = "../crates/dht" }
lodestar-filter = { path = "../crates/filter" }
lodestar-metainfo = { path = "../crates/metainfo" }
lodestar-release-parser = { path = "../crates/release-parser" }
lodestar-search = { path = "../crates/search" }
lodestar-sources-feeds = { path = "../crates/sources-feeds" }
lodestar-sources-importers = { path = "../crates/sources-importers" }
lodestar-store = { path = "../crates/store" }
lodestar-tracker-scrape = { path = "../crates/tracker-scrape" }
lodestar-update = { path = "../crates/update", features = ["testing"] }
base64 = "=0.22.1"
semver = "=1.0.28"
serde_json = "1.0.154"
sha2 = "0.11"
lodestar-utp = { path = "../crates/utp" }

# Each target is a separate binary; see README.md for running them.
[[bin]]
name = "bencode"
path = "fuzz_targets/bencode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "krpc"
path = "fuzz_targets/krpc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "metainfo"
path = "fuzz_targets/metainfo.rs"
test = false
doc = false
bench = false

[[bin]]
name = "filetree"
path = "fuzz_targets/filetree.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tokenizer"
path = "fuzz_targets/tokenizer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "query"
path = "fuzz_targets/query.rs"
test = false
doc = false
bench = false

[[bin]]
name = "release"
path = "fuzz_targets/release.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tracker_scrape"
path = "fuzz_targets/tracker_scrape.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lists"
path = "fuzz_targets/lists.rs"
test = false
doc = false
bench = false

[[bin]]
name = "utp"
path = "fuzz_targets/utp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cluster_frame"
path = "fuzz_targets/cluster_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "update"
path = "fuzz_targets/update.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dht_restart"
path = "fuzz_targets/dht_restart.rs"
test = false
doc = false
bench = false

[[bin]]
name = "magnetico_row"
path = "fuzz_targets/magnetico_row.rs"
test = false
doc = false
bench = false

[[bin]]
name = "torznab"
path = "fuzz_targets/torznab.rs"
test = false
