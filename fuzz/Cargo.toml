[package]
name = "lodestar-fuzz"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lodestar-bencode = { path = "../crates/bencode" }
lodestar-classify = { path = "../crates/classify" }
lodestar-cluster = { path = "../crates/cluster" }
lodestar-companions = { path = "../crates/companions", features = ["testing"] }
lodestar-dht = { path = "../crates/dht" }
lodestar-filter = { path = "../crates/filter" }
lodestar-integrations = { path = "../crates/integrations" }
lodestar-metainfo = { path = "../crates/metainfo" }
lodestar-peer-wire = { path = "../crates/peer-wire" }
lodestar-pipeline = { path = "../crates/pipeline" }
lodestar-release-parser = { path = "../crates/release-parser" }
lodestar-search = { path = "../crates/search" }
lodestar-sources = { path = "../crates/sources" }
lodestar-sources-feeds = { path = "../crates/sources-feeds" }
lodestar-sources-importers = { path = "../crates/sources-importers" }
lodestar-sources-plugins = { path = "../crates/sources-plugins" }
lodestar-store = { path = "../crates/store" }
lodestar-tracker-scrape = { path = "../crates/tracker-scrape" }
lodestar-update = { path = "../crates/update", features = ["testing"] }
base64 = "=0.22.1"
semver = "=1.0.28"
# `raw_value` (additive) lets `tpdb` read a numeric id's exact digits; not
# `arbitrary_precision`, which would change how every crate here reads
# numbers (X-fuzz-tpdb-harness).
serde_json = { version = "1.0.154", features = ["raw_value"] }
# `tpdb`'s reader of a repeated key (the first is kept, as the plugin does).
serde = "1.0.229"
sha2 = "0.11"
# The plugins' own pin: `verified_claims` compares trackers in its form.
url = "2.5.8"
lodestar-utp = { path = "../crates/utp" }
# `peer_fetch` plays a peer over an in-memory stream, with a runtime's
# clock for the fetch's timers; `mse` plays both sides over a pipe.
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time", "io-util"] }
# `mse` seeds both sides' key exchange from its input.
rand = "0.10"

