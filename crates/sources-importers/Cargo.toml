[package]
name = "lodestar-sources-importers"
description = "Importers: bring an existing corpus (bitmagnet, later dumps) into the store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
lodestar-metainfo.workspace = true
lodestar-store.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled", "hooks", "limits"] }
sha2 = "0.11.0"
tokio = { version = "1.54.0", features = ["rt", "macros", "time"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["rt", "rt-multi-thread", "macros", "time"] }
