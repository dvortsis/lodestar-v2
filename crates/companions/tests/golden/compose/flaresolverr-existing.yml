# Generated by Lodestar. Check it before you apply it.
# Mount real folders only, never a link to somewhere else.
# Ports stay on the Docker network unless you chose to publish them.
# A container that already has one of these names stops it from starting.
"services":
  "flaresolverr":
    "image": "ghcr.io/flaresolverr/flaresolverr@sha256:abababababababababababababababababababababababababababababababab"
    "container_name": "flaresolverr"
    "restart": "unless-stopped"
    # All of its traffic goes through your gluetun container.
    "network_mode": "container:my-vpn"
    "environment":
      "TZ": "Etc/UTC"
      "LOG_LEVEL": "info"
# The network Lodestar is on. It must exist already (docker network ls).
"networks":
  "lodestar":
    "name": "lodestar"
    "external": true
