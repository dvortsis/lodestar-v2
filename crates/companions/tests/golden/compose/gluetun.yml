# Generated by Lodestar. Check it before you apply it.
# Mount real folders only, never a link to somewhere else.
# Ports stay on the Docker network unless you chose to publish them.
"services":
  # Fill these in yourself, from your VPN provider. Lodestar never asks for
  # or stores them. gluetun won't start until they are real values.
  "gluetun":
    "image": "docker.io/qmcgaw/gluetun@sha256:abababababababababababababababababababababababababababababababab"
    "container_name": "gluetun"
    "restart": "unless-stopped"
    # NET_ADMIN lets gluetun set up the tunnel, its routes and its firewall
    # (the kill switch). gluetun's upstream setup requires it.
    "cap_add":
      - "NET_ADMIN"
    # The kernel's tunnel device, which the VPN needs (upstream setup).
    "devices":
      - "/dev/net/tun:/dev/net/tun"
    "networks":
      - "lodestar"
    "environment":
      "TZ": "Etc/UTC"
      # Your VPN provider, as gluetun names it.
      "VPN_SERVICE_PROVIDER": "FILL_IN_YOURSELF"
      "VPN_TYPE": "wireguard"
      # Your WireGuard private key, from your provider.
      "WIREGUARD_PRIVATE_KEY": "FILL_IN_YOURSELF"
      # Your WireGuard address, from your provider.
      "WIREGUARD_ADDRESSES": "FILL_IN_YOURSELF"
# The network Lodestar is on. It must exist already (docker network ls).
"networks":
  "lodestar":
    "name": "lodestar"
    "external": true
