# Generated by Lodestar. Check it before you apply it.
# Mount real folders only, never a link to somewhere else.
# Ports stay on the Docker network unless you chose to publish them.
"services":
  "prowlarr":
    "image": "lscr.io/linuxserver/prowlarr@sha256:abababababababababababababababababababababababababababababababab"
    "container_name": "prowlarr"
    "restart": "unless-stopped"
    "networks":
      - "lodestar"
    "environment":
      "PUID": "99"
      "PGID": "100"
      "TZ": "Etc/UTC"
      "UMASK": "022"
    "volumes":
      - "type": "bind"
        "source": "/mnt/user/appdata/prowlarr"
        "target": "/config"
        "bind":
          "create_host_path": true
    "ports":
      - "target": 9696
        "published": 9696
        "host_ip": "127.0.0.1"
        "protocol": "tcp"
# The network Lodestar is on. It must exist already (docker network ls).
"networks":
  "lodestar":
    "name": "lodestar"
    "external": true
