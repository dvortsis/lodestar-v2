[package]
name = "lodestar-companions"
description = "Companion manager core: the closed input types templates use, the adapter traits and, from CMP-0, the compiled-in companion catalogue"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# Lets tests and later crates' dev-dependencies load a catalogue other than
# the compiled-in one (`Catalogue::from_json`). Never enabled by a shipped
# build: a release reads only `data/catalogue.json`.
testing = []

[dependencies]
getrandom = "=0.3.4"
lodestar-integrations.workspace = true
lodestar-log.workspace = true
lodestar-update.workspace = true
pbkdf2 = { version = "=0.13.0", default-features = false, features = ["hmac"] }
quick-xml = { version = "=0.42.0", default-features = false }
# The GuardedClient's request and response types (CMP-1); the client itself
# comes from lodestar-integrations.
reqwest = { version = "=0.13.5", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.0"
tokio = { version = "=1.54.0", features = ["rt", "sync", "time", "process", "macros", "io-util"] }
zeroize = "=1.9.1"

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW for the download's .part file (CMP-1); signals, pidfds and
# the effective uid for the supervisor (CMP-4a).
rustix = { version = "=1.1.5", features = ["fs", "process"] }

[dev-dependencies]
lodestar-companions = { path = ".", features = ["testing"] }
lodestar-update = { workspace = true, features = ["testing"] }
proptest = "=1.11.0"
tempfile = "=3.27.0"
tokio = { version = "=1.54.0", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "process", "signal"] }

[lints]
workspace = true
