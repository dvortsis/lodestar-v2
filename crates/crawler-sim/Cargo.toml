[package]
name = "lodestar-crawler-sim"
description = "The deterministic crawler simulator (CR-SIM): the real DHT actor and fetch pool against a scripted network, asserted on goldens"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

# Test-only: the simulator is the `sim` test, and the only crate that
# enables the dht and sources `testing` seams, so those crates' own tests
# and builds keep their production types.
[dev-dependencies]
lodestar-dht = { workspace = true, features = ["testing"] }
lodestar-metainfo.workspace = true
lodestar-network-policy.workspace = true
lodestar-peer-wire = { workspace = true, features = ["testing"] }
lodestar-sources = { workspace = true, features = ["testing"] }
lodestar-store.workspace = true
# M8-NET-E2E (`e2e_search`): the real pipeline, index and `/search` route
# downstream of the DHT, called in process. The third-party crates are
# already in the lockfile at the versions lodestar-api uses.
lodestar-api.workspace = true
lodestar-bencode.workspace = true
lodestar-pipeline.workspace = true
lodestar-search.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query", "matched-path"] }
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1.54.1", features = ["sync", "time", "rt", "rt-multi-thread", "macros", "net", "test-util"] }
