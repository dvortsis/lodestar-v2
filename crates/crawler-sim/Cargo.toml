[package]
name = "lodestar-crawler-sim"
description = "The deterministic crawler simulator (CR-SIM): the real DHT actor and fetch pool against a scripted network, asserted on goldens"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

# Test-only: the simulator is the `sim` test, and the only crate that
# enables the dht and sources `testing` seams, so those crates' own tests
# and builds keep their production types.
[dev-dependencies]
lodestar-dht = { workspace = true, features = ["testing"] }
lodestar-metainfo.workspace = true
lodestar-network-policy.workspace = true
lodestar-peer-wire.workspace = true
lodestar-sources = { workspace = true, features = ["testing"] }
lodestar-store.workspace = true
tokio = { version = "1.54.0", features = ["sync", "time", "rt", "macros", "test-util"] }
