[package]
name = "lodestar-pipeline"
description = "Crawler to fetch to store orchestration: plugins, the fetch pool, the have-filter and the single writer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
lodestar-dht.workspace = true
lodestar-metainfo.workspace = true
lodestar-peer-wire.workspace = true
lodestar-sources.workspace = true
lodestar-store.workspace = true
lodestar-tracker-scrape.workspace = true
lodestar-cluster.workspace = true
lodestar-classify.workspace = true
lodestar-filter.workspace = true
lodestar-integrations.workspace = true
lodestar-log.workspace = true
lodestar-network-policy.workspace = true
# The have-filter's keyed PRF (WK-3); already in the lockfile through phf.
siphasher = "=1.0.4"
tokio = { version = "1.54.0", features = ["sync", "time", "rt", "macros"] }

[lints]
workspace = true

[dev-dependencies]
lodestar-tracker-scrape = { workspace = true, features = ["testing"] }
proptest = "1.11.0"
lodestar-bencode.workspace = true
lodestar-classify.workspace = true
lodestar-filter.workspace = true
lodestar-metainfo.workspace = true
lodestar-dht.workspace = true
lodestar-peer-wire = { workspace = true, features = ["testing"] }
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["sync", "time", "rt", "rt-multi-thread", "macros", "net", "test-util"] }
