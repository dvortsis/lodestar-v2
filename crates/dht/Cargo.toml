[package]
name = "lodestar-dht"
description = "Mainline DHT: KRPC codec, routing table, harvesting node"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# Test-only seams for the deterministic crawler simulator
# (crates/sources/tests/sim): an in-memory socket, a seeded RNG, ordered
# maps and fixed seen-filter keys. No production build enables it.
testing = []

[dependencies]
lodestar-network-policy.workspace = true
lodestar-bencode.workspace = true
lodestar-metainfo.workspace = true
lodestar-log.workspace = true
rand = "0.10"
sha1 = "0.11"
sha2 = "0.11"
socket2 = "0.6.5"
tokio = { version = "1.54.0", features = ["net", "time", "rt", "macros", "sync"] }

[dev-dependencies]
proptest = "1.11.0"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "time", "net", "sync", "test-util"] }

[lints]
workspace = true
