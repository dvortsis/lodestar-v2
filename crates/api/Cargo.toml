[package]
name = "lodestar-api"
description = "HTTP API: auth (setup token, password, sessions), search, parse and torrent detail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
form_urlencoded = "1.2.2"
# `Stream`, to name the SSE body (axum's own dependency, already in the lock).
futures-core = { version = "0.3.34", default-features = false }
hmac = "0.13.0"
lodestar-classify.workspace = true
lodestar-filter.workspace = true
lodestar-metainfo.workspace = true
lodestar-search.workspace = true
lodestar-store.workspace = true
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1.20"
serde_urlencoded = "0.7.1"
sha2 = "0.11"
tokio = { version = "1.54.0", features = ["rt", "macros", "sync", "time"] }
tracing = "0.1.44"
utoipa = { version = "5.5.0", default-features = false, features = ["macros"] }

[lints]
workspace = true

[dev-dependencies]
lodestar-bencode.workspace = true
lodestar-pipeline.workspace = true
proptest = "1.11.0"
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["rt", "macros", "sync", "time", "net", "io-util"] }
tower = { version = "0.5", features = ["util"] }
