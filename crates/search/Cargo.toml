[package]
name = "lodestar-search"
description = "Tantivy torrent index: tokenizer, schema, near-real-time indexing and queries"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
lodestar-classify.workspace = true
lodestar-metainfo.workspace = true
lodestar-release-parser.workspace = true
lodestar-store.workspace = true
tantivy = { version = "0.27.0", default-features = false, features = ["mmap", "lz4-compression", "zstd-compression", "stemmer"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1.44"
unicode-normalization = "0.1.24"

[lints]
workspace = true

[dev-dependencies]
lodestar-bencode.workspace = true
lodestar-pipeline.workspace = true
proptest = "1.11.0"
serde_json = "1"
tempfile = "3.27.0"
