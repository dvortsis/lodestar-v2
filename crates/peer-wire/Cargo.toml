[package]
name = "lodestar-peer-wire"
description = "BitTorrent peer wire for metadata fetching: BEP 3/10/9 with MSE/PE"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# A fake seeding peer for tests of this crate and of the pipeline.
testing = []

[dependencies]
lodestar-bencode.workspace = true
lodestar-metainfo.workspace = true
# Path rather than workspace dependency: the root manifest isn't this
# slice's to edit.
lodestar-utp = { path = "../utp" }
num-bigint = "0.5.1"
rand = "0.10"
sha1 = "0.11"
sha2 = "0.11"
tokio = { version = "1.54.0", features = ["net", "io-util", "time", "rt", "macros"] }

[lints]
workspace = true

[dev-dependencies]
lodestar-peer-wire = { path = ".", features = ["testing"] }
proptest = "1.11.0"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
