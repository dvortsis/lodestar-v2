[package]
name = "lodestar-sources-plugins"
description = "Source plugins that poll outside services through the plugin kit (Prowlarr/Jackett first)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# Test doubles for the plugins' host interfaces (full_scrape's
# StaticPrivateTrackers and TokioClock), for this crate's tests. Never
# enabled by the running app.
testing = []

[dependencies]
lodestar-integrations.workspace = true
lodestar-metainfo.workspace = true
lodestar-sources.workspace = true
lodestar-sources-feeds.workspace = true
# SRC-12: the full-scrape parser and tracker URLs.
lodestar-tracker-scrape.workspace = true
# The workspace's existing pin (crates/sources-feeds, crates/integrations).
quick-xml = { version = "=0.42.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["sync", "time", "rt", "macros"] }
url = "2.5.8"

[dev-dependencies]
# SRC-G (`tests/safety.rs`): every plugin's fixture finds go through the
# real pipeline, filter and store.
lodestar-classify.workspace = true
lodestar-dht.workspace = true
lodestar-filter.workspace = true
lodestar-log.workspace = true
lodestar-peer-wire.workspace = true
lodestar-pipeline.workspace = true
lodestar-sources-plugins = { path = ".", features = ["testing"] }
lodestar-store.workspace = true
proptest = "1.11.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["sync", "time", "rt", "rt-multi-thread", "macros", "test-util"] }

[lints]
workspace = true
