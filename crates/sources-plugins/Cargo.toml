[package]
name = "lodestar-sources-plugins"
description = "Source plugins that poll outside services through the plugin kit (Prowlarr/Jackett first)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
lodestar-integrations.workspace = true
lodestar-metainfo.workspace = true
lodestar-sources.workspace = true
lodestar-sources-feeds.workspace = true
# SRC-12: the full-scrape parser and tracker URLs.
lodestar-tracker-scrape.workspace = true
# The workspace's existing pin (crates/sources-feeds, crates/integrations).
quick-xml = { version = "=0.42.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["sync", "time", "rt", "macros"] }
url = "2.5.8"

[dev-dependencies]
lodestar-store.workspace = true
proptest = "1.11.0"
tokio = { version = "1.54.0", features = ["sync", "time", "rt", "macros", "test-util"] }

[lints]
workspace = true
