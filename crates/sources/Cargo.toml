[package]
name = "lodestar-sources"
description = "Source plugin API (manifest, context, events) and crawl scheduler v1 (the shared metadata-fetch pool)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# Fixed hash keys for the deterministic crawler simulator (tests/sim). No
# production build enables it.
testing = []

[dependencies]
lodestar-network-policy.workspace = true
lodestar-metainfo.workspace = true
lodestar-peer-wire.workspace = true
lodestar-store.workspace = true
tokio = { version = "1.54.0", features = ["sync", "time", "rt", "macros"] }

[lints]
workspace = true

[dev-dependencies]
lodestar-dht = { workspace = true, features = ["testing"] }
lodestar-sources = { path = ".", features = ["testing"] }
tokio = { version = "1.54.0", features = ["sync", "time", "rt", "macros", "test-util"] }
