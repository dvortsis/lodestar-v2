[package]
name = "lodestar-sources"
description = "Source plugin API (manifest, context, events) and crawl scheduler v1 (the shared metadata-fetch pool)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# Fixed hash keys for the deterministic crawler simulator
# (crates/crawler-sim). Only that crate enables it.
testing = []

[dependencies]
lodestar-integrations.workspace = true
lodestar-network-policy.workspace = true
lodestar-metainfo.workspace = true
lodestar-peer-wire.workspace = true
lodestar-store.workspace = true
# The plugin WebSocket client (NOS-2b): the same crates and pins as
# crates/cluster and crates/sources-irc, all already in the lockfile.
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "=0.7.1"
tokio-rustls = { version = "=0.26.6", default-features = false }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
tokio = { version = "1.54.1", features = ["sync", "time", "rt", "macros", "net"] }
url = "2.5.8"

[lints]
workspace = true

[dev-dependencies]
proptest = "1.11.0"
tokio = { version = "1.54.1", features = ["sync", "time", "rt", "macros", "test-util", "net", "io-util"] }
