[package]
name = "lodestar-integrations"
description = "Download-client adapters, notification channels, secret storage and the SSRF guard for user-configured URLs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
chacha20poly1305 = "0.10.1"
getrandom = "0.3.4"
# XML-RPC answers from rTorrent (X-clients, §16): the reader only, no serde,
# no encodings; DTDs and entities are refused by the adapter.
quick-xml = { version = "=0.42.0", default-features = false }
# rustls on ring, as tracker-scrape and the subscriptions fetcher use it
# (§16): aws-lc, reqwest's default provider, is a C/CMake build.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "multipart", "form", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt", "net", "sync", "time"] }
tracing = "0.1.44"
zeroize = "1.9.1"

[lints]
workspace = true

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
proptest = "1.11.0"
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["rt", "rt-multi-thread", "macros", "net", "sync", "time"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }
