[package]
name = "lodestar-integrations"
description = "Download-client adapters, notification channels, secret storage and the SSRF guard for user-configured URLs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
chacha20poly1305 = "0.10.1"
getrandom = "0.3.4"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt", "net", "sync", "time"] }
tracing = "0.1.44"
zeroize = "1.9.1"

[lints]
workspace = true

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
proptest = "1.11.0"
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["rt", "rt-multi-thread", "macros", "net", "sync", "time"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }
