[package]
name = "lodestar"
description = "Lodestar: a DHT crawler and torrent-metadata search engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
# `openapi` is a dev tool beside the server.
default-run = "lodestar"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
# Rotated log files are gzip-compressed (B-log1, architecture §12.1).
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
# The log's per-run reference key (OS RNG) and its keyed hash.
getrandom = "0.3.4"
hmac = "0.13.0"
lodestar-api.workspace = true
# `serve --fixture`'s data set (src/fixture.rs), behind `fixture`.
lodestar-bench = { path = "../../bench", optional = true }
lodestar-dht.workspace = true
lodestar-filter.workspace = true
lodestar-log.workspace = true
lodestar-peer-wire.workspace = true
lodestar-pipeline.workspace = true
lodestar-search.workspace = true
lodestar-sources-importers.workspace = true
lodestar-sources.workspace = true
lodestar-store.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
mimalloc = { version = "0.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
utoipa = { version = "5.5.0", default-features = false, features = ["macros"] }

# PUID/PGID privilege drop (src/privdrop.rs): safe wrappers for the set*id
# and *at syscalls, since the workspace forbids `unsafe` (and so libc). It is
# already in the lock through tantivy's fs4 and tempfile.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "process", "thread"] }

[features]
default = ["web", "fixture"]
# Embed web/build (the Svelte UI) when it exists; without it, a stub page.
web = []
# `serve --fixture`: test data built in (about 690 KB of a stripped binary).
fixture = ["dep:lodestar-bench"]

[build-dependencies]
base64 = "0.22.1"
brotli = "9.0.0"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
sha2 = "0.11.0"

[lints]
workspace = true

[dev-dependencies]
# The build script's bundler, included by the tests (src/web_build.rs).
base64 = "0.22.1"
brotli = "9.0.0"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
proptest = "1.11.0"
sha2 = "0.11.0"
tower = { version = "0.5.3", features = ["util"] }
lodestar-classify.workspace = true
lodestar-metainfo.workspace = true
tempfile = "3.27.0"
