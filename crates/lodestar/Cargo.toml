[package]
name = "lodestar"
description = "Lodestar: a DHT crawler and torrent-metadata search engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
lodestar-api.workspace = true
lodestar-dht.workspace = true
lodestar-peer-wire.workspace = true
lodestar-pipeline.workspace = true
lodestar-search.workspace = true
lodestar-sources.workspace = true
lodestar-store.workspace = true
mimalloc = { version = "0.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
