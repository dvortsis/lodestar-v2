    model: opus
    deps: [B5b, B1]
    owns: ["crates/search/**", "crates/api/src/search.rs"]
    spec: ["§8 Stable pagination, Cancellation"]
  - id: B4
    title: SSE /events hub with topics, resync and connection cap
    kind: core
    model: opus
    deps: [B1]
    owns: ["crates/api/src/events.rs", "crates/search/src/live.rs"]
    spec: ["§9", "§10.1", "§10.9.6"]
  - id: B8
    title: The M5 migration (saved searches, alerts, user items, collections, api keys, index_watermark_hour, query_log)
    kind: core
    model: opus
    deps: [B1, "ext:m4-schema-settled"]
    owns: ["crates/store/**"]
    spec: ["§7", "§10.8", "§10.9.5"]
  - id: B6
    title: /facets (disjunctive terms, histograms, sampling) — search schema bump
