# Slice graph for the build runner (runner/README.md). Ids match docs/build-plan.md.
# model: opus | sonnet | haiku | other (a non-Claude agent the owner launched).   kind: core (Opus code) | helper | docs | gate | epic.
# deps: slice ids that must be merged first; "ext:<name>" entries are checked
# against the `external` section. owns: paths the slice may edit (globs);
# two running slices never own overlapping paths.

limits:
  max_core: 16             # Opus code slices at once (disjoint owned paths only; owner raised to 16, 2026-10-22)
  max_helpers: 16          # Sonnet/Haiku slices at once (owner, 2026-10-22)
  max_launches_per_day: 60 # backstop against runaway loops, not a budget (owner raised from 40, 2026-10-23)
  review_rounds_before_escalation: 2
  phase_total: 4           # owner §2.64 (2026-11-12T22:30Z): from 2026-11-13T00:00Z at most 4 build slices at once, replacing §2.59 to §2.61; sessions over the cap finish their open PR only (§2.65). Filling them all isn't required; a slot stays empty rather than overlap owns. Remove when the owner lifts it (runner/README.md step 7)
  extra_shared: 4          # owner §2.64: four cloud-testing sessions beyond phase_total (the cloud tester X-test-vm and the runner's cloud-testing slices, §2.62). Tracked in runner-state `slots` (cap field) and `cloud_tester`

external:
  m4-schema-settled:
    check: "Open PRs #32 (store v4, hot columns) and #33 (migration V5) are merged or closed, and no open PR edits crates/store/src/schema.rs MIGRATIONS"
  m4-swarm-fields:
    check: "PR #32 merged (seeders/leechers/trackers hot columns and swarm tables on main)"
  m4-done:
    check: "docs/architecture.md §14 or §16 records M4 as complete, or the M4 session (title 'M4 continuation') reports it done; and no filters API exists on main that B15 would duplicate"
  history-swap:  # owner-decisions §2.25; build-plan §0
    check: "origin/main equals the rewritten lineage (git merge-base --is-ancestor 058d99373e2c64330f88a010b90165667826aeb9 origin/main) and the main ruleset is restored"
  release-branch-cut:  # decisions/2026-10-30-master-plan.md v0.5.1 release: one-way migrations (V13+) waited for the v0.5.1 release branch (satisfied: c3f6341a)
    check: "A release/v0.5.1 branch exists at the cutoff SHA recorded in runner-state"
  migration-slot:  # plan 2026-11-01-v06-sources §1, §3, Q12: one migration PR at a time; SRC-1 takes the next free number
    check: "No open PR edits crates/store/src/schema.rs MIGRATIONS, and the slice's migration number is assigned (SRC-1: V14, by decisions/2026-11-02-master-plan-r2.md; later slices: in runner-state migration_order or a merged decisions file)"
