slices:
  # ── P0: seams ────────────────────────────────────────────────────────────
  - id: B0
    title: Split the API router and add the error envelope
    kind: core
    model: opus
    deps: []
    owns: ["crates/api/**", "crates/lodestar/src/main.rs", "crates/lodestar/src/http.rs", "crates/lodestar/src/services.rs"]
    spec: ["§9", "§12", "build-plan §3 P0"]
  - id: B5b
    title: Background index rebuild into a new directory with atomic swap
    kind: core
    model: opus
    deps: []
    owns: ["crates/search/src/rebuild.rs", "crates/search/src/index.rs", "crates/search/src/live.rs", "crates/search/src/lib.rs", "crates/search/tests/**"]
    notes: "search crate only; expose an API, wiring into the binary happens in B5a"
    spec: ["§8 Index evolution", "§16 M2/M3 index decisions"]
  - id: C0
    title: Contract docs (design tokens, metrics, glossary, formatter spec, M4 field contract)
    kind: docs
    model: opus
    deps: []
    owns: ["docs/design-tokens.md", "docs/metrics.md", "docs/ui-glossary.md"]
    spec: ["§10.2", "§10.12", "§10.14", "§10.18"]
  - id: C1
    title: Palette table for the 23 non-Riverstone theme families
    kind: docs
    model: opus
    deps: []
    owns: ["docs/themes.md"]
    spec: ["§10.18"]
  - id: W0
    title: Web scaffold (SvelteKit 2, Tailwind 4 + daisyUI 5, pinned deps, lint bans, web CI)
    kind: helper
    model: sonnet
    deps: []
    owns: ["web/**", ".github/workflows/web.yml"]
    spec: ["§10.0", "§10.1", "§10.3", "§13"]
  - id: B1
    title: Typed DTOs, utoipa and /openapi.json with a drift check
    kind: core
    model: opus
    deps: [B0]
    owns: ["crates/api/**", "crates/lodestar/src/bin/openapi.rs", "web/src/lib/api/openapi.json", ".github/workflows/ci.yml"]
    spec: ["§9", "build-plan §1.3"]
  - id: B2
    title: Runtime settings registry and /settings
    kind: core
    model: opus
    deps: [B0]
    owns: ["crates/lodestar/src/settings/**", "crates/lodestar/src/config.rs", "crates/api/src/settings.rs"]
    spec: ["§10.10", "§11"]
  - id: B3
    title: Embedded SPA serving, CSP, status page to /status
    kind: core
    model: opus
    deps: [B0, W0]
    owns: ["crates/lodestar/src/web.rs", "crates/lodestar/src/http.rs", "crates/lodestar/build.rs", "crates/lodestar/Cargo.toml"]
    spec: ["§10.1", "§12"]
  - id: W1
    title: Theme compiler with contrast and ΔE gates
    kind: helper
    model: sonnet
    deps: [W0, C0]
    owns: ["web/scripts/themes.ts", "web/scripts/themes.test.ts", "web/themes/riverstone.json"]
    spec: ["§10.18"]
  - id: W1b
    title: Generate the other 23 theme families (46 themes) from docs/themes.md
    kind: helper
    model: haiku
    deps: [W1, C1]
    owns: ["web/themes/*.json", "web/static/themes.json", "web/scripts/theme-files.test.ts", "web/scripts/themes.test.ts"]
    spec: ["§10.18"]
  - id: W3
    title: Brand asset pipeline
    kind: helper
    model: sonnet
    deps: [W0]
    owns: ["web/scripts/assets.ts", "web/scripts/assets.test.ts", "web/static/brand/**"]
    spec: ["§10.19"]
  - id: W4
    title: Per-feature Paraglide messages and merge script
    kind: helper
    model: sonnet
    deps: [W0]
    owns: ["web/scripts/messages.ts", "web/project.inlang/**", "web/src/lib/i18n/**"]
    spec: ["§10.1", "§10.14"]
  - id: W6
    title: Test harness (vitest, Playwright projects, axe, OpenAPI mock, Lighthouse CI)
    kind: helper
    model: sonnet
    deps: [W0, B1]
    owns: ["web/e2e/**", "web/playwright.config.ts", "web/lighthouserc*.json", ".github/workflows/e2e.yml", ".github/workflows/web.yml", "web/.size-limit.mjs"]
    spec: ["§10.17", "§17"]
  - id: W2
    title: Tokens, daisyUI mapping and font subsets
    kind: helper
    model: sonnet
    deps: [W1]
    owns: ["web/src/app.css", "web/src/lib/theme/**", "web/static/fonts/**"]
    spec: ["§10.2", "§10.18"]
  - id: W8
    title: One formatter per metric
    kind: helper
    model: sonnet
    deps: [W0, C0]
    owns: ["web/src/lib/format/**"]
    review: line-by-line
    spec: ["§10.12", "docs/metrics.md"]

