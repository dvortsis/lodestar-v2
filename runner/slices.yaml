  - id: G-v05
    title: v0.5 exit gate
    kind: gate
    model: opus
    deps: [S-search-3, S-detail, D-docker, B16, M-auth]
    checks: ["keyboard-only Playwright search → drawer → copy magnet on the fixture backend", "axe clean", "size-limit first load ≤ 100 KB, JS ≤ 45 KB", "docker compose smoke: /healthz and a fixture search"]
    notes: "Runner prepares release notes and notifies the owner; tagging v0.5.0 waits for the owner's word."

