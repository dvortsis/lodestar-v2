# Slice graph for the build runner (runner/README.md). Ids match docs/build-plan.md.
# model: opus | sonnet | haiku.   kind: core (Opus code) | helper | docs | gate | epic.
# deps: slice ids that must be merged first; "ext:<name>" entries are checked
# against the `external` section. owns: paths the slice may edit (globs);
# two running slices never own overlapping paths.

limits:
  max_core: 16             # Opus code slices at once (disjoint owned paths only; owner raised to 16, 2026-10-22)
  max_helpers: 16          # Sonnet/Haiku slices at once (owner, 2026-10-22)
  max_launches_per_day: 60 # backstop against runaway loops, not a budget (owner raised from 40, 2026-10-23)
  review_rounds_before_escalation: 2

external:
  m4-schema-settled:
    check: "Open PRs #32 (store v4, hot columns) and #33 (migration V5) are merged or closed, and no open PR edits crates/store/src/schema.rs MIGRATIONS"
  m4-swarm-fields:
    check: "PR #32 merged (seeders/leechers/trackers hot columns and swarm tables on main)"
  m4-done:
    check: "docs/architecture.md §14 or §16 records M4 as complete, or the M4 session (title 'M4 continuation') reports it done; and no filters API exists on main that B15 would duplicate"
  history-swap:  # owner-decisions §2.25; build-plan §0
    check: "origin/main equals the rewritten lineage (git merge-base --is-ancestor 058d99373e2c64330f88a010b90165667826aeb9 origin/main) and the main ruleset is restored"
  release-branch-cut:  # decisions/2026-10-30-master-plan.md v0.5.1 release: one-way migrations (V13+) waited for the v0.5.1 release branch (satisfied: c3f6341a)
    check: "A release/v0.5.1 branch exists at the cutoff SHA recorded in runner-state"
  migration-slot:  # plan 2026-11-01-v06-sources §1, §3, Q12: one migration PR at a time; SRC-1 takes the next free number
    check: "No open PR edits crates/store/src/schema.rs MIGRATIONS, and the slice's migration number is assigned (SRC-1: V14, by decisions/2026-11-02-master-plan-r2.md; later slices: in runner-state migration_order or a merged decisions file)"
  owner-q1:  # plan 2026-11-01-v06-sources §5 Q1; answered by owner-decisions §2.28 (2026-11-02)
    check: "Holds: per owner-decisions §2.28 the runner's consent texts (drafted in SRC-4's decisions file) stand unless the owner vetoes them; satisfied once SRC-4 has merged them"
  owner-q2:  # plan §5 Q2; answered by owner-decisions §2.28 (2026-11-02): holds
    check: "The owner has answered the ToS/robots position for v0.6 sources (recorded in docs/owner-decisions.md or a decisions file)"
  owner-q3:  # plan §5 Q3; answered by owner-decisions §2.28 (2026-11-02): holds
    check: "The owner has answered which torrent caches SRC-13 may contact (recorded in docs/owner-decisions.md or a decisions file)"
  owner-q15:  # plan §5 Q15; answered by owner-decisions §2.28 (2026-11-02): holds
    check: "The owner has answered how private_source items get metadata (recorded in docs/owner-decisions.md or a decisions file)"
  owner-q7:  # plan §5 Q7 (moved to the owner by the runner, 2026-11-01); answered by owner-decisions §2.28 (2026-11-02): holds
    check: "The owner has answered whether a Sukebei (adult) feed ships in v0.6 (recorded in docs/owner-decisions.md or a decisions file)"
  m7-schema-bump:  # superseded 2026-11-02 by slice SB-6 (decisions/2026-11-02-master-plan-r2.md); no slice depends on it
    check: "The runner has scheduled the M7 search SCHEMA_VERSION bump and names SRC-3 as part of it"
  owner-signing-cert:  # deferred by the owner (owner-decisions §2.23); no slice may depend on it
    check: "The owner has provided a code-signing certificate as a repository secret"
  # ── Added by the 2026-11-02 master-plan update (build-plan §0; decisions/2026-11-02-master-plan-r2.md) ──
  v051-soak-verdict:  # build-plan §0.4: the held epics wait for it
    check: "The v0.5.1 Unraid 24 h soak has a recorded verdict (pass, or fail with a fix plan) in runner-state, a merged decisions file or a soak report under docs/soak/"
  v051-tagged:  # build-plan §0.2 Track R
    check: "The owner has tagged v0.5.1 and the GitHub release is published"
  experiment-host:  # build-plan §0.5: one node, one public IP, no imports, not the soak PC
    check: "The owner has named the crawler experiment host and booked it for the run (recorded in runner-state, a decisions file or the owner's message on the PR)"
  owner-checkpoint-1:  # build-plan §0.5 Checkpoint 1 (owner, 2026-11-02)
    check: "CR-CP1's projection reaches the v0.6 gate, or the owner has re-decided after the runner's Checkpoint 1 report (recorded in a decisions file)"
  import-host:  # build-plan §0.6: never the experiment host during an A/B run
    check: "The owner has named the import host, restored the Bitmagnet dump per docs/operations/imports, and booked the host for the pilot"
  owner-50m-approval:  # owner-decisions §2.25: the 50M numbers go to the owner
    check: "The owner has approved G-import-50M's measured numbers (recorded in a decisions file)"
  owner-upload-exception:  # for E-M7's upload slice when it's expanded; decisions/2026-10-30-master-plan.md Imports: uploads need an exception to the JSON-only middleware
    check: "The owner has decided whether .torrent uploads may bypass the JSON-only middleware, and on what terms"
  owner-import-server-surface:  # for B-import-server-2 when it's resumed: an API that takes a source path or credentials
    check: "The owner has approved the new attack surface of importing through the running server"
  owner-migrations-on-main:  # owner 2026-11-01 21:08Z hold; lifted by owner-decisions §2.28 (2026-11-02): holds
    check: "v0.5.1 is tagged and published, or the owner has explicitly allowed a migration to merge to main before then (recorded in docs/owner-decisions.md or a decisions file)"
  release-after-parser:  # decisions/2026-11-01-FX-6-I9.md stage 2
    check: "A release that reads the a..<b form has shipped, and the next release is being prepared"

slices:
  # ── P0: seams ────────────────────────────────────────────────────────────
  - id: B0
    title: Split the API router and add the error envelope
    kind: core
    model: opus
    deps: []
    owns: ["crates/api/**", "crates/lodestar/src/main.rs", "crates/lodestar/src/http.rs", "crates/lodestar/src/services.rs"]
    spec: ["§9", "§12", "build-plan §3 P0"]
  - id: B5b
    title: Background index rebuild into a new directory with atomic swap
    kind: core
    model: opus
    deps: []
    owns: ["crates/search/src/rebuild.rs", "crates/search/src/index.rs", "crates/search/src/live.rs", "crates/search/src/lib.rs", "crates/search/tests/**"]
    notes: "search crate only; expose an API, wiring into the binary happens in B5a"
    spec: ["§8 Index evolution", "§16 M2/M3 index decisions"]
  - id: C0
    title: Contract docs (design tokens, metrics, glossary, formatter spec, M4 field contract)
    kind: docs
    model: opus
    deps: []
    owns: ["docs/design-tokens.md", "docs/metrics.md", "docs/ui-glossary.md"]
    spec: ["§10.2", "§10.12", "§10.14", "§10.18"]
  - id: C1
    title: Palette table for the 23 non-Riverstone theme families
    kind: docs
    model: opus
    deps: []
    owns: ["docs/themes.md"]
    spec: ["§10.18"]
  - id: W0
    title: Web scaffold (SvelteKit 2, Tailwind 4 + daisyUI 5, pinned deps, lint bans, web CI)
    kind: helper
    model: sonnet
    deps: []
    owns: ["web/**", ".github/workflows/web.yml"]
    spec: ["§10.0", "§10.1", "§10.3", "§13"]
  - id: B1
    title: Typed DTOs, utoipa and /openapi.json with a drift check
    kind: core
    model: opus
    deps: [B0]
    owns: ["crates/api/**", "crates/lodestar/src/bin/openapi.rs", "web/src/lib/api/openapi.json", ".github/workflows/ci.yml"]
    spec: ["§9", "build-plan §1.3"]
  - id: B2
    title: Runtime settings registry and /settings
    kind: core
    model: opus
    deps: [B0]
    owns: ["crates/lodestar/src/settings/**", "crates/lodestar/src/config.rs", "crates/api/src/settings.rs"]
    spec: ["§10.10", "§11"]
  - id: B3
    title: Embedded SPA serving, CSP, status page to /status
    kind: core
    model: opus
    deps: [B0, W0]
    owns: ["crates/lodestar/src/web.rs", "crates/lodestar/src/http.rs", "crates/lodestar/build.rs", "crates/lodestar/Cargo.toml"]
    spec: ["§10.1", "§12"]
  - id: W1
    title: Theme compiler with contrast and ΔE gates
    kind: helper
    model: sonnet
    deps: [W0, C0]
    owns: ["web/scripts/themes.ts", "web/scripts/themes.test.ts", "web/themes/riverstone.json"]
    spec: ["§10.18"]
  - id: W1b
    title: Generate the other 23 theme families (46 themes) from docs/themes.md
    kind: helper
    model: haiku
    deps: [W1, C1]
    owns: ["web/themes/*.json", "web/static/themes.json", "web/scripts/theme-files.test.ts", "web/scripts/themes.test.ts"]
    spec: ["§10.18"]
  - id: W3
    title: Brand asset pipeline
    kind: helper
    model: sonnet
    deps: [W0]
    owns: ["web/scripts/assets.ts", "web/scripts/assets.test.ts", "web/static/brand/**"]
    spec: ["§10.19"]
  - id: W4
    title: Per-feature Paraglide messages and merge script
    kind: helper
    model: sonnet
    deps: [W0]
    owns: ["web/scripts/messages.ts", "web/project.inlang/**", "web/src/lib/i18n/**"]
    spec: ["§10.1", "§10.14"]
  - id: W6
    title: Test harness (vitest, Playwright projects, axe, OpenAPI mock, Lighthouse CI)
    kind: helper
    model: sonnet
    deps: [W0, B1]
    owns: ["web/e2e/**", "web/playwright.config.ts", "web/lighthouserc*.json", ".github/workflows/e2e.yml", ".github/workflows/web.yml", "web/.size-limit.mjs"]
    spec: ["§10.17", "§17"]
  - id: W2
