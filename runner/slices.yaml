  - {id: B-update, title: "Update engine: signed manifest (channel signed, highest timestamp kept, weekly re-sign) and key chain (recovery-signed key changes with sequence numbers, revoking the old key), policy (levels, channels, security fixes, wait, window), the single signed update check, download and verify, overlay supervisor (active pointer, pending probation, 3 attempts, rollback, no expiry check at start), self-test, history, updates API and SSE topic", kind: core, model: opus, deps: [B2c, B4], owns: ["crates/update/**", "fuzz/fuzz_targets/update.rs", "crates/lodestar/src/update/**", "crates/api/src/updates.rs", "crates/lodestar/src/main.rs"], spec: ["§12.2", "docs/owner-decisions.md §2.13", "docs/owner-decisions.md §2.23"], notes: "security-sensitive (supply chain): /security-review required. No Authenticode certificate yet (§2.23): check Authenticode only on artifacts that carry a signature; the signed manifest's SHA-256 and size pins are the trust anchor. The Windows MSI helper (with the previous MSI cached and WiX downgrades allowed) and the signed manifest in release.yml land with E-M6. Public keys are in packaging/keys/ (release 02910813433E81E0, recovery 67922DDF005FD310; nightly and freshness keys per owner-decisions §2.21); embed all four, trust the nightly key only on Nightly, and accept freshness statements only for manifests already signed by the release or nightly key. A key change names its role (release, nightly or freshness), needs the recovery signature, revokes the old key of that role only and carries a monotonic sequence number (one sequence for all roles). Trust state (statements, sequence number, revoked keys, a per-channel high-water mark on the manifest's own timestamp, and a freshness mark) lives in <data>/bin/trust.json, outside the store and every snapshot. Each overlay keeps its full signed manifest and key chain. Manifests more than 1 day ahead are refused, and expiry is capped at 30 days. Rollback is journaled (rollback.json, idempotent steps, restore before repoint, WAL removed first) and bounded to one level. History lives in <data>/bin/history.json. Owns main.rs because serve becomes the supervisor. Adds the updates topic to the /events hub (7 of 8 bits). Each build embeds the key statements it knew of; the trust floor is the newest of embedded, trust.json and verified-overlay statements, and the supervisor refuses overlays signed by keys its embedded statements revoke. While rollback.json exists, no process opens the store. The store is restored by renaming a same-directory snapshot. Resolve the 'B-update must resolve' checklist at the end of §12.2."}
