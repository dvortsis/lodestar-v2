    title: Setup-token and login state machines
    kind: core
    model: opus
    deps: [W5]
    owns: ["web/src/lib/features/auth/**", "web/src/routes/setup/**", "web/src/routes/login/**"]
    spec: ["§12", "§10.10"]
  - id: S-search-1
    title: Search — query bar, highlighter, active-filter strip, chips
    kind: helper
    model: sonnet
    deps: [W9, B5a]
    owns: ["web/src/lib/features/search/query/**", "web/src/routes/search/**"]
    spec: ["§10.4", "§10.13"]
  - id: S-search-2
    title: Search — facet rail and results list with all states
    kind: helper
    model: sonnet
    deps: [S-search-1, B6]
    owns: ["web/src/lib/features/search/facets/**", "web/src/lib/features/search/results/**"]
    spec: ["§10.4", "§10.12", "§10.15"]
  - id: S-search-3
    title: Search — toolbar and cursor infinite scroll
    kind: helper
    model: sonnet
