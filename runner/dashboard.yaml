# Roadmap dashboard data: the plan's structure and the facts GitHub can't show.
#
# The roadmap dashboard (tools/status-connector) reads this file live from main, together with
# runner/slices.yaml and GitHub itself. Progress needs no editing: a branch slice/<id>, a PR
# titled "<id>: ...", and its merge are read directly.
#
# Update this file IN THE SAME PR as any change that moves one of these:
#   - a slice or epic is added, removed, renamed or re-grouped        -> placement, pinned, expanded
#   - an owner decision is made, or a new one is needed               -> conditions, owner_queue
#   - a phase, track or roadmap dependency changes (build-plan 0)     -> phases, workstreams, roadmap
#   - a gate is defined, measured or passed                           -> gates, crawler, soak
#   - the top-of-page notes are out of date                           -> notes
#   Worker slots are NOT here: the runner keeps `slots` in runner-state's state.json (no PR); see CLAUDE.md.
# `cd tools/status-connector && npm test` checks that this file and runner/slices.yaml agree.
# See docs/handoff.md and CLAUDE.md ("Keeping the dashboard current").
#
# placement: first match wins. A pattern is an exact slice id, a prefix ending in *, or /regex/.
# pinned: a slice forced into one workstream whatever the rules say.
# conditions: the `ext:` names used in runner/slices.yaml. who: you | runner | soak | time | done.
#   met: true once it holds. auto: branch:<name> or tag:<name> is read from GitHub and overrides met.
# gates: give `slice:` to take the status from that slice (done -> passed); otherwise set `status:`.
phases:
- id: ph-found
  name: Foundations to a usable app
  badge: Shipped
  plain: 'The base of Lodestar: the engine, the screens for searching and reading torrents, settings, the first-run
    wizard, filters and the safety rules. Finished through milestone 5.'
  tag: P0-P2 / M0-M5
- id: ph-v051
  name: Release v0.5.1
  badge: Shipped
  plain: The release you can install now, published on 2026-11-07 from 12cd25ca. It passed the 24-hour memory test,
    the VPN leg and the Windows check. Its release notes still come to main (D-v051-main).
  tag: v0.5.1
- id: ph-crawler
  name: Discover faster
  badge: In progress
  plain: The crawler finds about 12 torrents a minute. The v0.6 gate is 100 a minute. This work builds each idea
    behind an off switch, then measures it live on a dedicated host.
  tag: v0.6 gate
- id: ph-sources
  name: More places to find torrents
  badge: In progress
  plain: Plug-ins that bring in torrents from feeds and indexes (Torznab, RSS, Internet Archive and others), with
    consent, a kill switch and the safety filters applied first.
  tag: v0.6
- id: ph-imports
  name: Bring in existing libraries
  badge: Waiting
  plain: Import big collections from Magnetico and Bitmagnet, then prove Lodestar holds 1 million, 10 million and
    50 million torrents within its speed and size budgets.
  tag: Import gates
- id: ph-platform
  name: Run it anywhere
  badge: Held
  plain: Remote workers on other machines, the companion manager, and the finished packaging for Docker, Unraid
    and Windows. On hold until the memory test gives its verdict.
  tag: v0.6 / M6
- id: ph-m7
  name: Search and integrations
  badge: Next
  plain: Torznab server, torrent upload, grouping of duplicates, regex search, enrichment plug-ins. Download clients
    and notifiers were built early and are done.
  tag: v0.7 / M7
- id: ph-v10
  name: Hardening to 1.0
  badge: Later
  plain: Version 0.8 (plug-ins on workers), then the big relevance, performance, security and chaos checks that
    must pass before 1.0.
  tag: v0.8 / M8 / 1.0
- id: ph-polish
  name: Backlog, fixes and polish
  badge: Ongoing
  plain: Small fixes, review follow-ups and polish rounds that fill spare capacity. The runner launches these as
    they come up.
  tag: Ongoing
workstreams:
  ws-api:
    phase: ph-found
    name: Engine and API
    plain: Search engine, indexes, the API behind every screen.
  ws-web:
    phase: ph-found
    name: Web foundations
    plain: Design system, themes, shared components and test setup.
  ws-search-ui:
    phase: ph-found
    name: Search and detail screens
    plain: Search, results, facets, a torrent's detail page, Compare and Discover.
  ws-insights:
    phase: ph-found
    name: Alerts and Insights
    plain: Saved-search alerts and the Insights reports.
  ws-settings:
    phase: ph-found
    name: Settings, updates and first run
    plain: Settings screens, sign-in, logging, the updater and the first-run wizard.
  ws-filters:
    phase: ph-found
    name: Filters and safety
    plain: Blocking rules, adult-content handling and blocklist subscriptions.
  ws-ship:
    phase: ph-found
    name: Packaging and checks
    plain: Docker image, end-to-end tests, docs screenshots, translations.
  ws-gates-found:
    phase: ph-found
    name: Gates
    plain: Exit checks for milestone 5 and the v0.5 MVP.
  ws-land:
    phase: ph-v051
    name: Landing the owner's earlier work
    plain: Bringing the owner's own branches into the main line.
  ws-fix:
    phase: ph-v051
    name: Release blockers fixed
    plain: Sign-in, filter, parser and updater fixes needed before v0.5.1.
  ws-cut:
    phase: ph-v051
    name: Soak, notes and tag
    plain: The soak tools, release notes and the final gate.
  ws-cr-build:
    phase: ph-crawler
    name: Build each experiment (off by default)
    plain: Each idea is code behind a switch that is off until a live test shows it wins.
  ws-cr-live:
    phase: ph-crawler
    name: Measure live on the experiment host
    plain: 'Runs on a machine you name: the comparator, then paired on/off runs, then a checkpoint.'
  ws-cr-tune:
    phase: ph-crawler
    name: Tune, combine, accept
    plain: Profile-driven tuning, then combine the winners and run the 24-hour acceptance.
  ws-src-core:
    phase: ph-sources
    name: Foundations
    plain: The plug-in contract, storage for unverified items, consent and network controls.
  ws-src-parse:
    phase: ph-sources
    name: Feed readers
    plain: Safe parsers for Torznab, RSS/Atom and Internet Archive answers.
  ws-src-plug:
    phase: ph-sources
    name: Plug-ins and clients
    plain: Prowlarr/Jackett, Nyaa, AnimeTosho, Internet Archive, download clients, scrape and caches.
  ws-src-ui:
    phase: ph-sources
    name: Screens and gate
    plain: Sources in Settings, provenance in the detail view, and the sources gate.
  ws-src-plan:
    phase: ph-sources
    name: Rule packs and enrichment
    plain: Curated filter rule packs and the ThePornDB/StashDB lookups, planned in P-v06-rulepacks.
  ws-imp-tools:
    phase: ph-imports
    name: Import tools
    plain: Restore runbook, job tables, adapters, merge and dedupe.
  ws-imp-scale:
    phase: ph-imports
    name: Scale ladder
    plain: Smoke stages, then 1M, 10M and 50M torrents, then the full library.
  ws-workers:
    phase: ph-platform
    name: Remote workers
    plain: Run crawling and fetching on other machines. Sliced into WK-0 to WK-G (P-v06-workers); building starts after the memory test's verdict.
  ws-companions:
    phase: ph-platform
    name: Companion manager
    plain: Manage helper apps (VPN, clients) from inside Lodestar. Sliced into CMP-0 to CMP-G (P-v06-companions); building starts after the memory test's verdict.
  ws-m6:
    phase: ph-platform
    name: Packaging
    plain: Docker, Unraid, Windows installer and updates, and the user guide. The gap audit sliced it into PK-* and the M6 exit gate.
  ws-m7-built:
    phase: ph-m7
    name: Already built
    plain: Download clients, notifiers, email and the uTP library.
  ws-m7-todo:
    phase: ph-m7
    name: Plan and schema change
    plain: The v0.7 epic, its plan, and the one search-schema change it needs.
  ws-m7-w1:
    phase: ph-m7
    name: 'Wave 1: first slices'
    plain: Claims format v3 (heads the enrichment path), the index size gate, the regex parser; after the v0.5.2 cut, Torznab, upload and payload signatures.
  ws-m7-w2:
    phase: ph-m7
    name: 'Wave 2: harness and outputs'
    plain: The enrichment harness (needs your answer to Q5), identical-payload siblings, bitmagnet export, folder watch, usenet storage and the IRC client.
  ws-m7-w3:
    phase: ph-m7
    name: 'Wave 3: grouping and plug-in pattern'
    plain: Grouping, the Wikidata plug-in that sets the pattern, Prowlarr usenet results, usenet clients, IRC announces and the Outputs screen.
  ws-m7-w4:
    phase: ph-m7
    name: 'Wave 4: regex, collapse, plug-ins'
    plain: Regex search, collapse by group, the detail API and the enrichment plug-ins, two at a time.
  ws-m7-w5:
    phase: ph-m7
    name: 'Wave 5: search enrichment and screens'
    plain: Alternative titles and IDs in search, the Related and Identified-as sections, and the collapse toggle.
  ws-m7-w6:
    phase: ph-m7
    name: 'Wave 6: tails waiting on you'
    plain: Searchable usenet and unverified items (one migration), the Stremio addon and IRC plug-ins, each after your answer.
  ws-m7-gates:
    phase: ph-m7
    name: v0.7 gates
    plain: The 10M scale run on your import host, then the v0.7 gate.
  ws-v10:
    phase: ph-v10
    name: Plans and epics
    plain: The v0.8 and 1.0 epics and the plans that sliced them.
  ws-v08-workers:
    phase: ph-v10
    name: 'v0.8: plug-ins and companions on workers'
    plain: Source plug-ins and companions running on remote workers, with placement, fleet-wide politeness, consent and credentials per worker.
  ws-v08-feeds:
    phase: ph-v10
    name: 'v0.8: Nostr and Lemmy'
    plain: Nostr and Lemmy as sources, and how third-party adult tags are treated. The parsers may land early, switched off.
  ws-v08-gate:
    phase: ph-v10
    name: 'v0.8: guide and gate'
    plain: The user-guide chapters and the v0.8 gate.
  ws-m8-tooling:
    phase: ph-v10
    name: Benchmarks, relevance and CI
    plain: The 10M benchmark, real-name relevance sets, the in-process network test and the weekly gate run.
  ws-m8-chaos:
    phase: ph-v10
    name: Workers under failure
    plain: Kills, partitions and restarts against a coordinator and its workers.
  ws-m8-review:
    phase: ph-v10
    name: Security, audits, design
    plain: Eight security reviews, the politeness and purge audits, and the 1.0 design review.
  ws-m8-docs:
    phase: ph-v10
    name: 1.0 docs
    plain: The user guide, query language, relevance and themes at 1.0, then the README and release notes.
  ws-m8-release:
    phase: ph-v10
    name: Release candidate and gates
    plain: Cut release/v1.0, you tag the release candidate, every 1.0 gate runs on it, then you tag v1.0.0.
  ws-small:
    phase: ph-polish
    name: Planned follow-ups
    plain: Small known items waiting for a free slot.
  ws-rounds:
    phase: ph-polish
    name: Fix and polish rounds (merged)
    plain: Review follow-ups and polish the runner launched outside the main graph.
