notes:
  updated: '2026-11-02'
  now:
  - label: The release is waiting on one test
    text: Release candidate 2 of v0.5.1 is built and signed. The 24-hour memory test on your Unraid box (attempt
      3) ends at 22:16 UTC on Nov 2. If memory growth stays under 2 MiB an hour over hours 12 to 24, the test passes.
      Release candidate 3 will be rc.2 plus the filter fail-closed fix (#357), ported as #377 against the release branch and merged after the verdict.
  - label: The crawler is the longest road
    text: It finds about 12 torrents a minute and the v0.6 tag needs 100. Every idea is built behind an off switch.
      The live tests wait for an experiment host you name.
  - label: Sources are being laid down
    text: The plug-in contract, the feed readers for Torznab and RSS, and the Jobs view are merged. Consent, network
      controls and the Internet Archive reader are next. Your answers on terms of service, private sources, caches and
      the Sukebei feed are recorded, so the main plug-in can start once its foundations land.
  - label: Four slots, kept busy
    text: By your instruction the runner launches the next ready piece of work whenever a slot frees. Workers, companions
      and packaging stay held until the memory test gives its verdict.
  you:
  - label: After 22:16 UTC on Nov 2
    text: Approve the 2-hour VPN (gluetun) leg, hand back the soak evidence, then tag v0.5.1.
  - label: Confirm the crawler measurement specification
    text: CR-SPEC freezes how every crawler run is measured. It needs your confirmation, including its open question O1, before the first acceptance analysis.
  - label: Say whether #367 joins rc.3
    text: The filter stand-in re-judge was merged after the release cut. Yes or no decides what rc.3 contains.
  - label: Name the experiment host
    text: Every live crawler test and the v0.6 tag need a machine that is not the soak PC.
  - label: Optional
    text: Signing key for nightly updates, required checks on main, and the Unraid Backups share minimum free space.
