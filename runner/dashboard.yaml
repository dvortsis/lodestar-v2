owner_queue:
- n: 1
  type: action
  action: Book each crawler run on the experiment host (the Unraid box, §2.51). The comparator is booked from 2026-11-07T13:00Z
  unblocks: All live crawler measurement and the v0.6 tag
  when: Before CR-4 lands
- n: 2
  type: action
  action: Add web-ok and e2e-ok to the main ruleset's required checks, next to ci-ok (you said yes, §2.37)
  unblocks: Safer merges
  when: Any time
- n: 3
  type: action
  action: Create the nightly signing key and its environment (skipped for v0.5.1)
  unblocks: Update checks on the Nightly channel
  when: Optional
- n: 4
  type: decision
  action: 'Checkpoint 1: re-decide the crawler gate if the projection falls short'
  unblocks: The v0.6 tag
  when: After the A/B runs
- n: 5
  type: action
  action: Fix your Backups share minimum free space (500 GB) on the Unraid box
  unblocks: Appdata Backup protection for the soak
  when: Optional
- n: 6
  type: action
  action: Submit to Unraid Community Apps
  unblocks: The Unraid app-store listing
  when: After the 1.0 release is complete (§2.37)
- n: 7
  type: action
  action: Have Colorado counsel review docs/legal/legal-notice.md and docs/legal/operator-guidance.md (advisory, not a gate on the v0.5.1 tag; §2.38)
  unblocks: Counsel's comments on the Legal Notice
  when: When convenient
- n: 8
  type: action
  action: Submit Lodestar to winget, if you want it (M6 Q6)
  unblocks: A winget listing for Windows users
  when: After 1.0, optional
gates:
- id: G-v05
  name: v0.5 MVP exit
  plain: The first usable app works end to end.
  slice: G-v05
  measure: Passed 2026-10-24
  target: ''
  where: docs/build-plan.md
- id: G-m5
  name: Milestone 5 exit
  plain: Every screen built, checked for numbers, speed and design.
  slice: G-m5
  measure: Reporting overhead 0.08-0.09% of a 1% gate; 7 blocking design findings fixed (#352)
  target: ''
  where: '#352'
- id: G-v051
  name: v0.5.1 release
  plain: Memory test passes, VPN leg runs, you tag it.
  slice: G-v051
  measure: 'Passed. Soak r5 on rc.4: 0.91 MiB/h [0.47, 1.35] (docs/decisions/2026-11-06-soak-r5-verdict.md); gluetun leg and Windows MSI check passed; v0.5.1 published 2026-11-07 from 12cd25ca (images :0.5.1, :0.5, :latest = sha256:2ffce5cb...), verdict in docs/decisions/2026-11-07-v051-release-verdict.md'
  target: Memory slope upper 95% bound <= 2.0 MiB/h over hours 12-24
  where: build-plan 0.4
- id: G-v06-crawler
  name: Crawler gate (v0.6 tag)
  plain: The crawler must reach 100 verified torrents a minute.
  slice: G-v06-crawler
  measure: 12.3 per min (CR-0, 24 h); 17.0 per min on Windows rc.2
  target: 24 h mean >= 100/min, no hour < 70, p95 discovery-to-searchable <= 10 min
  where: build-plan 0.6
- id: SRC-G
  name: Sources gate (v0.6)
  plain: The blocklist and safety rules apply through every source plug-in.
  slice: SRC-G
  measure: ''
  target: See docs/plan/2026-11-01-v06-sources.md section 4.2
  where: plan
- id: G-import
  name: Import scale (1M, 10M, 50M)
  plain: Lodestar holds big libraries within its speed and size budgets.
  slice: G-import-50M
  measure: 'Only a synthetic figure: 100k at about 13,900/s'
  target: Import >= 2,000/s offline; about 2.3 KB per torrent all-in; cold file search p95 <= 150 ms at 10M
  where: build-plan 0.6
- id: CMP-G
  name: Companion manager gate (v0.6)
  plain: Lodestar only runs companion programs it has verified, keeps them on your VPN, and keeps their passwords safe.
  slice: CMP-G
  measure: ''
  target: See docs/plan/2026-11-06-v06-companions.md section 4.3
  where: plan
- id: G-chaos
  name: Remote workers chaos gates
  plain: "First pass (v0.6): workers survive crashes, partitions and restarts. The 1.0 re-run is G-v1-chaos."
  slice: WK-G
  measure: ''
  target: architecture 19.8
  where: docs/plan/2026-11-06-v06-workers.md
- id: G-m6
  name: Milestone 6 exit
  plain: Clean install, crawling and search on Docker/Unraid, Linux and Windows, with Windows updates and the guide.
  slice: G-m6
  measure: ''
  target: architecture 14 M6 exit criteria
  where: docs/plan/2026-11-06-m6-gap-audit.md
- id: G-v07
  name: v0.7 gate
  plain: Outputs and enrichment never carry private, held or hidden adult items; uploads go through the safety floor.
  slice: G-v07
  measure: ''
  target: architecture 14 M7 exit criteria and 18.9
  where: docs/plan/2026-11-05-v07-m7.md
- id: G-v08
  name: v0.8 gate
  plain: Plug-ins and companions on workers stay polite, private and consented; Nostr and Lemmy are safe.
  slice: G-v08
  measure: ''
  target: architecture 19.8 and 18.9
  where: docs/plan/2026-11-06-v08.md
- id: G-filter-budget
  name: Filter speed budget
  plain: Judging a torrent against the rules stays fast.
  status: held
  measure: About 55 us in one case on Intel 8573C runners
  target: 50 us (reported, not held)
  where: architecture 20.8
- id: G-v1
  name: 1.0 gates
  plain: Every 1.0 gate below green on the release candidate, the 50M numbers approved, then you tag v1.0.0.
  slice: G-v1
  measure: ''
  target: architecture 17
  where: docs/plan/2026-11-06-m8-hardening.md
- id: G-v1-ci
  name: '1.0: full CI on the RC'
  plain: Every workflow green on the release candidate, with no regenerated baselines.
  slice: G-v1-ci
  measure: ''
  target: architecture 17
  where: docs/plan/2026-11-06-m8-hardening.md
- id: G-v1-relevance
  name: '1.0: relevance'
  plain: Search ranks the right torrents first on the committed sets; the held-out score is reported to you.
  slice: G-v1-relevance
  measure: 'Synthetic set NDCG@10 0.9186'
  target: Regression tolerance 0.001; synthetic set >= 0.90 (plan RQ2)
  where: docs/plan/2026-11-06-m8-hardening.md
- id: G-v1-10m
  name: '1.0: 10M performance and size'
  plain: Every speed, size and memory number in architecture 3 at 10 million torrents, on the dedicated runner.
  slice: G-v1-10m
  measure: ''
  target: architecture 3 p95 table, size and memory; worker budgets (owner 1.6.5)
  where: docs/plan/2026-11-06-m8-hardening.md
- id: G-v1-crawler
  name: '1.0: crawler re-measured'
  plain: The v0.6 crawler gate measured again on the release candidate.
  slice: G-v1-crawler
  measure: ''
  target: 24 h mean >= 100/min, no hour < 70, p95 discovery-to-searchable <= 10 min
  where: build-plan 0.6
- id: G-v1-windows
  name: '1.0: Windows soak'
  plain: 24 hours in MSI service mode on your Windows PC, plus upgrade and uninstall.
  slice: G-v1-windows
  measure: ''
  target: Memory slope upper 95% bound <= 2.0 MiB/h over hours 12-24 (CR-0 rule)
  where: docs/plan/2026-11-06-m8-hardening.md
- id: G-v1-soak-linux
  name: '1.0: Linux Docker soak'
  plain: 24 hours on your Unraid host under the v0.5.1 rules.
  slice: G-v1-soak-linux
  measure: ''
  target: Memory slope upper 95% bound <= 2.0 MiB/h over hours 12-24
  where: docs/plan/2026-11-06-m8-hardening.md
- id: G-v1-chaos
  name: '1.0: chaos gates'
  plain: Every architecture 19.8 failure test, long seeds and the in-process network, on the release candidate.
  slice: G-v1-chaos
  measure: ''
  target: architecture 19.8
  where: docs/plan/2026-11-06-m8-hardening.md
