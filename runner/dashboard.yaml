roadmap:
  steps:
  - id: soak
    label: Unraid memory test (r5 passed on rc.4)
    plain: 'Release candidate 4 passed its 24-hour memory test: 0.91 MiB an hour, upper bound 1.35, against a bar of 2.0. Release candidates 2 and 3 had failed (1.88 and 29.35 MiB an hour).'
    col: 0
    row: 2
    members: []
    override: done
  - id: gluetun
    label: VPN (gluetun) leg, passed
    plain: 'A separate run through the VPN: a 2-hour measured baseline after settling and warm-up. It passed (2026-11-06): full coverage, no restarts, no VPN drops.'
    col: 1
    row: 2
    members: []
    override: done
  - id: tag
    label: v0.5.1 published
    plain: 'You tagged and published v0.5.1 on 2026-11-07 (12cd25ca, signed checksums verified). Its release notes, the README status and the note that v0.5.0 was never released come to main next (D-v051-main, queued for the next free slot).'
    col: 2
    row: 2
    members:
    - D-v051-main
    override: done
  - id: v052
    label: Cut v0.5.2
    plain: A new release branch from main, now that v0.5.1 is out. The consent gate is in (sources that need consent stay off in v0.5.2); the feature manifest is frozen first, and the release notes are trimmed at the cut.
    col: 3
    row: 2
    members:
    - P-v052-cut
    - X-consent-gate-052
  - id: unhold
    label: Soak verdict starts the planned tracks
    plain: Workers, companions, packaging, the early v0.8 parsers and the 1.0 tooling were sliced on 2026-11-06. The memory test passed on 2026-11-06, so their first slices are starting, at most four at a time.
    col: 2
    row: 4
    members: []
  - id: cr4
    label: Build crawler experiments
    plain: Admission, hints, streaming, prefixes and uTP, each behind an off switch.
    col: 0
    row: 0
    members:
