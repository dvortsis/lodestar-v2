owner_queue:
- n: 1
  type: action
  action: Hand back the r3 soak evidence, approve and run the 2-hour gluetun leg, then tag v0.5.1 and approve the
    release environment
  unblocks: v0.5.1 release; the three held epics
  when: After 22:16 UTC Nov 2
- n: 2
  type: decision
  action: Confirm CR-SPEC, the frozen crawler measurement specification, including its open question O1
  unblocks: The first crawler acceptance analysis (CR-COL-3, the live A/B runs)
  when: Before the first A/B run
- n: 3
  type: action
  action: Name the experiment host for crawler tests, and when it is free
  unblocks: All live crawler measurement and the v0.6 tag
  when: Before CR-4 lands
- n: 4
  type: decision
  action: Approve the plain-language consent texts that SRC-4 drafts (Q1)
  unblocks: The consent dialogs and credentials screen (SRC-15b)
  when: After SRC-4 merges, before SRC-15b
- n: 5
  type: decision
  action: Does #367 (the filter stand-in re-judge, merged as 785b282c) join rc.3? Yes or no.
  unblocks: What rc.3 contains, and so whether the r3 soak evidence still covers it
  when: Before rc.3 is built
- n: 6
  type: action
  action: Create the nightly signing key and its environment
  unblocks: Update checks on the Nightly channel
  when: Optional
- n: 7
  type: decision
  action: Make "Web / web" and "E2E / run" required checks (runner recommends yes)
  unblocks: Safer merges
  when: Optional
- n: 8
  type: decision
  action: Approve the new attack surface of importing through the running server; decide the torrent-upload middleware
    exception
  unblocks: Server-side imports; v0.7 upload
  when: Later
- n: 9
  type: action
  action: Submit to Unraid Community Apps
  unblocks: Packaging milestone
  when: Later
- n: 10
  type: decision
  action: 'Checkpoint 1: re-decide the crawler gate if the projection falls short'
  unblocks: The v0.6 tag
  when: After the A/B runs
- n: 11
  type: action
  action: Fix your Backups share minimum free space (500 GB) on the Unraid box
  unblocks: Appdata Backup protection for the soak
  when: Optional
gates:
- id: G-v05
  name: v0.5 MVP exit
  plain: The first usable app works end to end.
  slice: G-v05
  measure: Passed 2026-10-24
  target: ''
  where: docs/build-plan.md
- id: G-m5
  name: Milestone 5 exit
  plain: Every screen built, checked for numbers, speed and design.
  slice: G-m5
  measure: Reporting overhead 0.08-0.09% of a 1% gate; 7 blocking design findings fixed (#352)
  target: ''
  where: '#352'
- id: G-v051
  name: v0.5.1 release
  plain: Memory test passes, VPN leg runs, you tag it.
  slice: G-v051
  measure: Soak r3 running; baseline ends 2026-11-02 22:16 UTC
  target: Memory slope upper 95% bound <= 2.0 MiB/h over hours 12-24
  where: build-plan 0.4
- id: G-v06-crawler
  name: Crawler gate (v0.6 tag)
