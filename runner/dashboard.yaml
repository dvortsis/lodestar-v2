roadmap:
  steps:
  - id: soak
    label: Unraid memory test (r3)
    plain: The 24-hour test of release candidate 2 is running. It ends 22:16 UTC on Nov 2.
    col: 0
    row: 2
    members: []
    override: active
  - id: gluetun
    label: VPN (gluetun) leg, 2 h
    plain: You approve and run a 2-hour test through the VPN.
    col: 1
    row: 2
    members: []
    override: you
  - id: tag
    label: Tag v0.5.1
    plain: You tag the release and publish it.
    col: 2
    row: 2
    members:
    - D-v051-main
    override: you
  - id: v052
    label: Cut v0.5.2
    plain: A new release branch from main, soon after v0.5.1.
    col: 3
    row: 2
    members:
    - P-v052-cut
  - id: unhold
    label: Unhold workers, companions, packaging
    plain: The three held epics get broken into slices once the soak verdict is in.
    col: 2
    row: 4
    members:
    - E-M6
    - E-v06-workers
    - E-v06-companions
  - id: cr4
    label: Build crawler experiments
    plain: Admission, hints, streaming, prefixes and uTP, each behind an off switch.
    col: 0
    row: 0
    members:
    - CR-SIM
    - CR-gate-metrics
    - CR-ADM
    - CR-1a-H
    - CR-1a-S
    - CR-1b
    - CR-4
  - id: crab
    label: Live A/B on the experiment host
    plain: Paired on/off runs plus a bitmagnet comparator. Needs your host.
    col: 1
    row: 0
    members:
    - CR-AB-COMP
    - CR-AB-ADM
    - CR-AB-4
  - id: cp1
    label: Checkpoint 1
    plain: Does the measured gain project to 100 torrents a minute? If not, you re-decide.
    col: 2
    row: 0
    members:
    - CR-CP1
  - id: crtune
    label: Tune and combine
    plain: Remaining experiments, tuning, then the 24-hour acceptance run.
    col: 3
    row: 0
    members:
    - CR-1c
    - CR-AB-1
    - CR-5
    - CR-COMB
  - id: g06c
    label: Crawler gate (100/min)
    plain: 24 h mean at least 100 a minute, no hour under 70.
    col: 4
    row: 0
    members:
    - G-v06-crawler
  - id: src-core
    label: 'Sources: foundations'
    plain: Plug-in contract, unverified-item storage, consent, network controls.
    col: 0
    row: 6
    members:
    - SRC-0
    - SRC-1
    - SRC-2
    - SRC-4
    - SRC-5
  - id: src7
    label: 'Sources: Prowlarr/Jackett'
    plain: The critical plug-in. Needs your answers to Q2 and Q15.
    col: 1
    row: 6
    members:
    - SRC-7
  - id: src-plug
    label: 'Sources: the plug-ins'
    plain: Nyaa, AnimeTosho, Internet Archive, clients, scrape, caches.
    col: 2
    row: 6
    members:
    - SRC-10a
    - SRC-10b
    - SRC-10c
    - SRC-10d
    - SRC-10e
    - SRC-11
    - SRC-11b
    - SRC-12
    - SRC-13
  - id: src-ui
    label: 'Sources: screens'
    plain: Settings → Sources, provenance in detail, jobs.
    col: 3
    row: 6
    members:
    - SRC-14
    - SRC-15a
    - SRC-15b
    - SRC-16
    - SRC-17
  - id: srcg
    label: Sources gate
    plain: The blocklist applies through every plug-in.
    col: 4
    row: 6
    members:
    - SRC-G
  - id: imp
    label: Import tools
    plain: Magnetico and Bitmagnet adapters, merge and dedupe.
    col: 0
    row: 8
    members:
    - IMP-0
    - IMP-1
    - IMP-2
    - IMP-3
    - IMP-4
    - IMP-5
  - id: i1m
