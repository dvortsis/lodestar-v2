conditions:
  owner-cr-spec:
    met: true
    who: you
    label: You confirm the frozen crawler measurement specification (CR-SPEC)
  owner-migrations-on-main:
    met: true
    who: you
    label: v0.5.1 is tagged, or you allow a database migration on main before then
  m4-schema-settled:
    met: true
    who: done
    label: Store schema settled
  m4-swarm-fields:
    met: true
    who: done
    label: Swarm fields merged
  m4-done:
    met: true
    who: done
    label: Milestone 4 complete
  history-swap:
    met: true
    who: done
    label: History rewrite done
  release-branch-cut:
    met: true
    who: done
    label: Release branch cut
    auto: branch:release/v0.5.1
  migration-slot:
    met: false
    who: runner
    label: A free database-migration number (runner assigns V14)
  owner-rpq2:
    met: true
    who: you
    label: You decide what ThePornDB and StashDB may be sent (rule-pack Q2)
  owner-rpq3:
    met: true
    who: you
    label: You decide whether enrichment text is judged by the child-safety core (rule-pack Q3)
  owner-rpq4:
    met: true
    who: you
    label: You decide how performers are handled and that no age data is used (rule-pack Q4, Q5)
  owner-q1:
    met: true
    who: you
    label: You approve the consent wording (Q1)
    note: Approved 2026-11-06, docs/owner-decisions.md §2.49 (all four drafts, the Account sentence bounded)
  owner-q2:
    met: true
    who: you
    label: You decide the terms-of-service / robots position for sources (Q2)
  owner-q3:
    met: true
    who: you
    label: You choose which torrent caches may be contacted (Q3)
  owner-q7:
    met: true
    who: you
    label: You decide whether a Sukebei (adult) feed ships (Q7)
  owner-q15:
    met: true
    who: you
    label: You decide how private-source items get metadata (Q15)
  m7-schema-bump:
    met: false
    who: runner
    label: The runner schedules the v0.7 search-schema change
  owner-signing-cert:
    met: false
    who: you
    label: You provide a code-signing certificate
  v051-soak-verdict:
    met: true
    who: soak
    label: The 24-hour Unraid memory test gives its verdict
  v051-tagged:
    met: true
    who: you
    label: You tag and publish v0.5.1
    auto: tag:v0.5.1
  experiment-host:
    met: true
    who: you
    label: 'Booked for one run: cr-ab-comp-1, the bitmagnet comparator, 2026-11-07T13:00Z to about 2026-11-08T14:01Z on the Unraid box (§2.51). Back to false when it ends'
  owner-checkpoint-1:
    met: false
    who: you
    label: You re-decide at Checkpoint 1 if the crawler projection falls short
  import-host:
    met: false
    who: you
    label: You name the import host and restore the Bitmagnet dump
  owner-50m-approval:
    met: false
    who: you
    label: You approve the 50M import numbers
  owner-upload-exception:
    met: true
    who: you
    label: You decide the torrent-upload exception
  owner-import-server-surface:
    met: true
    who: you
    label: You approve the import-through-server attack surface
  release-after-parser:
    met: false
    who: time
    label: A release that reads the new range syntax has shipped
  owner-v07-q1:
    met: true
    who: you
    label: You decide whether the Stremio addon ships, and its access terms (v0.7 Q1)
  owner-v07-q2:
    met: true
    who: you
    label: You decide the terms for private-tracker IRC announces (v0.7 Q2)
  owner-v07-q3:
    met: true
    who: you
    label: You decide whether PreDB's live IRC feed may be used (v0.7 Q3)
  owner-v07-q4:
    met: true
    who: you
    label: You decide on AniDB, srrDB, PreDB and debrid lookups (v0.7 Q4)
  owner-v07-q5:
    met: true
    who: you
    label: You decide what general enrichment may send (v0.7 Q5; every enrichment slice waits on it)
  owner-v07-q6:
