[workspace]
resolver = "3"
members = ["crates/*", "bench"]
exclude = ["fuzz"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "AGPL-3.0-or-later"
repository = "https://github.com/dvortsis/lodestar-v2"

[workspace.dependencies]
lodestar-bencode = { path = "crates/bencode" }
lodestar-metainfo = { path = "crates/metainfo" }
lodestar-store = { path = "crates/store" }
lodestar-dht = { path = "crates/dht" }
lodestar-peer-wire = { path = "crates/peer-wire" }
lodestar-sources = { path = "crates/sources" }
lodestar-pipeline = { path = "crates/pipeline" }
lodestar-search = { path = "crates/search" }
lodestar-release-parser = { path = "crates/release-parser" }
lodestar-classify = { path = "crates/classify" }
lodestar-filter = { path = "crates/filter" }
lodestar-cluster = { path = "crates/cluster" }
lodestar-api = { path = "crates/api" }
lodestar-tracker-scrape = { path = "crates/tracker-scrape" }
lodestar-sources-importers = { path = "crates/sources-importers" }
lodestar-integrations = { path = "crates/integrations" }
lodestar-log = { path = "crates/log" }
lodestar-update = { path = "crates/update" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
debug = "line-tables-only"

# Parsers and codecs are exercised heavily by property tests; keep them fast.
[profile.test]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
