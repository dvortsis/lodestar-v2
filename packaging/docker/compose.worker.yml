# Lodestar worker: adds crawling and metadata capacity to an existing Lodestar
# (v0.6 or newer). It keeps no database and no web UI.
#
# 0. In the main Lodestar: Settings, Workers, turn on "Allow workers", and
#    publish its cluster port 8091/tcp (in its compose file, uncomment
#    `- "8091:8091/tcp"`). Keep that port on your home network or a private
#    link (Tailscale, WireGuard); don't forward it on your router.
# 1. In the main Lodestar: Settings, Workers, Add worker. Copy the address and
#    the one-time token (single-use, valid for 15 minutes).
# 2. Set LODESTAR_JOIN below to the address, then start the worker with the
#    token in your shell, so it never sits in this file:
#      LODESTAR_TOKEN=<the token> docker compose -f packaging/docker/compose.worker.yml up -d
# 3. When the log says "joined", start it again without the token:
#      docker compose -f packaging/docker/compose.worker.yml up -d
#    The worker keeps its own certificate in /data. A used token is harmless
#    (it works only once), but a token left in the container's settings stays
#    readable in `docker inspect`, and the worker logs a warning at every start.
#
# The worker only has to reach the main instance's cluster port (8091/tcp).
# Prefer a private link (Tailscale, WireGuard or your LAN) to the open internet.
name: lodestar-worker

services:
  worker:
    image: ghcr.io/dvortsis/lodestar-v2:latest
    container_name: lodestar-worker
    restart: unless-stopped
    command: ["worker"]
    # The image's health check asks the web UI, which a worker doesn't have,
    # so it would show "unhealthy" for good.
    healthcheck:
      disable: true
    # Shutdown flushes the spool; give it more than Docker's default 10 s.
    stop_grace_period: 60s

    environment:
      TZ: Etc/UTC
      # The main Lodestar's cluster address, https://host:8091.
      LODESTAR_JOIN: "https://192.168.1.10:8091"
      # FIRST START ONLY: comes from your shell (step 2), blank afterwards.
      # Never write a real token in this file.
      LODESTAR_TOKEN: ${LODESTAR_TOKEN:-}
      # LODESTAR_INTENSITY: balanced   # low | balanced | aggressive
      # The user and group the worker runs as. The default, 65532, is the
      # safe choice: leave these commented out unless the files in /data must
      # belong to a particular account (find its IDs with `id`). Never use 0:
      # that's root, which is unsafe, and Lodestar refuses it.
      # PUID: "65532"
      # PGID: "65532"
      # The DHT port inside the container; the mapping below is the host side.
      # LODESTAR_DHT_PORT: "6881"

    # Alternative to LODESTAR_TOKEN: a token file, which keeps the token out
    # of the container's environment. To use it:
    #   - delete the LODESTAR_TOKEN and LODESTAR_JOIN lines above;
    #   - REPLACE the `command: ["worker"]` line above with the command below;
    #   - uncomment `secrets:` below and the top-level `secrets:` block at the
    #     end of this file.
    # After the worker has joined, set `command:` back to ["worker"] and delete
    # the file: a token file always tries to join, so it must go once used.
    # (Without a `command:` the image starts a coordinator, not a worker.)
    # command: ["worker", "--join", "https://192.168.1.10:8091", "--token-file", "/run/secrets/join_token"]
    # secrets:
    #   - join_token

    volumes:
      # The worker's certificate and its on-disk spool (the spool/ folder
      # inside it, used while the main instance is unreachable). Use a folder
      # of its own on a local disk, never the main Lodestar's data folder.
      - lodestar-worker-data:/data

    # Only the DHT port is published. Host port 6882 so the worker can run on
    # the same machine as the main Lodestar (6881). Forward this UDP port on
    # your router for the best reach. No web UI, no cluster port.
    ports:
      - "6882:6881/udp"

# secrets:
#   join_token:
#     file: /etc/lodestar/join_token   # outside the repo; holds only the token. The worker reads it
#                                    # as user 65532 (or PUID): `chown 65532 /etc/lodestar/join_token`
#                                    # and `chmod 600` it

volumes:
  lodestar-worker-data:
