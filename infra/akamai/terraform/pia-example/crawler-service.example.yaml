# Documentation-only service snippet for Lodestar crawler behind Gluetun.
#
# Security rules:
#   - Never set network_mode: bridge or host for the crawler.
#   - Never mount /var/run/docker.sock into the crawler.
#   - Keep depends_on condition: service_healthy (never service_started).
#   - Apply no-new-privileges:true and cap_drop: ALL.
#   - For worker Linodes (g6-nanode-1), ensure memory limit stays below 512m.
#
services:
  crawler:
    image: ghcr.io/dvortsis/lodestar:v0.5.1
    container_name: lodestar_crawler
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    restart: "no"
