# The fleet VM's stack (OP-3a; docs/plan/2026-11-08-cloud-test-plan.md 0c-0e).
# Read at the fleet's pinned commit and copied to the VM by the steps; a change
# is a reviewed PR (tests in infra/fleet/tests/test_steps.py check its shape).
#
# - gluetun, pinned by its multi-arch index digest (v3.41.3; see
#   docs/decisions/2026-11-09-OP-3a.md), with PIA through its custom WireGuard
#   provider and its firewall on (the kill switch under test). The leak test
#   starts it alone.
# - gluetun's post-rules file (configs.gluetun-post-rules below), copied in
#   as a 0444 file: without it, gluetun lets connections that were open before the
#   tunnel dropped leave by eth0 (docs/decisions/2026-11-12-X-gluetun-leak.md).
# - lodestar in gluetun's network namespace, with every capability dropped
#   except the three it needs to drop root. Its image comes from the screen's
#   committed rules (start-block, OP-3b), validated there; it starts only with
#   the "block" profile.
# - No host port except the UI on the host's loopback, reached over `ssh -L`.
name: lodestar
services:
  gluetun:
    image: qmcgaw/gluetun@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      VPN_INTERFACE: wg0  # named, so the leak test reads it rather than assuming
      FIREWALL_VPN_INPUT_PORTS: ""
      TZ: Etc/UTC
    volumes:
      - ./secrets/wg0.conf:/gluetun/wireguard/wg0.conf:ro
    # Compose copies a config into the container (mode 0444, so only gluetun's
    # own root could change it). gluetun reads it once, when it turns its
    # firewall on, before the tunnel starts.
    configs:
      - source: gluetun-post-rules
        target: /iptables/post-rules.txt
    ports:
      - "127.0.0.1:8090:8090"
    oom_score_adj: -500
    restart: unless-stopped
  lodestar:
    image: ${LODESTAR_IMAGE:?start-block sets it from the screen rules}
    container_name: lodestar
    network_mode: service:gluetun
    depends_on:
      - gluetun
    profiles:
      - block
    # The arm comes from start-block and arm-switch (block-lib.sh). A bare name
    # passes the caller's value through, and leaves the variable unset when the
    # caller has none, so every other switch stays at its shipped default.
    environment:
      - TZ=Etc/UTC
      - LODESTAR_DHT_SAFE_RESTART
      - LODESTAR_DHT_COORDINATED_ADMISSION
      - LODESTAR_DHT_UTP
      - LODESTAR_DHT_ROUTE_BACKOFF
    # The restart witness on the host, outside the data folder (CR-SPEC 2.3,
    # plan 0e), so a recreated container (every arm switch) is a resumed start.
    volumes:
      - ./data:/data
      - ./witness:/var/lib/lodestar-witness
    # No raw sockets (NET_RAW could send frames past gluetun's firewall). Only
    # what the image needs to hand /data over and drop root
    # (packaging/docker/README.md).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    restart: "no"
  # The collector's only way to Docker (OP-3b, the runner's decision): HAProxy
  # with the committed docker-proxy.cfg, rendered by block-lib.sh with the exact
  # container and image IDs. Only this service mounts Docker's socket, read-only.
  # No network, no capabilities, a read-only root; it runs as the image's own
  # haproxy user, with the socket's group added. 3.2.25 LTS, by its multi-arch
  # index digest (docs/decisions/2026-11-11-OP-3b.md).
  docker-proxy:
    image: haproxy@sha256:5d97434a423c2533cfeb42874d45cf6d69a840b60334582dfbfd5008e94c80be
    container_name: lodestar-docker-proxy
    network_mode: none
    profiles:
      - block
    group_add:
      - ${DOCKER_GID:?start-block sets it from the socket's group}
    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./proxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./proxy-sock:/sock
    restart: "no"
# gluetun's post-rules (X-gluetun-leak). gluetun v3.41.3 accepts every
# ESTABLISHED,RELATED packet on any interface, ahead of its `-o wg0` accept. So
# when wg0 goes down, a connection opened through the tunnel is routed out of
# eth0 and passes. gluetun runs each line that starts with `iptables ` or
# `ip6tables ` and skips every other line, so these comments are inert.
# Every rule only marks or drops: none accepts anything gluetun doesn't.
# The same text is packaging/companions/gluetun-post-rules.txt (a test checks).
configs:
  gluetun-post-rules:
    content: |
      # Lodestar's post-rules for gluetun (checked on v3.41.3). gluetun reads this
      # file at /iptables/post-rules.txt when it turns its firewall on, before the
      # tunnel starts. It runs each line that starts with "iptables " or
      # "ip6tables " and skips every other line.
      # Why: gluetun accepts packets of an open connection on any interface. When
      # the tunnel drops, a connection opened through it is routed out of your
      # normal network, and those packets pass. These rules stop that.
      # Every rule only marks or drops traffic; none lets anything new through.
      # They name the tunnel wg0: set VPN_INTERFACE=wg0 on gluetun. Its image
      # defaults to tun0, and with another name these rules do nothing.
      # 1. Mark every connection that sends a packet out of the tunnel: set one
      #    bit of its conntrack mark. CONNMARK changes no verdict.
      iptables -I OUTPUT 1 -o wg0 -j CONNMARK --set-xmark 0x800000/0x800000
      ip6tables -I OUTPUT 1 -o wg0 -j CONNMARK --set-xmark 0x800000/0x800000
      # 2. A marked connection never leaves by any other interface. Loopback,
      #    the Docker network, replies to the web UI and WireGuard's own UDP
      #    to the endpoint never use the tunnel, so they keep their mark clear.
      iptables -I OUTPUT 2 ! -o wg0 -m connmark --mark 0x800000/0x800000 -j DROP
      ip6tables -I OUTPUT 2 ! -o wg0 -m connmark --mark 0x800000/0x800000 -j DROP
      # 3. No ICMP leaves outside the tunnel, of any type: not errors (with the
      #    tunnel down, the endpoint's packets draw "port unreachable" from the
      #    host's address) and not gluetun's health-check pings to the VPN server.
      #    gluetun needs none outside the tunnel. Exempt: this container's own
      #    addresses (loopback keeps its errors) and, for IPv6, link-local
      #    destinations, multicast destinations of any scope, and anything with
      #    hop limit 255 (neighbour discovery). None of these can carry a flow off
      #    the tunnel: rule 2 and gluetun's own policy still apply to them.
      #    Side effect: the container no longer answers pings from your network.
      iptables -I OUTPUT 3 ! -o wg0 -p icmp -m addrtype ! --dst-type LOCAL -j DROP
      ip6tables -I OUTPUT 3 ! -o wg0 -p ipv6-icmp ! -d fe80::/10 -m addrtype ! --dst-type LOCAL,MULTICAST -m hl ! --hl-eq 255 -j DROP
