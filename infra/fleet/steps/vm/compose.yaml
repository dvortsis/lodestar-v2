# The fleet VM's stack (OP-3a; docs/plan/2026-11-08-cloud-test-plan.md 0c-0e).
# Read at the fleet's pinned commit and copied to the VM by the steps; a change
# is a reviewed PR (tests in infra/fleet/tests/test_steps.py check its shape).
#
# - gluetun, pinned by its multi-arch index digest (v3.41.3; see
#   docs/decisions/2026-11-09-OP-3a.md), with PIA through its custom WireGuard
#   provider and its firewall on (the kill switch under test). The leak test
#   starts it alone.
# - lodestar in gluetun's network namespace, with every capability dropped
#   except the three it needs to drop root. Its image comes from the screen's
#   committed rules (start-block, OP-3b), validated there; it starts only with
#   the "block" profile.
# - No host port except the UI on the host's loopback, reached over `ssh -L`.
name: lodestar
services:
  gluetun:
    image: qmcgaw/gluetun@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      VPN_INTERFACE: wg0  # named, so the leak test reads it rather than assuming
      FIREWALL_VPN_INPUT_PORTS: ""
      TZ: Etc/UTC
    volumes:
      - ./secrets/wg0.conf:/gluetun/wireguard/wg0.conf:ro
    ports:
      - "127.0.0.1:8090:8090"
    oom_score_adj: -500
    restart: unless-stopped
  lodestar:
    image: ${LODESTAR_IMAGE:?start-block sets it from the screen rules}
    container_name: lodestar
    network_mode: service:gluetun
    depends_on:
      - gluetun
    profiles:
      - block
    # The arm comes from start-block and arm-switch (block-lib.sh). A bare name
    # passes the caller's value through, and leaves the variable unset when the
    # caller has none, so every other switch stays at its shipped default.
    environment:
      - TZ=Etc/UTC
      - LODESTAR_DHT_SAFE_RESTART
      - LODESTAR_DHT_COORDINATED_ADMISSION
      - LODESTAR_DHT_UTP
      - LODESTAR_DHT_ROUTE_BACKOFF
    volumes:
      - ./data:/data
    # No raw sockets (NET_RAW could send frames past gluetun's firewall). Only
    # what the image needs to hand /data over and drop root
    # (packaging/docker/README.md).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    restart: "no"
