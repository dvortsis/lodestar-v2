# The collector's only way to Docker (OP-3b; the runner's decision, 2026-11-11):
# HAProxy between a unix socket shared only with the collector and Docker's own
# socket, which only this container mounts (read-only). block-lib.sh renders it
# with the exact IDs read on the host when Lodestar's container is up, and
# never while a collector runs. Each rule is one method and one path, with an
# optional /v1.NN prefix; everything else is 403.
global
    maxconn 16

defaults
    mode http
    timeout connect 5s
    timeout http-request 10s
    # collect.py's stop call blocks until Lodestar has stopped (its 60 s grace).
    timeout client 150s
    timeout server 150s

frontend docker_api
    bind unix@/sock/docker.sock mode 666
    acl get    method GET
    acl head   method HEAD
    acl post   method POST
    acl inspect_lodestar path -m reg ^(/v1\.[0-9]{1,3})?/containers/(lodestar|@LODESTAR_ID@)/json$
    acl inspect_parent   path -m reg ^(/v1\.[0-9]{1,3})?/containers/@GLUETUN_ID@/json$
    acl image            path -m reg ^(/v1\.[0-9]{1,3})?/images/sha256(:|%3[Aa])@IMAGE_ID@/json$
    acl archive          path -m reg ^(/v1\.[0-9]{1,3})?/containers/@LODESTAR_ID@/archive$
    acl stats            path -m reg ^(/v1\.[0-9]{1,3})?/containers/@LODESTAR_ID@/stats$
    acl no_stream        url_param(stream) -m str false
    acl stop             path -m reg ^(/v1\.[0-9]{1,3})?/containers/@LODESTAR_ID@/stop$
    http-request allow if get inspect_lodestar
    http-request allow if get inspect_parent
    http-request allow if get image
    http-request allow if head archive
    http-request allow if get stats no_stream
    http-request allow if post stop
    http-request deny deny_status 403
    default_backend engine

backend engine
    server docker /var/run/docker.sock
